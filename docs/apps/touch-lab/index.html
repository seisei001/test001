<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="iPhone操作検証">
<title>iPhone操作検証</title>
<style>
:root{color-scheme:light dark;--bg:#f7f7f8;--panel:#fff;--border:#dcdce0;--text:#1c1c1f;--muted:#6b6b73;--accent:#2563eb;--ok:#16a34a;--sel:#f59e0b;}
@media (prefers-color-scheme:dark){:root{--bg:#111114;--panel:#1c1c20;--border:#35353c;--text:#ececf0;--muted:#9a9aa5;}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html{-webkit-text-size-adjust:100%;}
body{margin:0;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic",sans-serif;background:var(--bg);color:var(--text);line-height:1.5;}
header{padding:12px 16px 4px;max-width:720px;margin:0 auto;}
.back-link{display:inline-block;margin-bottom:4px;color:var(--muted);text-decoration:none;font-size:.85rem;}
h1{margin:0;font-size:1.25rem;display:flex;align-items:baseline;gap:8px;}
.ver{font-size:.75rem;color:var(--muted);border:1px solid var(--border);border-radius:99px;padding:0 8px;font-weight:400;}
main{max-width:720px;margin:0 auto;padding:0 16px 40px;display:flex;flex-direction:column;gap:12px;}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:12px;}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{flex:1;min-width:90px;min-height:44px;border:1px solid var(--accent);background:transparent;color:var(--accent);border-radius:8px;font-size:.9rem;}
.tabs button.on{background:var(--accent);color:#fff;}
.how{margin:8px 0 0;font-size:.88rem}
.how b{color:var(--accent)}
#board{position:relative;height:260px;border:2px dashed var(--border);border-radius:10px;background:repeating-linear-gradient(45deg,transparent 0 12px,rgba(128,128,128,.07) 12px 24px);user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;overflow:hidden}
.obj{position:absolute;width:84px;height:104px;border:2px solid var(--border);border-radius:8px;background:var(--panel);display:flex;align-items:center;justify-content:center;font-size:1.6rem;font-weight:700}
.obj.sel{border-color:var(--sel);box-shadow:0 0 0 3px rgba(245,158,11,.35)}
#rubber{position:absolute;border:1px dashed var(--accent);background:rgba(37,99,235,.12);display:none}
.dot{position:absolute;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;background:rgba(37,99,235,.5);pointer-events:none;animation:f .7s forwards}
@keyframes f{to{opacity:0;transform:scale(2.2)}}
.set{display:flex;flex-direction:column;gap:4px;font-size:.88rem}
.set input[type=range]{width:100%;min-height:32px}
.set select{font-size:16px;min-height:44px;width:100%}
#res{display:grid;grid-template-columns:1fr auto;gap:4px 8px;font-size:.9rem}
#res .n{font-weight:700;font-variant-numeric:tabular-nums;color:var(--ok)}
#last{margin-top:8px;padding:8px;border-radius:8px;background:rgba(22,163,74,.1);min-height:44px;font-size:.88rem;word-break:break-all}
#log{height:220px;overflow:auto;font:12px/1.4 ui-monospace,Menlo,monospace;white-space:pre-wrap;background:rgba(128,128,128,.08);border-radius:8px;padding:8px}
.row{display:flex;gap:8px}
.row button{flex:1;min-height:44px;border:none;border-radius:8px;background:var(--accent);color:#fff;font-size:.95rem}
.row button.sub{background:transparent;border:1px solid var(--accent);color:var(--accent)}
#board2{display:none;flex-wrap:wrap;gap:10px;padding:10px;border:2px dashed var(--border);border-radius:10px;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.c4{position:relative;width:96px;height:132px;border:2px solid var(--border);border-radius:8px;background:var(--panel);display:flex;align-items:center;justify-content:center;font-size:1.6rem;font-weight:700}
.c4.drag{opacity:.85;box-shadow:0 8px 20px rgba(0,0,0,.35);z-index:5;position:relative}
.c4 .ck{position:absolute;left:-2px;top:-2px;width:44px;height:44px;display:flex;align-items:center;justify-content:center}
.c4 .ck input{width:24px;height:24px}
.c4 .mn{position:absolute;right:-2px;top:-2px;width:44px;height:44px;display:flex;align-items:center;justify-content:center;border:none;background:transparent;color:var(--text);font-size:1.4rem;margin:0;padding:0;border-radius:8px}
.c4.mv{touch-action:none;cursor:grab}
.c4 .hd{display:none;position:absolute;left:0;right:0;bottom:0;height:44px;display:flex;align-items:center;justify-content:center;background:rgba(128,128,128,.18);border-radius:0 0 6px 6px;font-size:1.3rem;touch-action:none;cursor:grab}
.c4.sel{border-color:var(--sel)}
.lp{box-shadow:0 0 0 4px rgba(37,99,235,.5)!important;transition:box-shadow .15s}
#board3{display:none;position:relative;border:2px dashed var(--border);border-radius:10px;padding:8px 12px;touch-action:pan-y;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#board3 .ln{padding:8px;border:1px solid var(--border);border-radius:6px;margin:10px 0;background:var(--panel);font-size:15px}
#board3 .ln.sel{background:rgba(245,158,11,.35);border-color:var(--sel)}
#rub3{position:absolute;border:2px dashed var(--accent);background:rgba(37,99,235,.14);display:none;pointer-events:none}
h2{margin:0 0 6px;font-size:1rem}
.sub{color:var(--muted);font-size:.8rem}
</style>
</head>
<body>
<header>
<a class="back-link" href="../../">← ハブに戻る</a>
<h1><span id="fn">iPhone操作検証</span><span class="ver" id="ver">0.05</span></h1>
<div class="sub">指の動きをどう読み取れるかを調べる実験場です(端末内だけで動きます)</div>
</header>
<main>
<div class="panel">
<div class="tabs" id="tabs">
<button data-t="1" class="on">① 同じ場所を2回</button>
<button data-t="2">② 選んでから2回</button>
<button data-t="3">③ その他の案</button>
<button data-t="4">④ 選択・⋮・動かす</button>
<button data-t="5">⑤ 選ぶ動き(長押し/2本指)</button>
</div>
<div class="how" id="how"></div>
</div>

<div id="board" aria-label="実験ボード">
<div class="obj" style="left:14px;top:20px" data-id="A">A</div>
<div class="obj" style="left:120px;top:60px" data-id="B">B</div>
<div class="obj" style="left:226px;top:20px" data-id="C">C</div>
<div id="rubber"></div>
</div>

<div id="board2" aria-label="実験④"></div>
<div id="board3" aria-label="実験⑤"><div id="rub3"></div></div>

<div class="panel">
<h2>判定(何回検出されたか)</h2>
<div id="res"></div>
<div id="last">ボードをタッチしてください</div>
</div>

<div class="panel">
<h2>しきい値の設定</h2>
<div class="set">
<label for="gap">2回の間隔の上限 <b id="gapv">350</b>ms</label>
<input type="range" id="gap" min="150" max="800" step="10" value="350">
<label for="dist" style="margin-top:8px">2回の位置のずれの上限 <b id="distv">24</b>px</label>
<input type="range" id="dist" min="4" max="80" step="2" value="24">
<label for="ta" style="margin-top:8px">ボードの touch-action(画面側の拡大・移動の邪魔をするか)</label>
<select id="ta"><option value="none">none(全部こちらで受ける)</option><option value="manipulation">manipulation(ダブルタップ拡大なし・ピンチ/移動は有効)</option><option value="auto">auto(ブラウザ任せ)</option></select>
<label for="m5" style="margin-top:8px">実験⑤のスクロール方式(1本指のドラッグ)</label>
<select id="m5"><option value="pan">ブラウザ任せ(touch-action: pan-y。ふつうの慣性スクロール)</option><option value="none">自前(touch-action: none。長押し・2本指は奪われないが、慣性スクロールなし)</option></select>
<label style="margin-top:8px;display:flex;gap:8px;align-items:center;min-height:44px"><input type="checkbox" id="pdT" checked style="width:22px;height:22px"> 指を離した瞬間の拡大を止める(touchend の preventDefault)</label>
<label style="display:flex;gap:8px;align-items:center;min-height:44px"><input type="checkbox" id="pdG" checked style="width:22px;height:22px"> ページ全体のピンチ拡大を止める(gesturestart)</label>
</div>
</div>

<div class="panel">
<h2>ログ</h2>
<div id="log"></div>
<div class="row" style="margin-top:8px"><button id="copy">ログをコピー</button><button class="sub" id="clr">消す</button></div>
<div class="sub" style="margin-top:6px">結果をチャットに貼ってもらえると、そのまま分析できます</div>
</div>
</main>
<script>
(()=>{
"use strict";
const $=id=>document.getElementById(id);
const board=$("board"),rub=$("rubber"),logEl=$("log");
const HOW={
1:"<b>やること:</b> 背景(何もない所)と物(A・B・C)で、それぞれ <b>同じ場所を素早く2回タップ</b>。次に、1回目と2回目を少しずらしてタップ(どこまでずれると2回と判定されるか)。ゆっくり2回も試す(間隔の上限を超えるか)。",
2:"<b>やること:</b> 物をタップして <b>選択(橙の枠)</b>。そのまま <b>同じ物をもう一度素早く2回タップ</b>(選択済みでのダブルタップ)。選択して少し待ってから2回、別の物を選んでから2回、も試す。選択の状態も一緒に記録されます。",
4:"<b>やること:</b> 最初は <b>カード1が選択</b>されています。<b>ちょうど1枚だけ選んでいるとき、そのカードの本体をつかんで動かせます</b>(橙の枠のカード)。☑(左上)で選択を変える、⋮(右上)でメニュー。何も選んでいないとき・2枚以上選んでいるときは動きません。選択していないカードをなぞると、ページが普通にスクロールするかも確かめてください。",
5:"<b>やること(ページを模した文章の行を、選ぶ実験です):</b> ⓐ <b>1本指でなぞる</b> → ページが普通にスクロールするか(選択は何も起きない)。ⓑ <b>1本の指で、行を長押し</b>(0.5秒。青い輪が出る)→ その行が選ばれる。ⓒ 長押しのまま <b>そのままドラッグ</b> → 四角の範囲に入った行が選ばれる(途中でページが動かないか)。ⓓ <b>2本の指を置いて</b>、そのまま広げる・動かす → 2本の指を角にした四角の範囲が選ばれる(拡大・スクロールにならないか)。どれも、やりやすさと、間違って動いた点を、ログと一緒に教えてください。",
3:"<b>案:</b> ⓐ長押し(0.5秒) ⓑ2本指で同時にタップ ⓒ1回タップ→すぐ押したままドラッグ(ダブルタップ+ドラッグ) ⓓ3回連続タップ ⓔ背景をドラッグして範囲選択(物が橙になる) ⓕ2本指でつまむ/動かす(画面側の拡大・移動と競合しないか、ログの scale/スクロールを見る)"
};
let tab=1;
function setTab(t){tab=t;$("board").style.display=(t===4||t===5)?"none":"block";$("board2").style.display=t===4?"flex":"none";$("board3").style.display=t===5?"block":"none";document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on",+b.dataset.t===t));$("how").innerHTML=HOW[t];log("-- 実験 "+t+" に切替 --");}
$("tabs").onclick=e=>{const b=e.target.closest("button");if(b)setTab(+b.dataset.t);};

// ---- ログ ----
const lines=[];const T0=performance.now();
const vs=()=>window.visualViewport?window.visualViewport.scale.toFixed(2):"-";
function log(s){const t=((performance.now()-T0)/1000).toFixed(3);const l=`${t} ${s}`;lines.push(l);if(lines.length>400)lines.shift();logEl.textContent=lines.slice(-80).join("\n");logEl.scrollTop=logEl.scrollHeight;}
$("clr").onclick=()=>{lines.length=0;logEl.textContent="";Object.keys(cnt).forEach(k=>cnt[k]=0);renderRes();};
$("copy").onclick=async()=>{const txt=`[iPhone操作検証 ${$("ver").textContent}] UA:${navigator.userAgent}\nしきい値: 間隔${gap}ms/距離${dist}px/touch-action:${board.style.touchAction}\n`+lines.join("\n");
  try{await navigator.clipboard.writeText(txt);$("copy").textContent="コピーしました";}catch(e){const ta=document.createElement("textarea");ta.value=txt;document.body.appendChild(ta);ta.select();try{document.execCommand("copy");$("copy").textContent="コピーしました";}catch(_){$("copy").textContent="コピー失敗(ログを長押しで選択)";}ta.remove();}
  setTimeout(()=>$("copy").textContent="ログをコピー",1800);};

// ---- 設定 ----
let gap=350,dist=24;
$("gap").oninput=e=>{gap=+e.target.value;$("gapv").textContent=gap;};
$("dist").oninput=e=>{dist=+e.target.value;$("distv").textContent=dist;};
$("ta").onchange=e=>{board.style.touchAction=e.target.value;log("touch-action → "+e.target.value);};
board.style.touchAction="none";
// iPhoneのSafariは touch-action だけではダブルタップ拡大を止めきれないので、離した瞬間の既定動作とピンチ拡大も止める
let pdT=true,pdG=true;
$("pdT").onchange=e=>{pdT=e.target.checked;log("touchendで拡大を止める → "+pdT);};
$("pdG").onchange=e=>{pdG=e.target.checked;log("ピンチ拡大を止める → "+pdG);};
board.addEventListener("touchend",e=>{if(pdT&&e.cancelable)e.preventDefault();},{passive:false});
["gesturestart","gesturechange","gestureend"].forEach(n=>document.addEventListener(n,e=>{if(pdG)e.preventDefault();},{passive:false}));

// ---- 判定の集計 ----
const NAMES={native:"ブラウザ標準の dblclick",dtap:"ダブルタップ(自前判定)",dtapSel:"ダブルタップ(選択済みの物の上)",triple:"3回連続タップ",long:"長押し 0.5秒",two:"2本指タップ",dtapDrag:"タップ→押したままドラッグ",range:"範囲選択(ドラッグ)",tap:"単タップ",lpSel:"長押し:行を選んだ",lpRange:"長押し→ドラッグ:範囲選択",lpLost:"長押し後に奪われた(キャンセル)",twoRange:"2本指ドラッグ:範囲選択",twoLost:"2本指が奪われた(キャンセル)",moved:"選択中にページが動いた",twoDbl:"2本指ダブルタップ",chk:"☑ チェック",menu:"⋮ メニュー",grab:"動かす: つかんだ",reorder:"動かす: 並べ替え完了",hcancel:"動かす: 途中でキャンセルされた",body:"カード本体のタップ"};
const cnt={};Object.keys(NAMES).forEach(k=>cnt[k]=0);
function renderRes(){$("res").innerHTML=Object.keys(NAMES).map(k=>`<span>${NAMES[k]}</span><span class="n">${cnt[k]}</span>`).join("");}
renderRes();
function hit(k,msg){cnt[k]++;renderRes();$("last").textContent=`${NAMES[k]}: ${msg}`;log(`★${NAMES[k]} ${msg}`);}

// ---- 選択 ----
const objs=[...board.querySelectorAll(".obj")];
const sel=new Set();
const paintSel=()=>objs.forEach(o=>o.classList.toggle("sel",sel.has(o.dataset.id)));
const objAt=t=>t&&t.closest&&t.closest(".obj");

// ---- ポインタの追跡 ----
const ptrs=new Map();           // 触れている指
let lastTap=null,tapChain=0,twoInfo=null,pending=null,lastTwo=0,twoDone=0;
const rel=e=>{const r=board.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top};};
const dot=(x,y)=>{const d=document.createElement("div");d.className="dot";d.style.left=x+"px";d.style.top=y+"px";board.appendChild(d);setTimeout(()=>d.remove(),800);};
const nameOf=o=>o?o.dataset.id:"背景";

board.addEventListener("pointerdown",e=>{
  const p=rel(e),now=performance.now(),o=objAt(e.target);
  ptrs.set(e.pointerId,{x0:p.x,y0:p.y,x:p.x,y:p.y,t0:now,moved:false,obj:o,type:e.pointerType,selBefore:o?sel.has(o.dataset.id):false});
  dot(p.x,p.y);
  log(`down  #${e.pointerId} ${e.pointerType} (${p.x|0},${p.y|0}) 対象:${nameOf(o)} 指:${ptrs.size} scale:${vs()}`);
  const me=ptrs.get(e.pointerId);
  if(ptrs.size===2){twoInfo={t:now,moved:false};clearTimeout(me.lp);for(const q of ptrs.values())clearTimeout(q.lp);}
  else{
    // 長押し
    me.lp=setTimeout(()=>{if(ptrs.has(e.pointerId)&&!me.moved&&ptrs.size===1){me.long=true;(o||board).classList.add("lp");setTimeout(()=>(o||board).classList.remove("lp"),400);hit("long",`対象:${nameOf(o)} (${me.x|0},${me.y|0})`);}},500);
    // 1回目のタップのすぐ後に押したか(タップ→ドラッグ)
    if(lastTap&&now-lastTap.t<gap&&Math.hypot(p.x-lastTap.x,p.y-lastTap.y)<=dist)me.afterTap=true;
  }
  if(ptrs.size===1&&!o){me.range=true;}
});
board.addEventListener("pointermove",e=>{
  const q=ptrs.get(e.pointerId);if(!q)return;const p=rel(e);q.x=p.x;q.y=p.y;
  if(!q.moved&&Math.hypot(p.x-q.x0,p.y-q.y0)>8){q.moved=true;clearTimeout(q.lp);
    if(twoInfo)twoInfo.moved=true;
    log(`move開始 #${e.pointerId} ずれ${Math.hypot(p.x-q.x0,p.y-q.y0)|0}px`+(q.afterTap?" (直前のタップの直後に押した→ダブルタップ+ドラッグ)":""));
    if(q.afterTap&&ptrs.size===1)hit("dtapDrag",`1回目から${(performance.now()-lastTap.t)|0}ms後に押してドラッグ`);
  }
  if(q.moved&&q.range&&ptrs.size===1&&!q.afterTap){
    const x=Math.min(q.x0,p.x),y=Math.min(q.y0,p.y),w=Math.abs(p.x-q.x0),h=Math.abs(p.y-q.y0);
    Object.assign(rub.style,{display:"block",left:x+"px",top:y+"px",width:w+"px",height:h+"px"});
    sel.clear();objs.forEach(o=>{const l=o.offsetLeft,t=o.offsetTop;if(l<x+w&&l+o.offsetWidth>x&&t<y+h&&t+o.offsetHeight>y)sel.add(o.dataset.id);});paintSel();
  }
});
function end(e,cancel){
  const q=ptrs.get(e.pointerId);if(!q)return;clearTimeout(q.lp);
  const now=performance.now(),dur=now-q.t0;
  log(`${cancel?"cancel":"up   "} #${e.pointerId} 押していた${dur|0}ms 動き:${q.moved?"あり":"なし"} 指:${ptrs.size} scale:${vs()}`);
  const wasTwo=twoInfo&&ptrs.size===2;
  ptrs.delete(e.pointerId);
  if(rub.style.display==="block"&&ptrs.size===0){rub.style.display="none";hit("range",`選択:${[...sel].join(",")||"なし"}`);}
  if(cancel)return;
  if(wasTwo&&!twoInfo.moved&&now-twoInfo.t<400){hit("two","2本指が同時に触れて離れた("+(now-twoInfo.t|0)+"ms)");twoInfo.done=true;twoDone=now;if(lastTwo&&now-lastTwo<=gap){hit("twoDbl","間隔"+(now-lastTwo|0)+"ms");lastTwo=0;}else lastTwo=now;return;}
  if(ptrs.size===0)twoInfo=null;
  if(q.moved||q.long||twoInfo||dur>350||now-twoDone<300)return;   // 2本指タップの残りの指の離れは、単タップに数えない
  // ---- ここから「タップ」 ----
  const o=q.obj,id=o?o.dataset.id:null;
  // 選択(物をタップすると選択が切り替わる)
  const selBefore=id?sel.has(id):false;
  if(id){if(!selBefore){sel.clear();sel.add(id);}}else if(sel.size){sel.clear();}
  paintSel();
  const selAfter=id?sel.has(id):false;
  hit("tap",`対象:${nameOf(o)} 選択 ${selBefore?"済":"前"}→${selAfter?"済":"なし"}`);
  const prev=lastTap,d=prev?Math.hypot(q.x-prev.x,q.y-prev.y):0,iv=prev?now-prev.t:0;
  if(prev&&iv<=gap&&d<=dist){
    tapChain++;
    const same=prev.id===id;
    const info=`間隔${iv|0}ms ずれ${d|0}px 対象:${nameOf(o)}${same?"(同じ)":"(別: 前は"+(prev.id||"背景")+")"} 1回目の時点の選択:${prev.selAfter?"済":"なし"} 2回目の直前の選択:${selBefore?"済":"なし"}`;
    if(tapChain===2){hit("dtap",info);if(id&&selBefore)hit("dtapSel",info);}
    else if(tapChain===3){hit("triple",info);}
    lastTap=tapChain>=3?null:{x:q.x,y:q.y,t:now,id,selAfter};if(!lastTap)tapChain=0;
  }else{
    if(prev)log(`  (前のタップとは別扱い: 間隔${iv|0}ms ${iv>gap?"→長すぎ":""} ずれ${d|0}px ${d>dist?"→離れすぎ":""})`);
    tapChain=1;lastTap={x:q.x,y:q.y,t:now,id,selAfter};
  }
}
board.addEventListener("pointerup",e=>end(e,false));
board.addEventListener("pointercancel",e=>end(e,true));
board.addEventListener("dblclick",e=>{hit("native",`対象:${nameOf(objAt(e.target))}`);});
board.addEventListener("contextmenu",e=>e.preventDefault());
// 画面側の動き(拡大・スクロール)を記録
if(window.visualViewport){let ls=1;visualViewport.addEventListener("resize",()=>{const s=visualViewport.scale;if(Math.abs(s-ls)>.01){log(`⚠画面の拡大率が変わった ${ls.toFixed(2)}→${s.toFixed(2)}`);ls=s;}});}
let scT=0,scN=0,scY0=0;window.addEventListener("scroll",()=>{if(!scN)scY0=scrollY;scN++;clearTimeout(scT);scT=setTimeout(()=>{log(`⚠ページがスクロールした y=${scY0|0}→${scrollY|0}(${scN}回分まとめ)`);scN=0;},250);},{passive:true});

// ---- 実験④: ☑ チェック・⋮ メニュー・持ち手(⠿)で並べ替え ----
const b2=$("board2");
["1","2","3","4","5"].forEach(n=>{const c=document.createElement("div");c.className="c4";c.dataset.id=n;
  c.innerHTML=`<label class="ck"><input type="checkbox" aria-label="選択"></label><button class="mn" aria-label="メニュー">⋮</button>${n}`;b2.appendChild(c);});
const updMv=()=>{const on=[...b2.children].filter(c=>c.querySelector(".ck input").checked);[...b2.children].forEach(c=>{c.classList.toggle("sel",c.querySelector(".ck input").checked);c.classList.toggle("mv",on.length===1&&on[0]===c);});};
b2.addEventListener("change",e=>{if(e.target.matches(".ck input")){const c=e.target.closest(".c4");updMv();hit("chk",`カード${c.dataset.id} ${e.target.checked?"選択":"解除"} (選択中:${[...b2.children].filter(k=>k.querySelector(".ck input").checked).length}枚)`);}});
b2.children[0].querySelector(".ck input").checked=true;updMv();   // 最初は左上のカードが選択されている
b2.addEventListener("click",e=>{const m=e.target.closest(".mn");if(m){hit("menu",`カード${m.closest(".c4").dataset.id}`);return;}
  if(e.target.closest(".ck"))return;const c=e.target.closest(".c4");if(c&&!gd&&performance.now()-lastDragEnd>400)hit("body",`カード${c.dataset.id}のタップ`);});
let gd=null,lastDragEnd=0;
b2.addEventListener("pointerdown",e=>{const c=e.target.closest(".c4.mv");if(!c||e.target.closest(".ck,.mn"))return;
  gd={id:e.pointerId,c,sx:e.clientX,sy:e.clientY,from:[...b2.children].indexOf(c),moves:0,type:e.pointerType};
  c.setPointerCapture(e.pointerId);c.classList.add("drag");hit("grab",`カード${c.dataset.id} ${e.pointerType}`);
  log(`  本体 down ${e.pointerType} scale:${vs()}`);});
b2.addEventListener("pointermove",e=>{if(!gd||e.pointerId!==gd.id)return;gd.moves++;
  const c=gd.c;c.style.transform=`translate(${e.clientX-gd.sx}px,${e.clientY-gd.sy}px)`;
  const kids=[...b2.children].filter(k=>k!==c);
  const cr=c.getBoundingClientRect(),cx=cr.left+cr.width/2,cy=cr.top+cr.height/2;
  let ref=null;for(const k of kids){const r=k.getBoundingClientRect();if(cy<r.bottom&&cx<r.left+r.width/2&&cy>r.top-10){ref=k;break;}if(cy<r.top){ref=k;break;}}
  const before=[...b2.children].indexOf(c);
  const oldRect=c.getBoundingClientRect();
  if(ref!==c.nextElementSibling&&ref!==c){b2.insertBefore(c,ref);}
  // DOM上の位置が変わった分、見た目がずれないよう開始点を補正
  const nr=c.getBoundingClientRect();gd.sx+=nr.left-oldRect.left+0;gd.sy+=nr.top-oldRect.top+0;c.style.transform=`translate(${e.clientX-gd.sx}px,${e.clientY-gd.sy}px)`;
});
function endG(e,cancel){if(!gd||e.pointerId!==gd.id)return;const c=gd.c;c.classList.remove("drag");c.style.transform="";
  const to=[...b2.children].indexOf(c);log(`  本体 ${cancel?"cancel":"up"} 動いた回数:${gd.moves} ${gd.type} scale:${vs()}`);
  if(cancel)hit("hcancel",`カード${c.dataset.id} 動いた回数:${gd.moves}`);else if(gd.moves>1)hit("reorder",`カード${c.dataset.id} ${gd.from+1}番目→${to+1}番目 (${gd.moves}回動いた)`);
  gd=null;lastDragEnd=performance.now();}
b2.addEventListener("pointerup",e=>endG(e,false));
b2.addEventListener("pointercancel",e=>endG(e,true));

// ---- 実験⑤: 長押し→ドラッグ / 2本指ドラッグ で、行を選ぶ(1本指のドラッグは、ふつうのスクロール) ----
const b3=$("board3"),rub3=$("rub3");
["吾輩は猫である。名前はまだ無い。","どこで生れたかとんと見当がつかぬ。","何でも薄暗いじめじめした所で","ニャーニャー泣いていた事だけは記憶している。","吾輩はここで始めて人間というものを見た。","しかもあとで聞くとそれは書生という","人間中で一番獰悪な種族であったそうだ。","この書生というのは時々我々を捕えて","煮て食うという話である。","しかしその当時は何という考もなかったから","別段恐しいとも思わなかった。","ただ彼の掌に載せられてスーと持ち上げられた時","何だかフワフワした感じがあったばかりである。"].forEach((t,i)=>{const d=document.createElement("div");d.className="ln";d.textContent=(i+1)+". "+t;b3.appendChild(d);});
const lns=[...b3.querySelectorAll(".ln")];
$("m5").onchange=e=>{b3.style.touchAction=e.target.value==="none"?"none":"pan-y";log("⑤ スクロール方式 → "+e.target.value);};
const P3=new Map();let lp=null,two=null,y0=0,sc0=0;
const r3=()=>b3.getBoundingClientRect();
function paint3(x0,y0_,x1,y1){const r=r3(),L=Math.min(x0,x1),T=Math.min(y0_,y1),W=Math.abs(x1-x0),H=Math.abs(y1-y0_);
  Object.assign(rub3.style,{display:"block",left:(L-r.left)+"px",top:(T-r.top)+"px",width:W+"px",height:H+"px"});
  const sel=[];lns.forEach(l=>{const q=l.getBoundingClientRect(),hit=q.left<L+W&&q.right>L&&q.top<T+H&&q.bottom>T;l.classList.toggle("sel",hit);if(hit)sel.push(lns.indexOf(l)+1);});return sel;}
const selNow=()=>lns.map((l,i)=>l.classList.contains("sel")?i+1:0).filter(Boolean);
b3.addEventListener("pointerdown",e=>{
  P3.set(e.pointerId,{x:e.clientX,y:e.clientY,x0:e.clientX,y0:e.clientY,t:performance.now(),type:e.pointerType});
  log(`⑤down #${e.pointerId} ${e.pointerType} 指:${P3.size} scrollY:${scrollY|0}`);
  if(P3.size===1){y0=scrollY;sc0=scrollY;
    lp={id:e.pointerId,armed:false,moves:0,x0:e.clientX,y0:e.clientY};
    if(e.pointerType==="mouse"){lp.armed=true;}
    else lp.t=setTimeout(()=>{const q=P3.get(e.pointerId);if(!q||!lp||lp.armed||two)return;lp.armed=true;
      {const d=document.createElement("div");d.className="dot";const rr=b3.getBoundingClientRect();d.style.left=(e.clientX-rr.left)+"px";d.style.top=(e.clientY-rr.top)+"px";b3.appendChild(d);setTimeout(()=>d.remove(),800);}   // 青い輪
      const el=document.elementFromPoint(q.x,q.y),ln=el&&el.closest&&el.closest(".ln");lns.forEach(l=>l.classList.toggle("sel",l===ln));
      log(`★長押し 0.5秒 → 選択開始 ${ln?"行"+(lns.indexOf(ln)+1)+"を選んだ":"(行のない所)"}`);if(ln)hit("lpSel","行"+(lns.indexOf(ln)+1));
      if(navigator.vibrate)try{navigator.vibrate(15);}catch{}},500);
  }else if(P3.size===2){clearTimeout(lp&&lp.t);if(lp)lp.armed=false;two={moves:0,started:performance.now()};log("⑤ 2本指が触れた → 2本指ドラッグの準備");}
});
b3.addEventListener("pointermove",e=>{const q=P3.get(e.pointerId);if(!q)return;q.x=e.clientX;q.y=e.clientY;
  if(P3.size>=2&&two){two.moves++;const a=[...P3.values()];paint3(a[0].x,a[0].y,a[1].x,a[1].y);return;}
  if(lp&&e.pointerId===lp.id){
    if(!lp.armed){if(Math.hypot(q.x-lp.x0,q.y-lp.y0)>10){clearTimeout(lp.t);lp.t=0;
        if($("m5").value==="none"&&e.pointerType!=="mouse"){window.scrollBy(0,(lp.py??lp.y0)-q.y);}}   // 自前方式: 指の動きに合わせてページを動かす
      lp.py=q.y;return;}   // 長押しの前に動いたら、スクロール扱い
    lp.moves++;paint3(lp.x0,lp.y0,q.x,q.y);}
});
function end3(e,cancel){const q=P3.get(e.pointerId);if(!q)return;P3.delete(e.pointerId);
  const dy=scrollY-sc0;
  if(two&&P3.size<=1){const m=two.moves;const sel=selNow();log(`⑤ 2本指 ${cancel?"cancel":"up"} 動いた回数:${m} 選択:${sel.join(",")||"なし"} ページの動き:${dy|0}px`);
    if(cancel)hit("twoLost",`動いた回数:${m}`);else if(m>1)hit("twoRange",`行${sel.join(",")||"なし"} (${m}回動いた)`);
    if(dy)hit("moved",`2本指の間にページが${dy|0}px動いた`);two=null;rub3.style.display="none";return;}
  if(lp&&e.pointerId===lp.id){clearTimeout(lp.t);
    if(lp.armed&&lp.moves>0&&e.pointerType!=="mouse"||(lp.armed&&e.pointerType==="mouse"&&lp.moves>0)){const sel=selNow();log(`⑤ 長押し後 ${cancel?"cancel":"up"} 動いた回数:${lp.moves} 選択:${sel.join(",")||"なし"} ページの動き:${dy|0}px`);
      if(cancel)hit("lpLost",`動いた回数:${lp.moves}`);else hit("lpRange",`行${sel.join(",")||"なし"} (${lp.moves}回動いた)`);
      if(dy)hit("moved",`長押しの間にページが${dy|0}px動いた`);}
    else if(lp.armed&&cancel&&e.pointerType!=="mouse")hit("lpLost","動く前にキャンセル");
    else log(`⑤ up ${cancel?"(cancel=ブラウザがスクロールに使った)":""} 長押しにならず(${(performance.now()-q.t)|0}ms) ページの動き:${dy|0}px`);
    lp=null;rub3.style.display="none";}
}
b3.addEventListener("pointerup",e=>end3(e,false));b3.addEventListener("pointercancel",e=>end3(e,true));
// 長押しの後・2本指のときだけ、ブラウザのスクロール・拡大を止める(それ以外の1本指のドラッグは、ふつうにスクロール)
b3.addEventListener("touchmove",e=>{if((lp&&lp.armed)||e.touches.length>=2||$("m5").value==="none"){if(e.cancelable)e.preventDefault();}},{passive:false});
b3.addEventListener("touchstart",e=>{if(e.touches.length>=2&&e.cancelable)e.preventDefault();},{passive:false});

setTab(1);
window.touchLabDebug={cnt,sel:()=>[...sel]};
})();
