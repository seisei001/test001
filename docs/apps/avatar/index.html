<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#dce9f5">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="VRMアバター">
<title>VRMアバター</title>
<style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  margin: 0;
  height: 100%;
  background: #dce9f5;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Yu Gothic", sans-serif;
  overflow: hidden;
}

#app {
  position: relative;
  width: 100%;
  height: 92vh;
}

#scene-canvas {
  display: block;
  width: 100%;
  height: 100%;
}

.back-link {
  position: absolute;
  top: calc(env(safe-area-inset-top, 0px) + 10px);
  left: calc(env(safe-area-inset-left, 0px) + 10px);
  background: rgba(255, 255, 255, 0.85);
  color: #333;
  text-decoration: none;
  font-size: 0.85rem;
  padding: 6px 12px;
  border-radius: 999px;
  box-shadow: 0 2px 6px rgba(0, 0, 0, 0.12);
}

.avatar-switch-btn {
  position: absolute;
  top: calc(env(safe-area-inset-top, 0px) + 10px);
  right: calc(env(safe-area-inset-right, 0px) + 10px);
  min-width: 44px;
  min-height: 44px;
  padding: 6px 16px;
  background: rgba(255, 255, 255, 0.85);
  color: #333;
  font-size: 0.9rem;
  font-family: inherit;
  border: none;
  border-radius: 999px;
  box-shadow: 0 2px 6px rgba(0, 0, 0, 0.12);
  cursor: pointer;
}

.notice {
  position: absolute;
  top: 16px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(255, 255, 255, 0.92);
  border: 1px solid #f0a3a3;
  border-radius: 10px;
  padding: 10px 18px;
  font-size: 13px;
  color: #a33;
  text-align: center;
  box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
  max-width: 80vw;
}

.hint {
  text-align: center;
  color: #555;
  font-size: 13px;
  margin: 8px 0 0;
  padding: 0 12px env(safe-area-inset-bottom, 0px);
}

.debug-state-label {
  position: absolute;
  left: calc(env(safe-area-inset-left, 0px) + 8px);
  bottom: calc(env(safe-area-inset-bottom, 0px) + 8px);
  padding: 4px 8px;
  background: rgba(0, 0, 0, 0.6);
  color: #fff;
  font-size: 12px;
  font-family: monospace;
  border-radius: 4px;
  max-width: 90%;
  word-break: break-all;
  pointer-events: none;
}
</style>
</head>
<body>
<div id="app">
  <canvas id="scene-canvas"></canvas>
  <a class="back-link" href="../../">← ハブに戻る</a>
  <button id="avatar-switch-btn" class="avatar-switch-btn" type="button"></button>
  <div id="missing-avatar-notice" class="notice" hidden>
    <p><strong>アバターを読み込めませんでした。</strong></p>
    <p>しばらくしてからもう一度開いてみてください。</p>
  </div>
  <div id="debug-state-label" class="debug-state-label"></div>
</div>
<p class="hint">操作はありません(指でドラッグすると視点を回転できます)。アバターが自律的に呼吸・瞬き・仕草・歩行・座るなどを行う様子をただ眺めるページです。</p>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
    "three/examples/jsm/loaders/GLTFLoader.js": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/loaders/GLTFLoader.js",
    "three/examples/jsm/controls/OrbitControls.js": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/controls/OrbitControls.js",
    "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3.5.5/lib/three-vrm.module.js",
    "@pixiv/three-vrm-animation": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm-animation@3.5.5/lib/three-vrm-animation.module.js"
  }
}
</script>
<script type="module">
  import { AvatarViewer } from './lib/index.js';

  // 使用できるアバター(models/ 配下のファイル名を指定)。
  // 現在確保しているもの: AvatarSample_A.vrm / AvatarSample_B.vrm(いずれもVRoid公式・商用利用可)
  const AVATAR_FILES = {
    A: 'models/AvatarSample_A.vrm',
    B: 'models/AvatarSample_B.vrm',
  };
  const STORAGE_KEY = 'avatar-app:selected-avatar';

  function loadSelectedAvatar() {
    try {
      const saved = localStorage.getItem(STORAGE_KEY);
      return saved === 'A' || saved === 'B' ? saved : 'B';
    } catch {
      return 'B';
    }
  }

  let selectedAvatar = loadSelectedAvatar();

  const canvas = document.getElementById('scene-canvas');
  const notice = document.getElementById('missing-avatar-notice');
  const debugLabel = document.getElementById('debug-state-label');
  const switchBtn = document.getElementById('avatar-switch-btn');

  function updateSwitchBtnLabel() {
    switchBtn.textContent = `アバター切替(${selectedAvatar})`;
  }
  updateSwitchBtnLabel();

  const viewer = new AvatarViewer(canvas, {
    avatarUrl: AVATAR_FILES[selectedAvatar],
    // 待機(idle)の出現をユーザー指示により大幅に短縮し、行動から行動へ
    // ほぼ連続的に切り替わるようにしている(既定は4〜9秒)。
    behaviorTiming: { minIntervalSeconds: 0.07, maxIntervalSeconds: 0.13 },
  });
  viewer.addEventListener('ready', () => { notice.hidden = true; });
  viewer.addEventListener('error', () => { notice.hidden = false; });
  viewer.addEventListener('statechange', (e) => {
    if (debugLabel) debugLabel.textContent = e.detail;
  });
  viewer.start();

  switchBtn.addEventListener('click', () => {
    selectedAvatar = selectedAvatar === 'A' ? 'B' : 'A';
    updateSwitchBtnLabel();
    try { localStorage.setItem(STORAGE_KEY, selectedAvatar); } catch {}
    viewer.setAvatar(AVATAR_FILES[selectedAvatar]);
  });
</script>
</body>
</html>
