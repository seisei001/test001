<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#dce9f5">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="VRMアバター">
<title>VRMアバター</title>
<style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  margin: 0;
  height: 100%;
  background: #dce9f5;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Yu Gothic", sans-serif;
  overflow: hidden;
}

#app {
  position: relative;
  width: 100%;
  height: 92vh;
}

#scene-canvas {
  display: block;
  width: 100%;
  height: 100%;
}

.back-link {
  position: absolute;
  top: calc(env(safe-area-inset-top, 0px) + 10px);
  left: calc(env(safe-area-inset-left, 0px) + 10px);
  background: rgba(255, 255, 255, 0.85);
  color: #333;
  text-decoration: none;
  font-size: 0.85rem;
  padding: 6px 12px;
  border-radius: 999px;
  box-shadow: 0 2px 6px rgba(0, 0, 0, 0.12);
}

.notice {
  position: absolute;
  top: 16px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(255, 255, 255, 0.92);
  border: 1px solid #f0a3a3;
  border-radius: 10px;
  padding: 10px 18px;
  font-size: 13px;
  color: #a33;
  text-align: center;
  box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
  max-width: 80vw;
}

.hint {
  text-align: center;
  color: #555;
  font-size: 13px;
  margin: 8px 0 0;
  padding: 0 12px env(safe-area-inset-bottom, 0px);
}
</style>
</head>
<body>
<div id="app">
  <canvas id="scene-canvas"></canvas>
  <a class="back-link" href="../../">← ハブに戻る</a>
  <div id="missing-avatar-notice" class="notice" hidden>
    <p><strong>アバターを読み込めませんでした。</strong></p>
    <p>しばらくしてからもう一度開いてみてください。</p>
  </div>
</div>
<p class="hint">操作はありません(指でドラッグすると視点を回転できます)。アバターが自律的に呼吸・瞬き・仕草・歩行・座るなどを行う様子をただ眺めるページです。</p>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
    "three/examples/jsm/loaders/GLTFLoader.js": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/loaders/GLTFLoader.js",
    "three/examples/jsm/controls/OrbitControls.js": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/controls/OrbitControls.js",
    "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3.5.5/lib/three-vrm.module.js",
    "@pixiv/three-vrm-animation": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm-animation@3.5.5/lib/three-vrm-animation.module.js"
  }
}
</script>
<script type="module">
  import { AvatarViewer } from './lib/index.js';

  const AVATAR_URL = 'models/AvatarSample_A.vrm';

  const canvas = document.getElementById('scene-canvas');
  const notice = document.getElementById('missing-avatar-notice');

  const viewer = new AvatarViewer(canvas, { avatarUrl: AVATAR_URL });
  viewer.addEventListener('ready', () => { notice.hidden = true; });
  viewer.addEventListener('error', () => { notice.hidden = false; });
  viewer.start();
</script>
</body>
</html>
