<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1b1a2b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="百人隊長戦記">
<title>百人隊長戦記</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;800&family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
/* Layout: 全面キャンバスの戦場 + 上にHUD(章・勢力ごとの兵数) + 下に字幕とコントローラ。操作して遊ぶのではなく観戦する作り。 */
:root{
  --bg:#1b1a2b; --ink:#f4efe3; --ink-soft:#c9c2ad; --gold:#f2c14e; --panel:rgba(22,20,36,.78); --line:rgba(255,255,255,.16);
  --f-title:'Shippori Mincho','Hiragino Mincho ProN','Yu Mincho',serif;
  --f-body:'Zen Maru Gothic',system-ui,-apple-system,'Hiragino Maru Gothic ProN','Hiragino Sans',sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--f-body);overflow:hidden;overscroll-behavior:none}
#app{position:fixed;inset:0}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.back{position:absolute;left:calc(8px + env(safe-area-inset-left,0px));top:calc(8px + env(safe-area-inset-top,0px));z-index:5;height:40px;min-width:44px;padding:0 12px;display:flex;align-items:center;justify-content:center;border-radius:20px;background:var(--panel);color:var(--ink);text-decoration:none;font-weight:700;font-size:13px;border:1px solid var(--line)}
#hud{position:absolute;left:calc(8px + env(safe-area-inset-left,0px));right:calc(8px + env(safe-area-inset-right,0px));top:calc(54px + env(safe-area-inset-top,0px));z-index:4;pointer-events:none}
#chap{font-family:var(--f-title);font-weight:800;font-size:15px;letter-spacing:.06em;text-shadow:0 1px 3px #000,0 0 8px #000;margin:0 0 6px 4px}
#chap small{font-family:var(--f-body);font-weight:700;color:var(--gold);margin-right:8px;font-size:12px;letter-spacing:.1em}
#chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{display:flex;align-items:center;gap:5px;padding:3px 9px 3px 7px;border-radius:14px;background:var(--panel);border:1px solid var(--line);font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
.chip i{width:10px;height:10px;border-radius:50%;display:block;box-shadow:0 0 0 1.5px rgba(255,255,255,.55)}
#ctl{position:absolute;left:0;right:0;bottom:0;z-index:5;padding:30px calc(10px + env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) calc(10px + env(safe-area-inset-left,0px));background:linear-gradient(to top,rgba(14,12,26,.92) 55%,rgba(14,12,26,0))}
#sub{min-height:44px;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:700;font-size:15px;line-height:1.45;padding:0 6px 6px;text-shadow:0 1px 3px #000,0 0 10px #000;transition:opacity .35s}
#sub.off{opacity:0}
#seekrow{display:flex;align-items:center;gap:8px;margin-bottom:4px}
#tm{font-size:11px;color:var(--ink-soft);font-variant-numeric:tabular-nums;min-width:74px;text-align:right}
#seek{flex:1;height:30px;accent-color:var(--gold);margin:0}
#btns{display:flex;gap:5px;justify-content:space-between}
.b{flex:1 1 0;min-width:0;white-space:nowrap;height:44px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.1);color:var(--ink);font-family:var(--f-body);font-weight:700;font-size:12px;cursor:pointer;touch-action:manipulation;padding:0 1px}
.b:active{background:rgba(255,255,255,.22)}
.b.on{background:var(--gold);color:#2b2108;border-color:var(--gold)}
.b.big{flex:1.3;font-size:18px}
#hero{margin-top:6px;display:inline-flex;flex-wrap:wrap;align-items:center;gap:4px 10px;padding:6px 12px;border-radius:14px;background:rgba(80,54,8,.82);border:1px solid #ffd35a;font-size:12px;font-weight:700;max-width:260px}
#hero .bar{flex-basis:100%;height:6px;border-radius:3px;background:rgba(255,255,255,.2);overflow:hidden}
#hero .bar i{display:block;height:100%;background:linear-gradient(90deg,#ffd35a,#fff3b0)}
#hero small{color:#ffe9a8;font-size:11px}
#hnow{margin-top:4px;display:inline-block;padding:4px 10px;border-radius:12px;background:rgba(18,14,30,.8);border:1px solid #ffd35a;font-size:12.5px;font-weight:800;color:#fff3c4;max-width:255px}
#hlog{margin-top:4px;max-width:255px;background:rgba(18,14,30,.55);border-radius:10px;padding:3px 8px;font-size:11px;line-height:1.45;color:#fff;text-shadow:0 1px 2px #000,0 0 6px #000}
#hlog:empty{display:none}#hlog div{opacity:.92}#hlog div:first-child{opacity:1;font-weight:700}
#hlog b{color:#ffd35a;font-weight:700;margin-right:5px;font-variant-numeric:tabular-nums}
#mm{position:absolute;right:calc(8px + env(safe-area-inset-right,0px));top:calc(118px + env(safe-area-inset-top,0px));width:74px;height:111px;z-index:4;border-radius:8px;border:1px solid rgba(255,255,255,.55);background:#232238;pointer-events:none;box-shadow:0 2px 8px rgba(0,0,0,.5)}
#card{position:absolute;left:0;right:0;top:34%;z-index:4;text-align:center;pointer-events:none;opacity:0;transition:opacity .8s;font-family:var(--f-title)}
#card.show{opacity:1}
#card .k{font-size:15px;letter-spacing:.5em;color:var(--gold);font-weight:800;text-shadow:0 2px 6px #000}
#card .n{font-size:32px;font-weight:800;letter-spacing:.12em;margin-top:6px;text-shadow:0 2px 10px #000,0 0 22px #000}
#card .l{width:120px;height:2px;margin:10px auto 0;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.ov{position:absolute;inset:0;z-index:9;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;background:radial-gradient(ellipse at 50% 38%,rgba(48,38,78,.88),rgba(10,9,20,.97));}
.ov h1{font-family:var(--f-title);font-size:46px;letter-spacing:.2em;margin:0 0 6px 0.2em;font-weight:800;text-shadow:0 0 24px rgba(242,193,78,.5)}
.ov .tag{color:var(--gold);font-family:var(--f-title);font-weight:600;letter-spacing:.14em;font-size:14px;margin-bottom:22px}
.ov p{max-width:330px;color:var(--ink-soft);font-size:13px;line-height:1.75;margin:0 0 22px}
.go{height:54px;min-width:220px;padding:0 28px;border-radius:27px;border:0;background:linear-gradient(#f7d070,#e0a52d);color:#2b2108;font-family:var(--f-title);font-weight:800;font-size:19px;letter-spacing:.14em;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.45);touch-action:manipulation}
.go.alt{background:rgba(255,255,255,.12);color:var(--ink);border:1px solid var(--line);box-shadow:none;font-size:15px;height:46px;margin-top:10px}
#sheet{background:rgba(10,9,20,.9);justify-content:flex-start;padding-top:calc(60px + env(safe-area-inset-top,0px));overflow:auto}
#sheet h2{font-family:var(--f-title);margin:0 0 14px;letter-spacing:.2em}
.ci{width:100%;max-width:360px;min-height:52px;margin-bottom:8px;text-align:left;padding:8px 14px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.08);color:var(--ink);font-family:var(--f-title);font-size:16px;font-weight:800;cursor:pointer;display:flex;align-items:center;gap:10px}
.ci small{font-family:var(--f-body);color:var(--gold);font-size:12px;min-width:46px}
#load{background:#1b1a2b}
#end h1{font-size:40px}
</style>
</head>
<body>
<div id="app">
  <canvas id="cv"></canvas>
  <a class="back" href="../../">‹ ハブ</a>
  <div id="hud"><div id="chap"></div><div id="chips"></div><div id="hero" hidden></div><div id="hnow" hidden></div><div id="hlog"></div></div>
  <canvas id="mm" aria-hidden="true"></canvas>
  <div id="card"><div class="k"></div><div class="n"></div><div class="l"></div></div>
  <div id="ctl">
    <div id="sub" class="off"></div>
    <div id="seekrow"><input id="seek" type="range" min="0" max="60" step="0.1" value="0" aria-label="時間"><span id="tm">0:00 / 0:00</span></div>
    <div id="btns">
      <button class="b" id="bPrev" aria-label="前の章">⏮</button>
      <button class="b big" id="bPlay" aria-label="再生・一時停止">⏸</button>
      <button class="b" id="bNext" aria-label="次の章">⏭</button>
      <button class="b" id="bSpd">自動</button>
      <button class="b on" id="bCam">🎯追尾</button>
      <button class="b" id="bLod">兵:自動</button>
      <button class="b" id="bChap">章</button>
    </div>
  </div>
  <div id="sheet" class="ov" hidden><h2>章をえらぶ</h2><div id="clist" style="width:100%;display:flex;flex-direction:column;align-items:center"></div><button class="go alt" id="bClose">とじる</button></div>
  <div id="title" class="ov" hidden>
    <h1>百人隊長戦記</h1>
    <div class="tag">— 六万の軍に、ひとりの百人隊長がいた —</div>
    <div class="tag" id="seedtag" style="margin-top:2px;font-size:12px"></div>
    <p>百人の隊が数百、AIの隊長たちに動かされる戦争シミュレーションを「観戦」します。土地は広く、時間はゆっくり。成功するとは限らず、🎲で別の人生も見られます。<br>臆病な隊長、勇敢な隊長、そしてひとりの変人——百人隊長・灯真は、千人隊長になれるか。<br>ドラッグで移動、ピンチで拡大。章ジャンプ・倍速もできます。</p>
    <button class="go" id="bStart">戦記をはじめる</button>
  </div>
  <div id="end" class="ov" hidden style="background:linear-gradient(rgba(10,9,20,0) 0%,rgba(10,9,20,.35) 50%,rgba(10,9,20,.7) 100%);justify-content:flex-end;padding-bottom:calc(150px + env(safe-area-inset-bottom,0px));pointer-events:none">
    <h1>昇進</h1>
    <div class="tag">— 百人隊長は、千人隊長となった —</div>
    <button class="go" id="bAgain" style="pointer-events:auto">もう一度みる</button>
    <button class="go alt" id="bEndChap" style="pointer-events:auto">章をえらぶ</button>
    <button class="go alt" id="bSeed" style="pointer-events:auto">🎲 別の人生で見る</button>
  </div>
  <div id="load" class="ov"><div class="tag" style="margin:0">世界地図を描いています…</div></div>
</div>
<script>
'use strict';
/* ============ 基本 ============ */
const TL=15;                    /* 画面の1秒=物語の何秒か(基準): 小さいほどゆっくり */
let RT=0;                       /* 実時間の経過(演出用) */
const K=5.5, TK=5.5;            /* K=土地の広がり(縦横) TK=時間のゆったり度 */
const WW=1600*K, WH=2400*K;
const P2=a=>[a[0]*K,a[1]*K];
const TAU=Math.PI*2;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const sm=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);};
const ramp=(t,a,b)=>clamp((t-a)/(b-a),0,1);
const lerp=(a,b,u)=>a+(b-a)*u;
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function fh(a,b){const s=Math.sin(a*127.1+b*311.7)*43758.5453;return s-Math.floor(s);}
const fmtN=n=>n>=10000?(Math.round(n/1000)/10).toString().replace(/\.0$/,'')+'万':Math.round(n/100)*100>=1000?(Math.round(n/100)*100).toLocaleString('en-US'):String(Math.round(n/100)*100);
const fmtClock=t=>{const s=Math.floor(t*TL),d=Math.floor(s/86400)+1,m=Math.floor(((6*3600+s)%86400)/60);return d+'日目 '+String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');};
const fmtT=s=>{s=Math.max(0,Math.floor(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');};

/* ============ 勢力 ============ */
const FAC={
  aka:{name:'暁軍',col:'#3b82f6',dark:'#1e40af',light:'#bfdbfe',trim:'#fde68a'},
  rengo:{name:'豪族連合',col:'#3fae6a',dark:'#1f7a45',light:'#bbf7d0',trim:'#fef08a'},
  kok:{name:'黒曜帝国',col:'#8b5cf6',dark:'#3b2563',light:'#ddd6fe',trim:'#f87171'},
  guren:{name:'紅蓮軍',col:'#ef4444',dark:'#991b1b',light:'#fecaca',trim:'#fbbf24'},
  gin:{name:'白銀軍',col:'#cbd5e1',dark:'#64748b',light:'#f8fafc',trim:'#60a5fa'}
};
const FORDER=['aka','rengo','kok','guren','gin'];
const SKIN='#ffd9b8', OL='rgba(28,18,40,.9)';

/* ============ 町と砦 ============ */
const WSIDE=[[0,'rengo'],[400,'gin'],[535,'guren'],[595,'rengo']];
const ESIDE=[[0,'rengo'],[400,'guren'],[595,'rengo']];
const SSIDE=[[0,'rengo'],[400,'aka']];
const CITY=[
  {n:'暁都',x:800,y:1860,kind:'cap',own:[[0,'aka']]},
  {n:'白鷺',x:470,y:1590,own:WSIDE},{n:'青嵐',x:300,y:1940,own:WSIDE},{n:'紫苑',x:160,y:1650,own:WSIDE},
  {n:'翠川',x:560,y:2160,own:SSIDE},{n:'琥珀',x:1020,y:2170,own:SSIDE},
  {n:'紅葉',x:1180,y:1900,own:ESIDE},{n:'銀嶺',x:1350,y:1600,own:ESIDE},{n:'蒼海',x:1420,y:2020,own:ESIDE},
  {n:'天嶺砦',x:900,y:1170,kind:'fort',own:[[0,'aka']]},
  {n:'黒曜城',x:800,y:300,kind:'emp',own:[[0,'kok']]}
];
for(const c of CITY){c.mx=c.x;c.my=c.y;}
function ownerAt(c,t){let f=c.own[0][1];for(const [tt,ff] of c.own)if(t>=tt)f=ff;return f;}

/* ============ 地形 ============ */
let SEED=20260;
function ih(x,y){let h=Math.imul(x,374761393)^Math.imul(y,668265263)^SEED;h=Math.imul(h^(h>>>13),1274126177);return((h^(h>>>16))>>>0)/4294967296;}
function vn(x,y){const x0=Math.floor(x),y0=Math.floor(y),fx=x-x0,fy=y-y0,u=fx*fx*(3-2*fx),v=fy*fy*(3-2*fy);const a=ih(x0,y0),b=ih(x0+1,y0),c=ih(x0,y0+1),d=ih(x0+1,y0+1);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;}
function fbm(x,y,o){let s=0,a=.5,f=1,n=0;for(let i=0;i<o;i++){s+=a*vn(x*f,y*f);n+=a;a*=.5;f*=2.03;}return s/n;}
function H(x,y){
  const n=fbm(x/380,y/380,5);
  let h=.43+(n-.5)*.5;
  h+=sm(1050,880,y)*.1;
  const wob=(fbm(x/300+9,7,3)-.5)*170;
  const m=Math.exp(-Math.pow((y-1180+wob)/150,2));
  const ridge=1-Math.abs(2*fbm(x/190+30,y/190,4)-1);
  const pass=1-.88*Math.exp(-Math.pow((x-450)/62,2))-.88*Math.exp(-Math.pow((x-1150)/62,2));
  h+=m*(.22+.5*ridge)*pass;
  h-=sm(1350,1650,y)*.03;
  const ed=Math.min(x,1600-x,2400-y);
  const coast=64+(fbm(x/140,y/140,3)-.5)*120;
  const sea=y>1380?sm(coast+34,coast-18,ed)*sm(1380,1520,y):0;
  h=h*(1-sea)+.2*sea;
  for(const c of CITY){const dx=x-c.x,dy=y-c.y,d2=dx*dx+dy*dy;if(d2<6400){const w=sm(80,28,Math.sqrt(d2));h=h*(1-w)+.47*w;}}
  return h;
}
function Hw(x,y){return H(x/K,y/K)+(fbm(x/230+11,y/230+5,4)-.5)*.2;}
const FOR_F=(x,y)=>fbm(x/260+50,y/260,3);
let TERR=null;
function lerpC(a,b,u){return[a[0]+(b[0]-a[0])*u,a[1]+(b[1]-a[1])*u,a[2]+(b[2]-a[2])*u];}
function genTerrain(){
  const SW=704,SH=1056,ST=WW/SW,hs=new Float32Array(SW*SH);
  for(let j=0;j<SH;j++)for(let i=0;i<SW;i++)hs[j*SW+i]=Hw((i+.5)*ST,(j+.5)*ST);
  const sc=document.createElement('canvas');sc.width=SW;sc.height=SH;
  const sx=sc.getContext('2d'),img=sx.createImageData(SW,SH),d=img.data;
  const DEEP=[38,84,128],SHAL=[88,156,190],BEACH=[232,217,160];
  const GS=[134,196,106],GS2=[96,164,84],GN=[190,180,112],GN2=[150,146,86],FOR=[58,118,70],FORN=[70,100,78];
  const HILL=[152,142,102],ROCK=[142,138,134],ROCK2=[188,184,178],SNOW=[246,248,252];
  for(let j=0;j<SH;j++)for(let i=0;i<SW;i++){
    const k=j*SW+i,h=hs[k],wx=(i+.5)*ST,wy=(j+.5)*ST;
    const nt=sm(1250,950,wy/K);
    let c;
    if(h<.30){c=lerpC(SHAL,DEEP,clamp((.30-h)/.1,0,1));}
    else if(h<.325){c=BEACH;}
    else{
      const f=FOR_F(wx,wy);
      const t=clamp((h-.325)/.3,0,1);
      let g=lerpC(lerpC(GS,GS2,t),lerpC(GN,GN2,t),nt);
      const fw=sm(.57,.66,f);
      g=lerpC(g,lerpC(FOR,FORN,nt),fw*(h<.62?1:0));
      if(h>.58)g=lerpC(g,HILL,sm(.58,.68,h));
      if(h>.68)g=lerpC(g,ROCK,sm(.68,.78,h));
      if(h>.78)g=lerpC(g,ROCK2,sm(.78,.86,h));
      if(h>.86)g=lerpC(g,SNOW,sm(.86,.92,h));
      c=g;
    }
    let s=1;
    if(h>=.3&&i>0&&j>0&&i<SW-1&&j<SH-1){
      const gx=hs[k+1]-hs[k-1],gy=hs[k+SW]-hs[k-SW];
      s=1+clamp((-gx-gy)*5.5,-.45,.45);
    }
    const g2=(ih(i*7,j*13)-.5)*8;
    const p=k*4;d[p]=clamp(c[0]*s+g2,0,255);d[p+1]=clamp(c[1]*s+g2,0,255);d[p+2]=clamp(c[2]*s+g2,0,255);d[p+3]=255;
  }
  sx.putImageData(img,0,0);
  const TS=.2,big=document.createElement('canvas');big.width=WW*TS;big.height=WH*TS;
  const c=big.getContext('2d');c.imageSmoothingEnabled=true;c.imageSmoothingQuality='high';
  c.drawImage(sc,0,0,big.width,big.height);
  c.scale(TS,TS);
  const hAt=(x,y)=>hs[clamp(Math.floor(y/ST),0,SH-1)*SW+clamp(Math.floor(x/ST),0,SW-1)];
  /* 川 */
  const rivers0=[[[450,1250],[430,1450],[380,1650],[300,1800],[210,1960],[110,2090],[40,2160]],[[1150,1250],[1180,1450],[1230,1650],[1180,1800],[1100,1950],[1110,2150],[1090,2420]]];
  const rivers=rivers0.map(r=>r.map(P2));
  for(const pts of rivers){
    for(const pass of [0,1]){
      c.beginPath();c.moveTo(pts[0][0],pts[0][1]);
      for(let i=1;i<pts.length-1;i++){const mx=(pts[i][0]+pts[i+1][0])/2,my=(pts[i][1]+pts[i+1][1])/2;c.quadraticCurveTo(pts[i][0],pts[i][1],mx,my);}
      c.lineTo(pts[pts.length-1][0],pts[pts.length-1][1]);
      c.lineCap='round';c.lineJoin='round';
      c.strokeStyle=pass?'#7bb8d6':'rgba(40,80,110,.55)';c.lineWidth=pass?15:26;c.stroke();
    }
  }
  /* 山・木 */
  const rnd=mulberry(77),items=[];
  for(let y=30;y<WH-10;y+=30)for(let x=30;x<WW-10;x+=30){
    const jx=x+(rnd()-.5)*30,jy=y+(rnd()-.5)*30,h=hAt(jx,jy);
    if(h>.7&&rnd()<.4)items.push({k:'m',x:jx,y:jy,h,s:10+rnd()*10+(h-.7)*40});
  }
  for(let y=16;y<WH-8;y+=26)for(let x=16;x<WW-8;x+=26){
    const jx=x+(rnd()-.5)*26,jy=y+(rnd()-.5)*26,h=hAt(jx,jy);

  if(rnd()<.02)return 'hero';

function decide(u,L){
  const w=ARCH[u.arch],odds=clamp((u.near+1)/(u.nearE+.3),0,4);
  const weak=u.weakE&&u.weakE.alive&&u.weakS<=3;
  const push=L.mode===1?1:.3;
  const uh=.5*w.lose+.25*(1-w.glory)+.35*clamp(1.2-odds,0,1.2)*(.5+w.lose)+.15*u.stake;
  const uc=.9*w.glory+.55*(odds-1)*(1-.5*w.lose)+.45*w.obey*push+.2*u.stake*(u.nearE>0?1:0)-w.cun*.5*(weak?0:1);

    const x=h.px+(h.x-h.px)*al,y=h.py+(h.y-h.py)*al,sx=wx2s(x),sy=wy2s(y)-info.hh*Z*1.0-34;
    if(sx>-80&&sx<W+80&&sy>-30&&sy<Hh+30){
      const txt=(S.promoted?'千人隊長 ':'百人隊長 ')+HERO_NAME,w=ctx.measureText(txt).width+16;
      rr(ctx,sx-w/2,sy-10,w,20,10,'rgba(120,80,10,.88)','#ffd35a');ctx.fillStyle='#fff6d0';ctx.fillText(txt,sx,sy+.5);
    }
  }
}
function drawPops(t){
  ctx.textAlign='center';ctx.textBaseline='middle';
  for(const p of S.pops){
    const age=t-p.t;if(age<0||age>p.dur)continue;
    const a=Math.min(1,age/.25,(p.dur-age)/.6);
    const sx=wx2s(p.x),sy=wy2s(p.y)-age*7;
    if(sx<-120||sx>W+120||sy<-40||sy>Hh+40)continue;
    const big=1+.25*Math.max(0,1-age*3.5);
    ctx.globalAlpha=a;ctx.font='900 '+Math.round(17*big)+'px "Shippori Mincho",serif';ctx.lineJoin='round';
    ctx.lineWidth=5;ctx.strokeStyle='rgba(16,10,26,.92)';ctx.strokeText(p.txt,sx,sy);
    ctx.fillStyle=p.kind==='b'?'#ff8f8f':p.kind==='g'?'#ffe27a':'#fff';ctx.fillText(p.txt,sx,sy);
  }
  ctx.globalAlpha=1;
}
let lastFrameT=0;
function render(dt){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.fillStyle='#232238';ctx.fillRect(0,0,W,Hh);
  const t=RT,al=clamp((T-(S.t-DT))/DT,0,1);
  if(performance.now()-focusAt>350){focusAt=performance.now();computeFocus();}
  const f=focusCache,k=camF.init?1-Math.exp(-dt*1.7):1;camF.init=true;
  camF.x+=(f.x-camF.x)*k;camF.y+=(f.y-camF.y)*k;camF.vw*=Math.exp(Math.log(f.vw/camF.vw)*k);
  if(!manual){CX=camF.x;CY=camF.y;Z=Wref/camF.vw;camM.x=CX;camM.y=CY;camM.z=Z;}
  else{CX=camM.x;CY=camM.y;Z=camM.z;}
  Z=clamp(Z,Math.max(W/WW,.03),2.6);
  {const hx=W/2/Z,hy=Hh/2/Z;CX=hx*2>=WW?WW/2:clamp(CX,hx,WW-hx);CY=hy*2>=WH?WH/2:clamp(CY,hy,WH-hy);}
  ctx.save();
  ctx.translate(W/2,Hh/2);ctx.scale(Z,Z);ctx.translate(-CX,-CY);
  if(TERR){ctx.imageSmoothingEnabled=true;ctx.drawImage(TERR,0,0,WW,WH);}
  drawCities(t);
  const info=drawUnits(t,al);
  drawFX(t);
  ctx.restore();
  drawCityLabels();drawLabels(info,al);drawPops(t);
}

/* ============ UI ============ */
const $=id=>document.getElementById(id);
const elSub=$('sub'),elChap=$('chap'),elChips=$('chips'),elCard=$('card'),elSeek=$('seek'),elTm=$('tm'),elHero=$('hero');
let lastChap=-1,lastSubTxt=null,lastChip=0,cardUntil=0;
function updateUI(force){
  const ci=S.chap;
  if(ci!==lastChap||force){
    lastChap=ci;cardUntil=RT+4.8;elChap.innerHTML='<small>'+CHN[ci][0]+'</small>'+CHN[ci][1];
    elCard.querySelector('.k').textContent=CHN[ci][0];elCard.querySelector('.n').textContent=CHN[ci][1];
  }
  elCard.classList.toggle('show',started&&RT<cardUntil);
  const sb=S.sub&&RT-S.sub.rt<S.sub.dur?S.sub.txt:null;
  if(sb!==lastSubTxt){lastSubTxt=sb;if(sb){elSub.textContent=sb;elSub.classList.remove('off');}else elSub.classList.add('off');}
  const now=performance.now();
  if(force||now-lastChip>200){
    lastChip=now;
    const st=stats();let h='';
    for(const f of FORDER)if((st.tot[f]||0)>=300)h+='<span class="chip"><i style="background:'+FAC[f].col+'"></i>'+FAC[f].name+' '+fmtN(st.tot[f])+'</span>';
    elChips.innerHTML=h;
    const hi=heroInfo();
    if(hi){
      const pct=clamp(hi.kills/MERIT_GOAL,0,1)*100;
      elHero.innerHTML='<b>'+(S.promoted?'千人隊長 ':'百人隊長 ')+HERO_NAME+'</b><span>兵 '+hi.men+'</span><div class="bar"><i style="width:'+pct+'%"></i></div><small>戦功 '+Math.min(hi.kills,MERIT_GOAL)+' / '+MERIT_GOAL+'</small>';
      elHero.hidden=false;
    }
    {const hn=$('hnow');hn.hidden=S.chap<1;hn.textContent='いま: '+heroNow();
     const L=S.hlog.slice(-5).reverse();$('hlog').innerHTML=L.map(e=>'<div><b>'+fmtClock(e.t).replace('日目 ','日 ')+'</b>'+e.txt+'</div>').join('');}
    reach=Math.max(reach,S.t);
    elSeek.max=Math.max(60,Math.ceil(reach));drawMM();
    if(document.activeElement!==elSeek)elSeek.value=Math.min(T,reach);
    elTm.textContent=fmtClock(T);
  }
  if(S.endT>=0&&!$('end').dataset.k){}
  const ek=S.promoted?'p':S.fell?'f':'t';
  if($('end').dataset.k!==ek){$('end').dataset.k=ek;$('end').querySelector('h1').textContent=ek==='p'?'昇進':ek==='f'?'戦死':'つづく';$('end').querySelector('.tag').textContent=ek==='p'?'— 百人隊長は、千人隊長となった —':ek==='f'?'— 理屈で動いた変人は、戦場に倒れた —':'— 昇進はならず。それでも戦は続く —';}
  $('end').hidden=!(S.endT>=0&&endRT>=0&&RT-endRT>9&&$('sheet').hidden);
}
const mm=$('mm'),mx=mm.getContext('2d');let mmAt=0;
function drawMM(){
  const w=74,h=111,d=Math.min(window.devicePixelRatio||1,2);
  if(mm.width!==w*d){mm.width=w*d;mm.height=h*d;}
  mx.setTransform(d,0,0,d,0,0);
  if(TERR)mx.drawImage(TERR,0,0,w,h);else{mx.fillStyle='#4a6a40';mx.fillRect(0,0,w,h);}
  const k=w/WW;
  for(const c of CITY){mx.fillStyle='#fff';mx.fillRect(c.x*K*k-1,c.y*K*k-1,2,2);}
  for(const u of S.units){if(!u.alive||u.noc||u.type===3)continue;mx.fillStyle=FAC[u.fac].col;mx.fillRect(u.x*k-.6,u.y*k-.6,1.4,1.4);}
  const hh=S.hero;
  if(hh){const bl=(Math.floor(RT*3)%2)===0;mx.beginPath();mx.arc(hh.x*k,hh.y*k,bl?3.4:2.4,0,TAU);mx.fillStyle=hh.alive?'#ffd35a':'#888';mx.fill();mx.lineWidth=1;mx.strokeStyle='#000';mx.stroke();}
  mx.strokeStyle='#fff';mx.lineWidth=1;mx.strokeRect((CX-W/2/Z)*k,(CY-Hh/2/Z)*k,W/Z*k,Hh/Z*k);
}
function withBusy(fn){const w=$('load');w.querySelector('.tag').textContent='戦場を計算しています…';w.hidden=false;setTimeout(()=>{try{fn();}finally{w.hidden=true;}},30);}
function setPlaying(p){playing=p;$('bPlay').textContent=p?'⏸':'▶';}
function seek(t){
  t=Math.max(0,t);
  runTo(t);T=t;camF.init=false;manual=false;setCamBtn();S.pops=[];S.fx=[];endRT=-1;computeFocus();updateUI(true);
}
function gotoChap(i){
  i=clamp(i,0,2);
  if(i===0){seek(.1);}
  else if(S.chapT[i]>=0&&S.chapT[i]<=S.t+.01){seek(S.chapT[i]+.1);}
  else{
    let guard=0;while(S.chap<i&&guard++<8000)step();
    T=S.t;camF.init=false;manual=false;computeFocus();updateUI(true);
  }
  $('sheet').hidden=true;
}
$('bPlay').onclick=()=>{setPlaying(!playing);};
$('bPrev').onclick=()=>{const ci=S.chap;withBusy(()=>gotoChap(T-S.chapT[ci]>5?ci:ci-1));};
$('bNext').onclick=()=>withBusy(()=>gotoChap(S.chap+1));
const SPDM=['auto',1,5,15,60,240];
$('bSpd').onclick=()=>{spdIdx=(spdIdx+1)%SPDM.length;$('bSpd').textContent=spdIdx?'×'+SPDM[spdIdx]:'自動';};
function targetM(){
  if(!S)return 60;if(S.chap===0)return 75;
  const h=S.hero;if(S.endT>=0)return 4;if(!h||!h.alive)return 20;
  const se=h.sightE&&h.sightE.alive?Math.hypot(h.sightE.x-h.x,h.sightE.y-h.y):1e9;
  if(h.hit||h.state===1||h.state===4||h.state===2)return 3;
  if(se<300)return 6;
  const B=h.band>=0?S.bands[h.band]:null;
  if(S.chap===2&&B){if(B.state==='hidden')return 40;if(B.state==='rest')return 90;return 25;}
  return se<1200?15:40;
}
$('bCam').onclick=()=>{if(manual)manual=false;else camMode=camMode==='hero'?'world':'hero';camF.init=false;computeFocus();setCamBtn();};
$('bLod').onclick=()=>{lodMode=(lodMode+1)%3;$('bLod').textContent=['兵:自動','兵:小','兵:普通'][lodMode];$('bLod').classList.toggle('on',lodMode!==0);};
$('bChap').onclick=()=>{buildSheet();$('sheet').hidden=false;};
$('bClose').onclick=()=>{$('sheet').hidden=true;};
$('bEndChap').onclick=()=>{buildSheet();$('sheet').hidden=false;};
$('bSeed').onclick=()=>{location.search='?seed='+(1+Math.floor(Math.random()*900000));};
$('bAgain').onclick=()=>{seek(.1);setPlaying(true);};
elSeek.addEventListener('change',()=>{const v=parseFloat(elSeek.value);withBusy(()=>seek(v));});
$('bStart').onclick=()=>{$('title').hidden=true;started=true;seek(.1);setPlaying(true);};
function buildSheet(){
  const l=$('clist');l.innerHTML='';
  CHN.forEach((c,i)=>{const b=document.createElement('button');b.className='ci';const known=i===0||S.chapT[i]>=0;
    b.innerHTML='<small>'+c[0]+'</small>'+c[1]+'<span style="margin-left:auto;font-family:var(--f-body);font-size:11px;color:var(--ink-soft)">'+(known?fmtT(S.chapT[i]):'先へ進む')+'</span>';
    b.onclick=()=>{$('sheet').hidden=true;withBusy(()=>{gotoChap(i);if(!started){$('title').hidden=true;started=true;}setPlaying(true);});};l.appendChild(b);});
}
/* ジェスチャ */
const ptrs=new Map();let pinch0=null;
function setCamBtn(){const b=$('bCam');b.classList.toggle('on',!manual);b.textContent=manual?'✋手動':camMode==='hero'?'🎯追尾':'🌍全体';}
function goManual(){if(!manual){manual=true;setCamBtn();}}
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});if(ptrs.size===2){const [p,q]=[...ptrs.values()];pinch0={d:Math.hypot(p.x-q.x,p.y-q.y),z:camM.z};}});
cv.addEventListener('pointermove',e=>{
  const p=ptrs.get(e.pointerId);if(!p)return;
  const dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;
  if(ptrs.size===1){if(Math.abs(dx)+Math.abs(dy)>0){goManual();camM.x-=dx/Z;camM.y-=dy/Z;}}
  else if(ptrs.size===2&&pinch0){goManual();const [a,b]=[...ptrs.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);camM.z=clamp(pinch0.z*d/pinch0.d,Math.max(W/WW,.03),2.6);}
});
const endp=e=>{ptrs.delete(e.pointerId);if(ptrs.size<2)pinch0=null;};
cv.addEventListener('pointerup',endp);cv.addEventListener('pointercancel',endp);
cv.addEventListener('wheel',e=>{e.preventDefault();goManual();const f=Math.exp(-e.deltaY*.0015);camM.z=clamp(camM.z*f,Math.max(W/WW,.03),2.6);},{passive:false});

/* ============ メインループ ============ */
let lastNow=0;
function frame(now){
  const dt=Math.min(.1,(now-lastNow)/1000||0);lastNow=now;RT+=dt;
  if(playing){
    const m=spdIdx?SPDM[spdIdx]:(autoM*=Math.exp(Math.log(targetM()/autoM)*(1-Math.exp(-dt*1.2))));
    T+=dt*m/TL;
    if(S.endT>=0){if(endRT<0)endRT=RT;if(RT-endRT>24){setPlaying(false);}}
  }
  let guard=0;while(S.t<=T&&guard++<400)step();
  if(S.t<=T)T=S.t-DT*.5;
  render(dt);updateUI(false);
  requestAnimationFrame(frame);
}
function boot(){
  resize();
  setTimeout(()=>{
    try{mkSprites();genTerrain();simInit();}catch(err){console.error(err);}
    $('seedtag').textContent='この戦記は、世界No.'+SEED_RUN+'。毎回ちがう展開です';$('load').hidden=true;$('title').hidden=false;computeFocus();updateUI(true);
    requestAnimationFrame(frame);
  },30);
}
window.addEventListener('resize',resize);
window.__game={seek,get T(){return T},get S(){return S},stats,heroInfo,runTo,start:()=>{$('title').hidden=true;started=true;},setLod:m=>{lodMode=m;},simInit};
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else boot();
</script>
