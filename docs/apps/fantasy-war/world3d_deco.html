<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>世界の3D表示(飾りの試作)</title>
<style>html,body{margin:0;height:100%;background:#d9cfb4;font-family:-apple-system,"Hiragino Sans",sans-serif;color:#2b2418;overflow:hidden;touch-action:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
#ui{position:fixed;left:0;right:0;top:0;padding:8px 10px;background:rgba(244,236,216,.9);font-size:13px;line-height:1.5}
#ui button,#ui select{font-size:15px;padding:6px 10px;margin:2px;border:1px solid #8a7a52;background:#f4ecd8;border-radius:6px;color:#2b2418}
#ui label{margin-left:6px;white-space:nowrap}#ui a{color:#2563eb}
#st{color:#6b5f44;font-size:12px}
#frame{position:fixed;inset:0;pointer-events:none;border:14px solid #4a2f17;box-sizing:border-box;box-shadow:inset 0 0 0 3px #b98a47,inset 0 0 0 6px #2c1a0b,inset 0 0 70px 24px rgba(125,85,30,.5)}
#c2{position:fixed;right:20px;bottom:20px;width:190px;height:96px;pointer-events:none}
#sc{position:fixed;left:22px;bottom:22px;pointer-events:none;font-size:12px;background:rgba(240,228,196,.88);border:1px solid #6b4a24;padding:3px 8px 4px;color:#3b2a12}
#sc i{display:block;height:6px;border:2px solid #3b2a12;border-top:none;margin-bottom:2px}
#tt{position:fixed;left:22px;bottom:62px;pointer-events:none;background:#ecdcae;border:3px double #6b4a24;padding:3px 16px;font:600 15px "Hiragino Mincho ProN",serif;color:#3b2a12;letter-spacing:.2em}</style></head><body>
<canvas id="c"></canvas><div id="frame"></div><canvas id="c2" width="380" height="192"></canvas><div id="sc"><i></i><span></span></div><div id="tt">世界地図</div>
<div id="ui"><b>世界の3D表示(飾りの試作)</b> <a href="./">← ハブ</a><br>
世界 <select id="w"><option value="sp31">球体PWG 2:1 seed31</option><option value="sp32">球体PWG 2:1 seed32</option></select>
<br>
<button id="zi">近づく</button><button id="zo">遠ざかる</button><button id="v">視点リセット</button>
<div id="st">読み込み中…</div></div>
<script type="module">
import * as THREE from '../sekai-hex/design/vendor/three.module.min.js';
const cv=document.getElementById('c'), st=document.getElementById('st');
const R=new THREE.WebGLRenderer({canvas:cv,antialias:true}); R.setPixelRatio(Math.min(devicePixelRatio,2));
const S=new THREE.Scene(); S.background=new THREE.Color(0xaabdbe);
const cam=new THREE.PerspectiveCamera(40,1,1,6000);
const L=new THREE.DirectionalLight(0xffffff,1.1); L.position.set(-0.55,0.63,-0.55).multiplyScalar(1000); S.add(L,new THREE.AmbientLight(0xffffff,0.55));
const D0=()=>(innerWidth/innerHeight<1?2600:1500); let az=0,el=0.9,dist=D0(),mesh=null,sea=null,riv=null,info='';
const VS=1.1;
function resize(){R.setSize(innerWidth,innerHeight,false);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();} addEventListener('resize',resize); resize();
function place(){cam.position.set(Math.sin(az)*Math.cos(el)*dist,Math.sin(el)*dist,Math.cos(az)*Math.cos(el)*dist);cam.lookAt(0,0,0);}
// 川の色: 光る水色の芯+縁と所々に濃い青を混ぜる(ユーザー指示 11-22 22:11。参考=光る川の絵)。幅方向=芯が明るく縁が濃い、長さ方向=濃淡のむら
function rivTex(){const W=32,Hh=256,c=document.createElement('canvas'); c.width=W; c.height=Hh; const g=c.getContext('2d'),im=g.createImageData(W,Hh);
 const ph=[0.31,0.77,1.9]; const lerp=(a,b,t)=>a+(b-a)*t;
 for(let y=0;y<Hh;y++){const t=y/Hh*Math.PI*2; let d=0.5+0.28*Math.sin(t*2+ph[0]*6)+0.18*Math.sin(t*5+ph[1]*6)+0.1*Math.sin(t*11+ph[2]*6); d=Math.min(1,Math.max(0,d));
  for(let x=0;x<W;x++){const e=Math.abs((x+0.5)/W-0.5)*2, w=Math.pow(e,1.3);   // 縁ほど濃い
   const core=[lerp(150,45,d*0.9),lerp(228,95,d*0.9),lerp(255,205,d*0.8)], edge=[28,52,150];
   const i=(y*W+x)*4; im.data[i]=lerp(core[0],edge[0],w); im.data[i+1]=lerp(core[1],edge[1],w); im.data[i+2]=lerp(core[2],edge[2],w); im.data[i+3]=255;}}
 g.putImageData(im,0,0); const t=new THREE.CanvasTexture(c); t.wrapT=THREE.RepeatWrapping; t.wrapS=THREE.ClampToEdgeWrapping; t.colorSpace=THREE.SRGBColorSpace; return t;}
async function load(id){
 st.textContent='読み込み中…'; const t0=performance.now();
 const d=await (await fetch(`w3d/world${id}.json`)).json();
 const tex=await new THREE.TextureLoader().loadAsync(`w3d/world${id}.jpg`); tex.colorSpace=THREE.SRGBColorSpace; tex.anisotropy=4;
 const n=d.p.length, pos=new Float32Array(n*3), uv=new Float32Array(n*2);
 for(let i=0;i<n;i++){const [x,y,z]=d.p[i]; pos[i*3]=x-d.w/2; pos[i*3+1]=z*VS; pos[i*3+2]=y-d.h/2; uv[i*2]=x/d.w; uv[i*2+1]=1-y/d.h;}
 let g=new THREE.BufferGeometry();
 if(d.tuv){ // 伸び率そのままのUV展開(面ごと)。各面が3Dの実寸に比例した絵の領域を持つので、斜面で伸びない
  const nf=d.f.length/3, p2=new Float32Array(nf*9), u2=new Float32Array(nf*6);
  for(let k=0;k<nf*3;k++){const v=d.f[k]; p2[k*3]=pos[v*3]; p2[k*3+1]=pos[v*3+1]; p2[k*3+2]=pos[v*3+2]; u2[k*2]=d.tuv[k*2]; u2[k*2+1]=d.tuv[k*2+1];}
  g.setAttribute('position',new THREE.BufferAttribute(p2,3)); g.setAttribute('uv',new THREE.BufferAttribute(u2,2)); g.computeVertexNormals();
 } else { g.setAttribute('position',new THREE.BufferAttribute(pos,3)); g.setAttribute('uv',new THREE.BufferAttribute(uv,2)); g.setIndex(d.f); g.computeVertexNormals(); }
 const mat=new THREE.MeshLambertMaterial({map:tex,flatShading:true,side:THREE.DoubleSide});
 if(mesh){S.remove(mesh);mesh.geometry.dispose();mesh.material.map.dispose();} mesh=new THREE.Mesh(g,mat); S.add(mesh);
 if(riv){S.remove(riv);riv.geometry.dispose();riv=null;}
 try{const rr=await fetch(`w3d/world${id}_riv.json`); if(rr.ok){const r=await rr.json();   // 川=地形に沿う帯(実寸の幅。絵にしないので伸びない)
  const bin=atob(r.v), u8=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++)u8[i]=bin.charCodeAt(i); const q=new Int16Array(u8.buffer), k=1/r.q;
  const rp=new Float32Array(q.length), ri=[]; for(let i=0;i<q.length;i+=3){rp[i]=q[i]*k-d.w/2; rp[i+1]=q[i+2]*k*VS; rp[i+2]=q[i+1]*k-d.h/2;}
  let o=0; for(const m of r.c){for(let j=0;j<m-1;j++){const a=o+2*j; ri.push(a,a+1,a+2, a+1,a+3,a+2);} o+=2*m;}
  const ru=new Float32Array(q.length/3*2); o=0; for(const m of r.c){let acc=0; for(let j=0;j<m;j++){ if(j>0){const a=(o+2*j)*3,b=(o+2*j-2)*3; acc+=Math.hypot(rp[a]-rp[b],rp[a+1]-rp[b+1],rp[a+2]-rp[b+2]);} ru[(o+2*j)*2]=0; ru[(o+2*j+1)*2]=1; ru[(o+2*j)*2+1]=ru[(o+2*j+1)*2+1]=acc/60;} o+=2*m;}
  const rg=new THREE.BufferGeometry(); rg.setAttribute('position',new THREE.BufferAttribute(rp,3)); rg.setAttribute('uv',new THREE.BufferAttribute(ru,2)); rg.setIndex(ri);
  riv=new THREE.Mesh(rg,new THREE.MeshBasicMaterial({map:rivTex(),side:THREE.DoubleSide,polygonOffset:true,polygonOffsetFactor:-2,polygonOffsetUnits:-2})); S.add(riv);}}catch(e){console.log('river',e);}
 if(sea)S.remove(sea); sea=new THREE.Mesh(new THREE.PlaneGeometry(d.w*1.2,d.h*1.2),new THREE.MeshBasicMaterial({color:0xb4c4c0})); sea.rotation.x=-Math.PI/2; sea.position.y=-2.5; S.add(sea);
 try{const t2=await new THREE.TextureLoader().loadAsync(`w3d/world${id}_sea.jpg`); t2.colorSpace=THREE.SRGBColorSpace; const p2=new THREE.Mesh(new THREE.PlaneGeometry(d.w,d.h),new THREE.MeshBasicMaterial({map:t2})); p2.position.z=2.45; sea.add(p2);}catch(e){}   // 海の深さの色(岸から沖へ濃く・岸ぞいの浅瀬)
 info=`面 ${d.f.length/3} / 読み込み ${(performance.now()-t0).toFixed(0)}ms`;
 st.textContent=info+'\nドラッグで回す。';
 window.__ready=id;
}
let dr=null; cv.addEventListener('pointerdown',e=>{dr=[e.clientX,e.clientY];cv.setPointerCapture(e.pointerId);});
cv.addEventListener('pointermove',e=>{if(!dr)return; az-=(e.clientX-dr[0])*0.006; el=Math.min(1.45,Math.max(0.15,el+(e.clientY-dr[1])*0.006)); dr=[e.clientX,e.clientY];});
cv.addEventListener('pointerup',()=>dr=null);
document.getElementById('zi').onclick=()=>dist=Math.max(300,dist*0.8); document.getElementById('zo').onclick=()=>dist=Math.min(5000,dist*1.25);
document.getElementById('v').onclick=()=>{az=0;el=0.9;dist=D0();};
const ws=document.getElementById('w'); ws.onchange=()=>load(ws.value);
window.__set=(a,e,d)=>{az=a;el=e;dist=d;};

// ---- 飾りの試作(11-25 ユーザー: 額縁・羊皮紙の縁は絵(動かない外枠)/方位記号・羽ペン・インク壺はポリゴンで別の動き)----
const c2=document.getElementById('c2'), R2=new THREE.WebGLRenderer({canvas:c2,alpha:true,antialias:true}); R2.setSize(380,192,false);
const S2=new THREE.Scene(); S2.add(new THREE.DirectionalLight(0xffffff,1.2).translateX(-2).translateY(4).translateZ(2),new THREE.AmbientLight(0xffffff,0.7));
const cam2=new THREE.PerspectiveCamera(32,380/192,0.1,50); cam2.position.set(0,5.2,4.2); cam2.lookAt(0.2,0,0);
const M=(c)=>new THREE.MeshLambertMaterial({color:c,flatShading:true});
const compass=new THREE.Group(); compass.position.set(1.7,0,0);
const base=new THREE.Mesh(new THREE.CylinderGeometry(1.15,1.15,0.1,20),M(0xe6d3a0)); compass.add(base);
const ring=new THREE.Mesh(new THREE.RingGeometry(0.98,1.08,20),new THREE.MeshLambertMaterial({color:0x6b4a24,side:THREE.DoubleSide})); ring.rotation.x=-Math.PI/2; ring.position.y=0.06; compass.add(ring);
function star(rl,rs,ri,col,y){const sh=new THREE.Shape(); for(let i=0;i<16;i++){const a=i*Math.PI/8, r=(i%2)?ri:(i%4===0?rl:rs); const x=Math.sin(a)*r, z=-Math.cos(a)*r; if(i===0)sh.moveTo(x,-z); else sh.lineTo(x,-z);} sh.closePath();
 const m=new THREE.Mesh(new THREE.ExtrudeGeometry(sh,{depth:0.06,bevelEnabled:false}),M(col)); m.rotation.x=-Math.PI/2; m.position.y=y; return m;}
compass.add(star(0.95,0.6,0.2,0x3b2a12,0.07));
const nS=new THREE.Shape(); nS.moveTo(0,0.95); nS.lineTo(0.17,0.2); nS.lineTo(-0.17,0.2); nS.closePath();   // 北の針=赤
const nM=new THREE.Mesh(new THREE.ExtrudeGeometry(nS,{depth:0.06,bevelEnabled:false}),M(0xb3261e)); nM.rotation.x=-Math.PI/2; nM.position.y=0.14; compass.add(nM);
S2.add(compass);
const ink=new THREE.Group(); ink.position.set(-1.2,0,0.2);
const potA=new THREE.Mesh(new THREE.CylinderGeometry(0.42,0.5,0.5,8),M(0x1f2a44)); potA.position.y=0.25;
const potB=new THREE.Mesh(new THREE.CylinderGeometry(0.22,0.3,0.18,8),M(0x2b3a5e)); potB.position.y=0.59;
const potC=new THREE.Mesh(new THREE.CylinderGeometry(0.2,0.2,0.02,8),M(0x05070d)); potC.position.y=0.69;   // インクの面
ink.add(potA,potB,potC);
const quill=new THREE.Group(); const sh=new THREE.Mesh(new THREE.CylinderGeometry(0.02,0.03,1.9,5),M(0xf1e6c8)); quill.add(sh);
const fs=new THREE.Shape(); fs.moveTo(0,0); fs.quadraticCurveTo(0.33,0.5,0.05,1.5); fs.quadraticCurveTo(-0.05,0.9,0,0);
const fe=new THREE.Mesh(new THREE.ExtrudeGeometry(fs,{depth:0.03,bevelEnabled:false,curveSegments:3}),M(0xf7f1e2)); fe.position.set(0,0.1,0); quill.add(fe);
quill.position.set(0.15,0.85,0); quill.rotation.z=-0.5; ink.add(quill); S2.add(ink);
const sc=document.getElementById('sc'), scb=sc.querySelector('i'), sct=sc.querySelector('span'), KM=8192/1400, P=new THREE.Vector3();
function deco(){const t=performance.now()/1000;
 compass.rotation.y=-az; quill.rotation.z=-0.5+Math.sin(t*1.3)*0.05; ink.rotation.y=Math.sin(t*0.6)*0.18; R2.render(S2,cam2);
 const sx=(v)=>{P.copy(v).project(cam); return [(P.x+1)/2*innerWidth,(1-P.y)/2*innerHeight];};
 const a=sx(new THREE.Vector3(0,0,0)), b=sx(new THREE.Vector3(1,0,0)), upx=Math.hypot(a[0]-b[0],a[1]-b[1]);   // 地図の1単位の画面での長さ(画面の中央付近)
 let km=[100,200,500,1000,2000,5000].find(k=>k/KM*upx>=60)||5000; scb.style.width=(km/KM*upx)+'px'; sct.textContent=km+' km(目安・画面の中央付近)';}
function loop(){requestAnimationFrame(loop); place(); R.render(S,cam); deco();}
const q=new URLSearchParams(location.search).get('w'); if(q&&[...ws.options].some(o=>o.value===q))ws.value=q;
await load(ws.value); loop();
</script></body></html>
