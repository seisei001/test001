<!doctype html>
<html lang="ja"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2563eb"><title>ファンタジー世界戦争</title>
<style>
:root{color-scheme:light dark;--bg:#f7f7f8;--p:#fff;--bd:#dcdce0;--tx:#1c1c1f;--mu:#6b6b73;--ac:#2563eb;--ok:#16a34a;--wip:#d97706;--todo:#9ca3af}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);font-family:-apple-system,"Hiragino Sans",sans-serif;background:var(--bg);color:var(--tx);line-height:1.5}
.w{max-width:640px;margin:0 auto;padding:16px}
.crumb{display:flex;flex-wrap:wrap;gap:4px;font-size:.82rem;color:var(--mu);margin-bottom:8px}
.crumb a{color:var(--ac);text-decoration:none;padding:4px 2px}
h1{margin:4px 0 8px;font-size:1.35rem}
.bar{height:8px;background:var(--bd);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok)}
.stat{font-size:.82rem;color:var(--mu);margin:6px 0 16px}
.btn{display:flex;align-items:center;gap:10px;width:100%;background:var(--p);border:1px solid var(--bd);border-radius:12px;padding:14px;margin:0 0 10px;color:var(--tx);font:inherit;text-align:left;text-decoration:none;min-height:52px;cursor:pointer}
.btn .n{flex:1;font-weight:600}.btn small{color:var(--mu);font-weight:400}
.btn .go{color:var(--mu)}
.tag{font-size:.72rem;padding:2px 8px;border-radius:99px;color:#fff;white-space:nowrap}
.wip{background:var(--wip)}.todo{background:var(--todo)}.ok{background:var(--ok)}
a.main{background:var(--ac);color:#fff;border:0}.main .n{font-weight:700}
h2{font-size:.88rem;color:var(--mu);margin:20px 0 8px;font-weight:600}
.done-box{display:none}.done-box.open{display:block}
.done-box .btn{opacity:.7}
.leaf{cursor:default}
.meth{font-size:.75rem;color:var(--mu)}.now{background:var(--p);border-left:4px solid var(--wip);border-radius:8px;padding:12px 14px;margin:0 0 14px}.now b{display:block;font-size:.8rem;color:var(--wip);margin-bottom:4px}.clear{color:var(--ok);font-weight:700;padding:8px 0}.done-complete{background:var(--p);border:1px solid var(--ok);border-radius:12px;padding:16px;text-align:center;color:var(--ok);font-weight:700}
@media(prefers-color-scheme:dark){:root{--bg:#17181c;--p:#1f2024;--bd:#303136;--tx:#eaeaec;--mu:#9a9aa2}}
</style></head><body><div class="w" id="app">読み込み中…</div>
<script>
let T;
const cnt=n=>n.c?n.c.reduce((s,x)=>s+cnt(x),0):1;
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function node(path){let n=T;for(const i of path)n=n.c[i];return n}
function render(){
  const path=(location.hash.slice(1)||'').split('/').filter(x=>x!=='').map(Number);
  let n;try{n=node(path)}catch(e){n=null}
  if(!n){location.hash='';return}
  const A=document.getElementById('app');
  let h='<div class="crumb"><a href="../../">ハブ</a> › <a href="#">'+esc(T.t)+'</a>';
  let cur=T;
  path.forEach((i,k)=>{cur=cur.c[i];h+=' › <a href="#'+path.slice(0,k+1).join('/')+'">'+esc(cur.t)+'</a>'});
  h+='</div><div class="meth">階層型課題解消管理法</div><h1>'+esc(n.t)+'</h1>';
  if(n.now)h+='<div class="now"><b>いま解消しようとしていること</b>'+esc(n.now)+'</div>';
  if(n.href)h+='<a class="btn main" href="'+n.href+'"><span class="n">🔨 '+esc(n.hrefLabel||'見る')+'</span><span class="go">›</span></a>';
  if(n.c){
    if(!n.c.length)h+='<div class="clear">✅ 課題はありません</div>';
    else h+='<div class="stat">解消待ちの課題 '+cnt(n)+'件</div>';
    n.c.forEach((x,i)=>{
      const p=path.concat(i).join('/');
      h+='<a class="btn" href="#'+p+'"><span class="n">'+(x.st==='now'?'🟠 ':'')+esc(x.t)+(x.c?' <small>('+cnt(x)+')</small>':'')+'</span><span class="go">›</span></a>';
    });
  }
  if(!path.length&&T.past){
    h+='<h2>🗄️ 過去の作品</h2>';
    for(const x of T.past)h+='<a class="btn" style="opacity:.85" href="'+x.href+'"><span>'+x.icon+'</span><span class="n">'+esc(x.t)+'</span><span class="go">›</span></a>';
  }
  A.innerHTML=h;window.scrollTo(0,0);
}
fetch('tree.json',{cache:'no-store'}).then(r=>r.json()).then(j=>{T=j;render();addEventListener('hashchange',render)});
</script></body></html>
