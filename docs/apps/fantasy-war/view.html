<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>建物を見る</title>
<style>html,body{margin:0;height:100%;background:#d8dfcf;overflow:hidden;font-family:-apple-system,"Hiragino Sans",sans-serif}
#c{width:100%;height:100%;display:block;touch-action:none}
.top{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top) + 8px) 8px 6px;background:linear-gradient(#0006,#0000);display:flex;flex-direction:column;gap:6px}
.row{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}.row::-webkit-scrollbar{display:none}
button,a.b{flex:none;padding:8px 12px;border:0;border-radius:9px;background:#fffaf0e8;color:#2b2418;font-size:13px;text-decoration:none}
button.on{background:#2563eb;color:#fff}
.bot{position:fixed;left:8px;right:8px;bottom:calc(env(safe-area-inset-bottom) + 10px);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.info{background:#fffaf0e8;border-radius:9px;padding:7px 11px;font-size:12px;color:#2b2418}</style>
<script type="importmap">{"imports":{"three":"../sekai-hex/design/vendor/three.module.min.js"}}</script></head><body>
<canvas id="c"></canvas>
<div class="top"><div class="row" id="sel"></div><div class="row" id="cam"></div></div>
<div class="bot"><a class="b" href="./#c">← 管理に戻る</a><a class="b" id="town" href="../sekai-hex/design/town3d.html">街の中で見る</a><span class="info" id="info"></span></div>
<script type="module">
import * as THREE from 'three';
const B={shop2:['商店','shop1','model','atlas.png'],whouse:['西洋の家','whouse1','model','atlas.png'],desert:['砂漠の家','desert2','model','atlas.png'],store:['倉庫','storehouse1','model','atlas.png'],barracks:['兵舎','barracks1','model','atlas.png'],workshop:['工房','workshop1','model','atlas.png'],church:['教会','church1','model','atlas.png'],east:['東洋の家','east_a','model','atlas.png'],temple:['寺','temple1','model','atlas.png'],
shop:['商店(旧)','set1','w_set_a','atlas_photo.png'],two:['2階建て(旧)','set1','w_set_b','atlas_photo.png'],tower:['塔つき(旧)','set1','w_set_c','atlas_photo.png'],balcony:['バルコニー(旧)','set1','w_set_d','atlas_photo.png'],L:['L字(旧)','set1','w_set_e','atlas_photo.png']};
const q=new URLSearchParams(location.search);let cur=B[q.get('b')]?q.get('b'):'shop2';
const cv=document.getElementById('c'),R=new THREE.WebGLRenderer({canvas:cv,antialias:true});R.setPixelRatio(Math.min(devicePixelRatio,2));
const S=new THREE.Scene();S.background=new THREE.Color('#d8dfcf');
S.add(new THREE.HemisphereLight('#fff','#8a8a6a',1.1));const D=new THREE.DirectionalLight('#fff',1.3);D.position.set(6,10,8);S.add(D);
const g=new THREE.Mesh(new THREE.PlaneGeometry(200,200),new THREE.MeshLambertMaterial({color:'#a4b585'}));g.rotation.x=-Math.PI/2;S.add(g);
const cam=new THREE.PerspectiveCamera(40,1,.1,400),TL=new THREE.TextureLoader();let mesh=null,az=.6,el=.25,dist=24,ty=4;
async function load(k){const[,dir,f,at]=B[k];cur=k;if(mesh){S.remove(mesh);mesh.geometry.dispose()}
 const t=await TL.loadAsync('../sekai-hex/assets/ai3d/'+dir+'/'+at);t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=8;
 const d=await (await fetch('../sekai-hex/assets/ai3d/'+dir+'/'+f+'.json')).json();
 const geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.Float32BufferAttribute(d.positions,3));
 const uv=[];for(let i=0;i<d.uvs.length;i+=2)uv.push(d.uvs[i]/1024,1-d.uvs[i+1]/1024);
 geo.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));geo.setIndex(d.indices);geo.computeVertexNormals();geo.computeBoundingBox();
 mesh=new THREE.Mesh(geo,new THREE.MeshLambertMaterial({map:t,side:THREE.DoubleSide}));S.add(mesh);
 const bb=geo.boundingBox,sz=bb.getSize(new THREE.Vector3());dist=Math.max(sz.x,sz.y,sz.z)*3;ty=sz.y*.45;
 document.getElementById('info').textContent=B[k][0]+'　三角形'+(d.indices.length/3)+'　幅'+sz.x.toFixed(1)+'×奥'+sz.z.toFixed(1)+'×高'+sz.y.toFixed(1)+'m';
 document.querySelectorAll('#sel button').forEach(b=>b.classList.toggle('on',b.dataset.k===k));set()}
function set(){cam.position.set(Math.sin(az)*Math.cos(el)*dist,Math.sin(el)*dist+ty,Math.cos(az)*Math.cos(el)*dist);cam.lookAt(0,ty,0)}
const sel=document.getElementById('sel');for(const k in B){const b=document.createElement('button');b.textContent=B[k][0];b.dataset.k=k;b.onclick=()=>load(k);sel.appendChild(b)}
const cm=document.getElementById('cam');[['斜め',.6,.25],['正面',0,.08],['右',Math.PI/2,.08],['裏',Math.PI,.12],['左',-Math.PI/2,.08],['真上',.01,1.4]].forEach(([t,a,e])=>{const b=document.createElement('button');b.textContent=t;b.onclick=()=>{az=a;el=e;set()};cm.appendChild(b)});
let dr=null,pd=0;cv.onpointerdown=e=>{dr=[e.clientX,e.clientY]};addEventListener('pointerup',()=>dr=null);
addEventListener('pointermove',e=>{if(!dr)return;az-=(e.clientX-dr[0])*.008;el=Math.max(.02,Math.min(1.5,el+(e.clientY-dr[1])*.006));dr=[e.clientX,e.clientY];set()});
cv.addEventListener('wheel',e=>{dist*=e.deltaY>0?1.08:.92;set()});
cv.addEventListener('touchmove',e=>{if(e.touches.length==2){const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);if(pd)dist*=pd/d;pd=d;set()}},{passive:true});cv.addEventListener('touchend',()=>pd=0);
function rs(){R.setSize(innerWidth,innerHeight,false);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}addEventListener('resize',rs);rs();
await load(cur);(function loop(){R.render(S,cam);requestAnimationFrame(loop)})();window.__ready=true;
</script></body></html>
