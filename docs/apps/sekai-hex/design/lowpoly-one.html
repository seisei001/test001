<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI製ローポリ建物の確認(1棟)</title>
<style>html,body{margin:0;height:100%;background:#cfd8c4;overflow:hidden;font-family:-apple-system,sans-serif}
#c{width:100%;height:100%;display:block;touch-action:none}
#ui{position:fixed;left:8px;top:8px;right:8px;display:flex;gap:6px;flex-wrap:wrap}
#ui button{padding:7px 11px;border:0;border-radius:8px;background:#fffaf0;color:#2b2418;font-size:13px}</style>
<script type="importmap">{"imports":{"three":"./vendor/three.module.min.js"}}</script></head><body>
<canvas id="c"></canvas><div id="ui"></div>
<script type="module">
import * as THREE from 'three';
const q=new URLSearchParams(location.search),dir=q.get('dir')||'shop1',files=(q.get('m')||'model').split(',');
const cv=document.getElementById('c'),R=new THREE.WebGLRenderer({canvas:cv,antialias:true});R.setPixelRatio(Math.min(devicePixelRatio,2));
const S=new THREE.Scene();S.background=new THREE.Color('#cfd8c4');
S.add(new THREE.HemisphereLight('#fff','#8a8a6a',1.1));const D=new THREE.DirectionalLight('#fff',1.3);D.position.set(6,10,8);S.add(D);
const g=new THREE.Mesh(new THREE.PlaneGeometry(160,160),new THREE.MeshLambertMaterial({color:'#9aab7e'}));g.rotation.x=-Math.PI/2;S.add(g);
const cam=new THREE.PerspectiveCamera(40,1,.1,300);
const tex=await new THREE.TextureLoader().loadAsync(`../assets/ai3d/${dir}/${q.get('atlas')||'atlas.png'}`);tex.colorSpace=THREE.SRGBColorSpace;tex.anisotropy=4;
const mat=new THREE.MeshLambertMaterial({map:tex,side:THREE.DoubleSide});
const grp=new THREE.Group();S.add(grp);
for(let i=0;i<files.length;i++){const d=await (await fetch(`../assets/ai3d/${dir}/${files[i]}.json`)).json();const A=d.atlasSize||1024;
 const geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.Float32BufferAttribute(d.positions,3));
 const uv=[];for(let k=0;k<d.uvs.length;k+=2)uv.push(d.uvs[k]/A,1-d.uvs[k+1]/A);
 geo.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));geo.setIndex(d.indices);geo.computeVertexNormals();
 const m=new THREE.Mesh(geo,mat);m.position.x=(i-(files.length-1)/2)*16;grp.add(m)}
let az=.6,el=.25,dist=22;const set=()=>{cam.position.set(Math.sin(az)*Math.cos(el)*dist,Math.sin(el)*dist+3,Math.cos(az)*Math.cos(el)*dist);cam.lookAt(0,3.5,0)};
const ui=document.getElementById('ui');
[['斜め',.6,.25,22],['正面',0,.08,24],['裏',Math.PI+.5,.2,22],['左',-1.4,.15,22],['右',1.4,.15,22],['上',.6,.9,24]].forEach(([t,a,e,d])=>{const b=document.createElement('button');b.textContent=t;b.onclick=()=>{az=a;el=e;dist=d;set()};ui.appendChild(b)});
let dr=null;cv.onpointerdown=e=>{dr=[e.clientX,e.clientY]};addEventListener('pointerup',()=>dr=null);
addEventListener('pointermove',e=>{if(!dr)return;az-=(e.clientX-dr[0])*.008;el=Math.max(.02,Math.min(1.4,el+(e.clientY-dr[1])*.006));dr=[e.clientX,e.clientY];set()});
function rs(){R.setSize(innerWidth,innerHeight,false);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}addEventListener('resize',rs);rs();set();
(function loop(){R.render(S,cam);requestAnimationFrame(loop)})();
window.__v=(a,e,d)=>{az=a;el=e;dist=d;set()};window.__ready=true;
</script></body></html>
