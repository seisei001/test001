<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>風景の試作 | 世界ハニカム</title>
<style>
html,body{margin:0;height:100%;background:#9cc0dc;overflow:hidden;font-family:"Hiragino Sans","Noto Sans JP",system-ui,sans-serif}
canvas{display:block;width:100vw;height:100vh;touch-action:none;filter:saturate(1.12) contrast(1.04)}
#vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 55%,rgba(20,25,50,.38) 100%)}
#ui{position:fixed;left:12px;bottom:calc(12px + env(safe-area-inset-bottom));display:flex;gap:8px;align-items:center}
#ui button{border:0;border-radius:999px;padding:8px 16px;font-size:14px;background:rgba(255,255,255,.82);color:#223;cursor:pointer}
#ui button.on{background:#223;color:#fff}
#cap{position:fixed;left:14px;top:calc(12px + env(safe-area-inset-top));color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.45);font-size:13px;line-height:1.5}
#cap b{font-size:16px;letter-spacing:.08em}
#load{position:fixed;inset:0;display:grid;place-items:center;background:#9cc0dc;color:#fff;font-size:15px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="vig"></div>
<div id="cap"><b>山のふもと</b><br>標高データだけから描いた景色(ドラッグで見回せます)</div>
<div id="ui"><button data-t="dawn">朝</button><button data-t="noon" class="on">昼</button><button data-t="dusk">夕</button></div>
<div id="load">景色を作っています…</div>
<script src="landscape-data.js"></script>
<script type="importmap">{"imports":{"three":"./vendor/three.module.min.js"}}</script>
<script type="module">
import * as THREE from 'three';

/* ---------- データ(Azgaar の標高・気候帯を格子にしたもの) ---------- */
const dec=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const DW=LS.w, DH=LS.h, HM=dec(LS.hm), BI=dec(LS.bi), RV=dec(LS.rv);
const SIZE_X=400, SIZE_Z=SIZE_X*DH/DW, HS=0.78;           // 横の大きさ、縦の誇張
const sea=20;

/* ---------- ノイズ ---------- */
function hash(x,y){let h=x*374761393+y*668265263;h=(h^(h>>>13))*1274126177;return ((h^(h>>>16))>>>0)/4294967295}
function vnoise(x,y){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi;
  const u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
  const a=hash(xi,yi),b=hash(xi+1,yi),c=hash(xi,yi+1),d=hash(xi+1,yi+1);
  return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v}
function fbm(x,y,o=4){let s=0,a=.5,f=1;for(let i=0;i<o;i++){s+=a*vnoise(x*f,y*f);f*=2.03;a*=.5}return s}
function ridged(x,y,o=4){let s=0,a=.5,f=1;for(let i=0;i<o;i++){s+=a*(1-Math.abs(vnoise(x*f,y*f)*2-1));f*=2.1;a*=.5}return s}
const sstep=(a,b,x)=>{const t=Math.min(1,Math.max(0,(x-a)/(b-a)));return t*t*(3-2*t)};

/* ---------- 地面の高さ ---------- */
function dataH(gx,gy){ // 0..100 を双一次補間
  gx=Math.min(DW-1.001,Math.max(0,gx));gy=Math.min(DH-1.001,Math.max(0,gy));
  const x=gx|0,y=gy|0,fx=gx-x,fy=gy-y,i=y*DW+x;
  const a=HM[i],b=HM[i+1],c=HM[i+DW],d=HM[i+DW+1];
  return (a+(b-a)*fx+(c-a)*fy+(a-b-c+d)*fx*fy)/2.55}
function levelAt(wx,wz){
  const gx=(wx/SIZE_X+.5)*(DW-1), gy=(wz/SIZE_Z+.5)*(DH-1);
  let h=dataH(gx,gy);
  const land=sstep(19,26,h);
  const rough=sstep(28,60,h);
  h+=land*((fbm(wx*.05+9,wz*.05)-.5)*5*(.35+rough));            // 丘のうねり
  h+=rough*(ridged(wx*.028,wz*.028+4,4)-.5)*34*sstep(50,85,h);   // 山の尾根
  h+=rough*(fbm(wx*.16,wz*.16,3)-.5)*5;                           // 岩の細かな起伏
  return h}
const Y=(wx,wz)=>(levelAt(wx,wz)-sea)*HS;
const biomeAt=(wx,wz)=>{const gx=Math.round((wx/SIZE_X+.5)*(DW-1)),gy=Math.round((wz/SIZE_Z+.5)*(DH-1));
  return BI[Math.min(DH-1,Math.max(0,gy))*DW+Math.min(DW-1,Math.max(0,gx))]};

/* ---------- 画面 ---------- */
const canvas=document.getElementById('c');
const R=new THREE.WebGLRenderer({canvas,antialias:true,preserveDrawingBuffer:true});
R.setPixelRatio(Math.min(devicePixelRatio,2));R.outputColorSpace=THREE.SRGBColorSpace;
R.shadowMap.enabled=true;R.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene();
const cam=new THREE.PerspectiveCamera(52,1,1,2500);

/* ---------- 3段のゲーム風の陰 ---------- */
const gm=(()=>{const t=new THREE.DataTexture(new Uint8Array([88,88,88,255, 150,150,150,255, 215,215,215,255, 255,255,255,255]),4,1,THREE.RGBAFormat);
  t.minFilter=t.magFilter=THREE.NearestFilter;t.needsUpdate=true;return t})();

/* ---------- 地形 ---------- */
const BC=['#4a8fb0','#d9b673','#b9ab8e','#a9b455','#7fb34b','#63a03e','#5d9642','#40883b','#3e7d46','#4b7d5a','#a8a78c','#e9f2f6','#6c9c6c'].map(c=>new THREE.Color(c));
const rock=new THREE.Color('#8d8579'), rockD=new THREE.Color('#6d675f'), snow=new THREE.Color('#f4f8fb'), sand=new THREE.Color('#e2cf94'), deep=new THREE.Color('#2f7f9f'), shallow=new THREE.Color('#79c8c0');
const NX=420, NZ=Math.round(NX*DH/DW);
const geo=new THREE.PlaneGeometry(SIZE_X,SIZE_Z,NX-1,NZ-1);geo.rotateX(-Math.PI/2);
const pos=geo.attributes.position, col=new Float32Array(pos.count*3);
for(let i=0;i<pos.count;i++){pos.setY(i,Y(pos.getX(i),pos.getZ(i)))}
geo.computeVertexNormals();
const nrm=geo.attributes.normal, tmp=new THREE.Color();
for(let i=0;i<pos.count;i++){
  const x=pos.getX(i),z=pos.getZ(i),y=pos.getY(i),lv=y/HS+sea,slope=1-nrm.getY(i);
  const bi=biomeAt(x,z);tmp.copy(BC[bi]);
  const n=fbm(x*.045,z*.045+3,3);tmp.offsetHSL((n-.5)*.05,(n-.5)*.08,(n-.5)*.14);       // 色のむら(手描き風)
  if(lv<sea+1.3)tmp.lerp(sand,sstep(sea+1.3,sea-.2,lv)*.9);                               // 浜
  if(lv<sea){tmp.copy(shallow).lerp(deep,sstep(sea,sea-12,lv))}                           // 水の底
  const rk=sstep(.30,.50,slope+ (fbm(x*.09,z*.09)-.5)*.08)*(lv>30?1:.6);                               // 急な所は岩
  tmp.lerp(rock,rk*.85);tmp.lerp(rockD,rk*sstep(.45,.7,slope)*.4);
  const sn=sstep(70+ (fbm(x*.05,z*.05+8)-.5)*14,82,lv)*(1-rk*.45);tmp.lerp(snow,sn);     // 雪
  col[i*3]=tmp.r;col[i*3+1]=tmp.g;col[i*3+2]=tmp.b}
geo.setAttribute('color',new THREE.BufferAttribute(col,3));
const terrain=new THREE.Mesh(geo,new THREE.MeshToonMaterial({vertexColors:true,gradientMap:gm}));
terrain.receiveShadow=true;terrain.castShadow=true;scene.add(terrain);

/* ---------- 水 ---------- */
const water=new THREE.Mesh(new THREE.PlaneGeometry(3000,3000).rotateX(-Math.PI/2),
  new THREE.MeshToonMaterial({color:'#3f93b5',transparent:true,opacity:.72,gradientMap:gm}));
water.position.y=-.05;scene.add(water);

/* ---------- カメラ(いちばん高い所を、南のふもとから見る) ---------- */
let pk={x:0,z:0,l:0};for(let z=-SIZE_Z/2;z<SIZE_Z/2;z+=3)for(let x=-SIZE_X/2;x<SIZE_X/2;x+=3){const l=levelAt(x,z);if(l>pk.l)pk={x,z,l}}
let cx=Math.max(-150,Math.min(150,pk.x*.6)), cz=Math.min(SIZE_Z/2-14,pk.z+150);
let base=Y(cx,cz);for(let i=0;i<40&&base<1.5;i++){cz-=4;base=Y(cx,cz)}
const eye=new THREE.Vector3(cx,Math.max(base,1)+24,cz), tgt=new THREE.Vector3(pk.x,Y(pk.x,pk.z)*.55+10,pk.z);
/* ---------- 木 ---------- */
const treeCols=[ '#3f7f3a','#4c8c3d','#2f6f45','#5b9a44','#6a9a3a' ].map(c=>new THREE.Color(c));
function trunkAndCrown(kind){
  if(kind==='conifer'){const g=new THREE.ConeGeometry(1,2.2,6).translate(0,2.2,0), g2=new THREE.ConeGeometry(.78,1.8,6).translate(0,3.3,0), g3=new THREE.ConeGeometry(.5,1.4,6).translate(0,4.2,0);
    return merge([g,g2,g3])}
  const g=new THREE.IcosahedronGeometry(1.25,0).translate(0,2.6,0), g2=new THREE.IcosahedronGeometry(.9,0).translate(.7,3.3,.2);
  return merge([g,g2])}
function merge(list){const gs=list.map(g=>g.index?g.toNonIndexed():g);let n=0;gs.forEach(g=>n+=g.attributes.position.count);
  const p=new Float32Array(n*3),nr=new Float32Array(n*3);let o=0;
  gs.forEach(g=>{p.set(g.attributes.position.array,o*3);nr.set(g.attributes.normal.array,o*3);o+=g.attributes.position.count});
  const r=new THREE.BufferGeometry();r.setAttribute('position',new THREE.BufferAttribute(p,3));r.setAttribute('normal',new THREE.BufferAttribute(nr,3));return r}
const mats=()=>new THREE.MeshToonMaterial({gradientMap:gm});
const conif=new THREE.InstancedMesh(trunkAndCrown('conifer'),mats(),9000), broad=new THREE.InstancedMesh(trunkAndCrown('broad'),mats(),9000);
let nc=0,nb=0;const m4=new THREE.Matrix4(),q=new THREE.Quaternion(),sv=new THREE.Vector3(),pv=new THREE.Vector3(),cc=new THREE.Color();
let seed=7;const rnd=()=>{seed=(seed*16807)%2147483647;return seed/2147483647};
for(let k=0;k<90000&&(nc<9000||nb<9000);k++){
  const x=(rnd()-.5)*SIZE_X*.98,z=(rnd()-.5)*SIZE_Z*.98,y=Y(x,z),lv=y/HS+sea;
  if(lv<sea+1.6||lv>66||Math.hypot(x-cx,z-cz)<48)continue;
  const dx=Y(x+1.5,z)-Y(x-1.5,z),dz=Y(x,z+1.5)-Y(x,z-1.5);if(Math.hypot(dx,dz)/3>.6)continue;
  const bi=biomeAt(x,z);const clump=fbm(x*.03+40,z*.03);
  let p=0,kind='broad';
  if(bi===6||bi===8||bi===5||bi===7)p=.95*sstep(.32,.5,clump)+.05;
  else if(bi===9||bi===10||bi===2)p=.7*sstep(.28,.45,clump)+.04,kind='conifer';
  else if(bi===4||bi===12)p=.4*sstep(.42,.62,clump);
  else if(bi===3)p=.35*sstep(.42,.62,clump)+.02;
  if(lv>48)kind='conifer',p*=1-sstep(48,66,lv);
  if(rnd()>p)continue;
  const s=(0.55+rnd()*.7)*(kind==='conifer'?1.2:1);
  q.setFromAxisAngle(new THREE.Vector3(0,1,0),rnd()*6.28);sv.set(s,s*(0.9+rnd()*.5),s);pv.set(x,y-.2,z);m4.compose(pv,q,sv);
  cc.copy(treeCols[(rnd()*treeCols.length)|0]);if(kind==='conifer')cc.offsetHSL(.04,-.05,-.08);cc.offsetHSL((rnd()-.5)*.03,0,(rnd()-.5)*.08);cc.r=Math.min(1,Math.max(.04,cc.r));cc.g=Math.min(1,Math.max(.06,cc.g));cc.b=Math.min(1,Math.max(.04,cc.b));
  if(kind==='conifer'){if(nc<9000){conif.setMatrixAt(nc,m4);conif.setColorAt(nc,cc);nc++}}
  else if(nb<9000){broad.setMatrixAt(nb,m4);broad.setColorAt(nb,cc);nb++}}
conif.count=nc;broad.count=nb;[conif,broad].forEach(m=>{m.instanceMatrix.needsUpdate=true;m.instanceColor.needsUpdate=true;m.castShadow=true;m.receiveShadow=true;scene.add(m)});

/* ---------- 空 ---------- */
const skyU={top:{value:new THREE.Color()},hor:{value:new THREE.Color()},sunDir:{value:new THREE.Vector3()},sunCol:{value:new THREE.Color()}};
const sky=new THREE.Mesh(new THREE.SphereGeometry(2000,32,16),new THREE.ShaderMaterial({side:THREE.BackSide,depthWrite:false,fog:false,uniforms:skyU,
 vertexShader:'varying vec3 v;void main(){v=normalize(position);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
 fragmentShader:'varying vec3 v;uniform vec3 top,hor,sunDir,sunCol;void main(){float h=clamp(v.y,0.,1.);vec3 c=mix(hor,top,pow(h,.55));float s=max(dot(normalize(v),sunDir),0.);c+=sunCol*(pow(s,900.)*1.6+pow(s,24.)*.28);gl_FragColor=vec4(c,1.);}'}));
scene.add(sky);

/* ---------- 雲(ゲーム風の平たい雲の絵) ---------- */
function cloudTex(){const c=document.createElement('canvas');c.width=256;c.height=128;const g=c.getContext('2d');
  const puffs=[[60,80,34],[100,60,42],[150,58,46],[196,78,36],[128,84,40],[90,88,30],[170,90,30]];
  puffs.forEach(([x,y,r])=>{const gr=g.createRadialGradient(x,y-r*.25,r*.1,x,y,r);gr.addColorStop(0,'rgba(255,255,255,1)');gr.addColorStop(.7,'rgba(255,255,255,.96)');gr.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=gr;g.beginPath();g.arc(x,y,r,0,7);g.fill()});
  g.globalCompositeOperation='source-atop';const sh=g.createLinearGradient(0,40,0,125);sh.addColorStop(0,'rgba(255,255,255,0)');sh.addColorStop(1,'rgba(150,170,205,.85)');g.fillStyle=sh;g.fillRect(0,0,256,128);
  const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t}
const ct=cloudTex(), clouds=[];
for(let i=0;i<30;i++){const m=new THREE.Sprite(new THREE.SpriteMaterial({map:ct,transparent:true,depthWrite:false,fog:false,opacity:.95}));
  const a=rnd()*6.28,d=380+rnd()*900;m.position.set(Math.cos(a)*d,150+rnd()*160,Math.sin(a)*d-300);
  const s=130+rnd()*220;m.scale.set(s,s*.5,1);m.userData.sp=.5+rnd()*1.4;scene.add(m);clouds.push(m)}

/* ---------- 光(朝・昼・夕) ---------- */
const sun=new THREE.DirectionalLight('#fff',2.2);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-260,right:260,top:260,bottom:-260,near:10,far:900});sun.shadow.bias=-.0006;sun.shadow.normalBias=.6;
scene.add(sun,sun.target);const hemi=new THREE.HemisphereLight('#cfe4ff','#6f7f55',1.0);scene.add(hemi);
const T={
 dawn:{az:2.6,el:.16,sun:'#ffc9a0',sI:2.0,sky:'#6d8fcf',hor:'#ffd9bd',fog:'#f2cbb8',h1:'#c7d6ff',h2:'#8a7a63',hI:.95,cloud:'#ffe2d0'},
 noon:{az:2.2,el:.72,sun:'#fff3d6',sI:2.6,sky:'#3f86d6',hor:'#d3e8f6',fog:'#bfd9ec',h1:'#cfe6ff',h2:'#6f8a55',hI:1.1,cloud:'#ffffff'},
 dusk:{az:1.55,el:.2,sun:'#ffb27a',sI:2.1,sky:'#4f64b8',hor:'#ffc08a',fog:'#e7b496',h1:'#b8b6ec',h2:'#7a6552',hI:.9,cloud:'#ffd2b0'}};
function setTime(k){const t=T[k];
  const d=new THREE.Vector3(Math.cos(t.az)*Math.cos(t.el),Math.sin(t.el),Math.sin(t.az)*Math.cos(t.el)).normalize();
  sun.position.copy(d).multiplyScalar(500);sun.target.position.set(0,0,0);sun.color.set(t.sun);sun.intensity=t.sI;
  hemi.color.set(t.h1);hemi.groundColor.set(t.h2);hemi.intensity=t.hI;
  skyU.top.value.set(t.sky);skyU.hor.value.set(t.hor);skyU.sunDir.value.copy(d);skyU.sunCol.value.set(t.sun);
  scene.fog=new THREE.Fog(t.fog,40,430);clouds.forEach(c=>c.material.color.set(t.cloud));
  document.querySelectorAll('#ui button').forEach(b=>b.classList.toggle('on',b.dataset.t===k))}
document.querySelectorAll('#ui button').forEach(b=>b.onclick=()=>setTime(b.dataset.t));
const qs=new URLSearchParams(location.search);setTime(qs.get('t')||'noon');

let yaw=0,pitch=0,drag=null;
canvas.addEventListener('pointerdown',e=>{drag=[e.clientX,e.clientY,yaw,pitch];canvas.setPointerCapture(e.pointerId)});
canvas.addEventListener('pointermove',e=>{if(!drag)return;yaw=drag[2]-(e.clientX-drag[0])*.004;pitch=Math.max(-.35,Math.min(.5,drag[3]+(e.clientY-drag[1])*.003))});
canvas.addEventListener('pointerup',()=>drag=null);
function size(){const w=innerWidth,h=innerHeight;R.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix()}
addEventListener('resize',size);size();

const clock=new THREE.Clock();
function frame(){const t=clock.getElapsedTime();
  cam.position.copy(eye);cam.position.y+=Math.sin(t*.4)*.4;
  const dir=tgt.clone().sub(eye).normalize();const a=Math.atan2(dir.x,dir.z)+yaw;const p=Math.asin(dir.y)+pitch*.6;
  cam.lookAt(eye.x+Math.sin(a)*Math.cos(p)*100,eye.y+Math.sin(p)*100,eye.z+Math.cos(a)*Math.cos(p)*100);
  clouds.forEach(c=>{c.position.x+=c.userData.sp*.02;if(c.position.x>1300)c.position.x=-1300});
  R.render(scene,cam);requestAnimationFrame(frame)}
document.getElementById('load').remove();window.__ready=true;frame();
</script>
</body>
</html>
