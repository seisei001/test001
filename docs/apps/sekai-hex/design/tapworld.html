<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>世界をタップして景色を見る | 世界ハニカム</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#5f7fb4;overflow:hidden;font-family:"Hiragino Sans","Noto Sans JP",system-ui,sans-serif;color:#fff;overscroll-behavior:none}
.screen{position:fixed;inset:0}
#mapScreen{background:#5f7fb4;touch-action:none;cursor:crosshair}
#stage{position:absolute;left:0;top:0;width:1400px;height:900px;transform-origin:0 0;will-change:transform}
#mapimg{display:block;width:1400px;height:900px;user-select:none;-webkit-user-drag:none;pointer-events:none}
#mark{position:absolute;width:0;height:0;pointer-events:none}
#mark i{position:absolute;left:-14px;top:-14px;width:28px;height:28px;border:3px solid #fff;border-radius:50%;box-shadow:0 0 0 2px rgba(20,30,60,.55),0 0 12px rgba(0,0,0,.5);transform:scale(var(--inv,1))}
#hint{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translateX(-50%);background:rgba(25,35,65,.72);padding:9px 18px;border-radius:999px;font-size:14px;letter-spacing:.04em;pointer-events:none;white-space:nowrap}
#toast{position:fixed;left:50%;bottom:calc(60px + env(safe-area-inset-bottom));transform:translateX(-50%);background:rgba(25,35,65,.85);padding:10px 18px;border-radius:12px;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none}
#toast.on{opacity:1}
#viewScreen{display:none;background:#9cc0dc}
canvas#c{display:block;width:100vw;height:100vh;touch-action:none;filter:saturate(1.12) contrast(1.04);cursor:grab}
#vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 55%,rgba(20,25,50,.38) 100%)}
.btn{border:0;border-radius:999px;padding:9px 16px;font-size:14px;background:rgba(255,255,255,.84);color:#223;cursor:pointer}
.btn.on{background:#223;color:#fff}
#top{position:absolute;left:12px;top:calc(12px + env(safe-area-inset-top));right:12px;display:flex;gap:10px;align-items:flex-start;pointer-events:none}
#top .btn{pointer-events:auto}
#cap{text-shadow:0 1px 6px rgba(0,0,0,.55);font-size:13px;line-height:1.5;padding-top:2px}
#cap b{font-size:16px;letter-spacing:.06em}
#bar{position:absolute;left:12px;bottom:calc(12px + env(safe-area-inset-bottom));display:flex;gap:8px}
#mini{position:absolute;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));width:168px;height:108px;border-radius:10px;border:2px solid rgba(255,255,255,.85);box-shadow:0 2px 10px rgba(0,0,0,.35);background:#5f7fb4}
@media (max-width:600px){#mini{bottom:calc(64px + env(safe-area-inset-bottom));width:140px;height:90px}}
#load{position:fixed;inset:0;display:none;place-items:center;background:rgba(95,127,180,.86);z-index:9;text-align:center;font-size:15px;line-height:1.9}
#load .bar{width:200px;height:6px;border-radius:3px;background:rgba(255,255,255,.3);margin:6px auto 0;overflow:hidden}
#load .bar i{display:block;height:100%;width:0;background:#fff}
</style>
</head>
<body>
<div id="mapScreen" class="screen">
  <div id="stage"><img id="mapimg" alt="世界地図"><div id="mark" style="display:none"><i></i></div></div>
  <div id="hint">行きたい所をタップ。そこの景色を360度見られます</div>
  <div id="toast"></div>
</div>
<div id="viewScreen" class="screen">
  <canvas id="c"></canvas><div id="vig"></div>
  <div id="top"><button class="btn" id="back">← 地図</button><div id="cap"></div></div>
  <div id="bar"><button class="btn" data-t="dawn">朝</button><button class="btn on" data-t="noon">昼</button><button class="btn" data-t="dusk">夕</button><button class="btn on" id="auto">回る</button></div>
  <canvas id="mini" width="336" height="216"></canvas>
</div>
<div id="load"><div><span id="loadMsg">景色を作っています…</span><div class="bar"><i id="loadBar"></i></div></div></div>
<script type="importmap">{"imports":{"three":"./vendor/three.module.min.js"}}</script>
<script type="module">
import * as THREE from 'three';
const $=id=>document.getElementById(id);

/* ================= データの読み込み ================= */
const loadImg=src=>new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=src});
const [dataImg,mapImg,names]=await Promise.all([loadImg('tapworld/world-data.png'),loadImg('tapworld/world-map.jpg'),fetch('tapworld/world-names.json').then(r=>r.json())]);
const DW=dataImg.width,DH=dataImg.height;
const HM=new Uint8Array(DW*DH),BI=new Uint8Array(DW*DH),ST=new Uint8Array(DW*DH);
{const cv=document.createElement('canvas');cv.width=DW;cv.height=DH;const g=cv.getContext('2d',{willReadFrequently:true});g.drawImage(dataImg,0,0);
 const d=g.getImageData(0,0,DW,DH).data;for(let i=0;i<DW*DH;i++){HM[i]=d[i*4];BI[i]=d[i*4+1];ST[i]=d[i*4+2]}}
$('mapimg').src=mapImg.src;
const BIOME_JP=['海','熱帯の砂漠','寒冷な砂漠','サバンナ','草原','熱帯の季節林','温帯の落葉樹林','熱帯雨林','温帯雨林','タイガ','ツンドラ','氷河','湿地'];

/* ================= 地形(世界の座標 = 地図の座標) ================= */
const HS=.78,sea=20;
function hash(x,y){let h=x*374761393+y*668265263;h=(h^(h>>>13))*1274126177;return((h^(h>>>16))>>>0)/4294967295}
function vnoise(x,y){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
  const a=hash(xi,yi),b=hash(xi+1,yi),c=hash(xi,yi+1),d=hash(xi+1,yi+1);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v}
function fbm(x,y,o=4){let s=0,a=.5,f=1;for(let i=0;i<o;i++){s+=a*vnoise(x*f,y*f);f*=2.03;a*=.5}return s}
function ridged(x,y,o=4){let s=0,a=.5,f=1;for(let i=0;i<o;i++){s+=a*(1-Math.abs(vnoise(x*f,y*f)*2-1));f*=2.1;a*=.5}return s}
const sstep=(a,b,x)=>{const t=Math.min(1,Math.max(0,(x-a)/(b-a)));return t*t*(3-2*t)};
function dataH(gx,gy){gx=Math.min(DW-1.001,Math.max(0,gx-.5));gy=Math.min(DH-1.001,Math.max(0,gy-.5));
  const x=gx|0,y=gy|0,fx=gx-x,fy=gy-y,i=y*DW+x,a=HM[i],b=HM[i+1],c=HM[i+DW],d=HM[i+DW+1];return(a+(b-a)*fx+(c-a)*fy+(a-b-c+d)*fx*fy)/2.55}
function levelAt(wx,wz){let h=dataH(wx,wz);if(wx<0||wz<0||wx>=DW||wz>=DH)h=Math.min(8,h);
  const land=sstep(19,26,h),rough=sstep(28,60,h);
  h+=land*((fbm(wx*.05+9,wz*.05)-.5)*5*(.35+rough));h+=rough*(ridged(wx*.028,wz*.028+4,4)-.5)*34*sstep(50,85,h);h+=rough*(fbm(wx*.16,wz*.16,3)-.5)*5;return h}
const Y=(x,z)=>(levelAt(x,z)-sea)*HS;
const idx=(x,z)=>Math.min(DH-1,Math.max(0,Math.floor(z)))*DW+Math.min(DW-1,Math.max(0,Math.floor(x)));
const biomeAt=(x,z)=>BI[idx(x,z)];

/* ================= 色 ================= */
const hx=c=>{const n=parseInt(c.slice(1),16);return[(n>>16)&255,(n>>8)&255,n&255]};
const BC=['#4a8fb0','#d9b673','#b9ab8e','#a9b455','#7fb34b','#63a03e','#5d9642','#40883b','#3e7d46','#4b7d5a','#a8a78c','#e9f2f6','#6c9c6c'].map(hx);
const ROCK=hx('#8d8579'),ROCKD=hx('#6d675f'),SNOW=hx('#f4f8fb'),SAND=hx('#e2cf94'),WSH=hx('#79c8c0'),WDP=hx('#2f7f9f');
const mix=(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];
const T={
 dawn:{az:2.6,el:.16,sun:'#ffc9a0',sky:'#6d8fcf',hor:'#ffd9bd',fog:'#f2cbb8',amb:.58,cloud:'#ffe2d0'},
 noon:{az:2.2,el:.72,sun:'#fff3d6',sky:'#3f86d6',hor:'#d3e8f6',fog:'#bfd9ec',amb:.6,cloud:'#ffffff'},
 dusk:{az:1.55,el:.2,sun:'#ffb27a',sky:'#4f64b8',hor:'#ffc08a',fog:'#e7b496',amb:.5,cloud:'#ffd2b0'}};
const TB={dawn:{sI:2.0,h1:'#c7d6ff',h2:'#8a7a63',hI:1.3},noon:{sI:2.5,h1:'#cfe6ff',h2:'#6f8a55',hI:1.5},dusk:{sI:2.1,h1:'#b8b6ec',h2:'#7a6552',hI:1.2}};
const treeCols=['#3f7f3a','#4c8c3d','#2f6f45','#5b9a44','#6a9a3a'].map(hx);
let seed=7;const rnd=()=>{seed=(seed*16807)%2147483647;return seed/2147483647};

/* ================= 遠景: 360度の円筒に貼る絵 ================= */
const ARC=Math.PI*2,BH=0,CW=4096,CH=640,tTop=Math.tan(.5),tBot=-Math.tan(.75);
const BANDS=[200,340,620],RAD=[150,270,470],NB=BANDS.length;
const rowOf=t=>(tTop-t)/(tTop-tBot)*CH;
const bandOf=d=>{for(let k=0;k<NB;k++)if(d<BANDS[k])return k;return NB-1};
const dist=[];{let d=3;while(d<BANDS[NB-1]){dist.push(d);d+=Math.max(.8,d*.012)}}
const NS=dist.length;
const eye={x:0,y:0,z:0};
const tick=()=>new Promise(r=>setTimeout(r,0));

async function bake(key,prog){
  const t=T[key],sunC=hx(t.sun),fogC=hx(t.fog);
  const sd=[Math.cos(t.az)*Math.cos(t.el),Math.sin(t.el),Math.sin(t.az)*Math.cos(t.el)];
  const imgs=Array.from({length:NB},()=>{const im=new ImageData(CW,CH),d=im.data;for(let p=0;p<d.length;p+=4){d[p]=fogC[0];d[p+1]=fogC[1];d[p+2]=fogC[2]}return im});
  const hzTab=new Float32Array(CW*NS),top=new Float32Array(CW);
  const shade=l=>l<.12?.55:l<.4?.76:l<.72?.92:1;
  const colorAt=(x,z,lvl,d)=>{
    let c;
    if(lvl<sea){c=mix(WSH,WDP,sstep(sea,sea-12,lvl));return mix(c,fogC,sstep(30,420,d)*.85)}
    const e=Math.max(1.2,d*.008),gx=(Y(x+e,z)-Y(x-e,z))/(2*e),gz=(Y(x,z+e)-Y(x,z-e))/(2*e);
    const il=1/Math.hypot(gx,1,gz),nx=-gx*il,ny=il,nz=-gz*il,slope=1-ny;
    c=BC[biomeAt(x,z)].slice();
    if(d<260){const n=fbm(x*.045,z*.045+3,2),k=.86+n*.28;c=[c[0]*k,c[1]*k,c[2]*k]}
    if(lvl<sea+1.3)c=mix(c,SAND,sstep(sea+1.3,sea-.2,lvl)*.9);
    const rk=sstep(.30,.50,slope+(fbm(x*.09,z*.09,2)-.5)*.08)*(lvl>30?1:.6);
    c=mix(c,ROCK,rk*.85);c=mix(c,ROCKD,rk*sstep(.45,.7,slope)*.4);
    const sn=sstep(70+(fbm(x*.05,z*.05+8,2)-.5)*14,82,lvl)*(1-rk*.45);c=mix(c,SNOW,sn);
    const lam=Math.max(0,nx*sd[0]+ny*sd[1]+nz*sd[2]),s=shade(lam),k=t.amb+(1-t.amb)*s;
    c=[c[0]*k*(.9+.1*sunC[0]/255)*(s>.9?1.02:1),c[1]*k*(.9+.1*sunC[1]/255),c[2]*k*(.88+.12*sunC[2]/255)];
    if(key!=='noon'&&s>.9)c=[c[0]*1.06,c[1],c[2]*.92];
    return mix(c,fogC,sstep(35,540,d)*.9)};
  for(let c=0;c<CW;c++){
    const a=BH-(c/CW-.5)*ARC,dx=Math.sin(a),dz=Math.cos(a);let hz=tBot;
    for(let i=0;i<NS;i++){
      const d=dist[i],x=eye.x+dx*d,z=eye.z+dz*d,lvl=levelAt(x,z),y=Math.max(lvl-sea,0)*HS,tt=(y-eye.y)/d;
      if(tt>hz){
        const col=colorAt(x,z,lvl,d),img=imgs[bandOf(d)].data;
        const r0=Math.max(0,Math.ceil(rowOf(tt))),r1=Math.min(CH-1,Math.floor(rowOf(hz)));
        for(let r=r0;r<=r1;r++){const p=(r*CW+c)*4;img[p]=col[0];img[p+1]=col[1];img[p+2]=col[2];img[p+3]=255}
        hz=tt}
      hzTab[c*NS+i]=hz}
    top[c]=hz;
    if((c&255)===255){prog&&prog(c/CW*.8);await tick()}}
  const cvs=imgs.map(im=>{const cv=document.createElement('canvas');cv.width=CW;cv.height=CH;cv.getContext('2d').putImageData(im,0,0);return cv});
  const ctxs=cvs.map(cv=>cv.getContext('2d'));
  /* 木を絵として描き込む */
  const trees=[];seed=Math.floor(eye.x*7+eye.z*13)%2147483 +7;
  for(let k=0;k<420000&&trees.length<22000;k++){
    const ang=rnd()*ARC,d=100+Math.pow(rnd(),1.5)*400,x=eye.x+Math.sin(ang)*d,z=eye.z+Math.cos(ang)*d;
    if(x<0||z<0||x>=DW||z>=DH)continue;
    const y=Y(x,z),lv=y/HS+sea;if(lv<sea+1.6||lv>66)continue;
    const bi=biomeAt(x,z);let p=0,kind='b';const cl=fbm(x*.03+40,z*.03);
    if(bi===6||bi===8||bi===5||bi===7)p=.95*sstep(.32,.5,cl)+.05;
    else if(bi===9||bi===10||bi===2){p=.7*sstep(.28,.45,cl)+.04;kind='c'}
    else if(bi===4||bi===12)p=.4*sstep(.42,.62,cl);else if(bi===3)p=.35*sstep(.42,.62,cl)+.02;
    if(lv>48){kind='c';p*=1-sstep(48,66,lv)}
    if(rnd()>p)continue;
    const dxh=Y(x+1.5,z)-Y(x-1.5,z),dzh=Y(x,z+1.5)-Y(x,z-1.5);if(Math.hypot(dxh,dzh)/3>.6)continue;
    trees.push({x,z,y,d,a:ang,kind,s:(.55+rnd()*.7)*(kind==='c'?1.2:1)*1.35,ci:(rnd()*5)|0})}
  trees.sort((a,b)=>b.d-a.d);prog&&prog(.88);await tick();
  const pxRad=CW/ARC,rgb=q=>`rgb(${q[0]|0},${q[1]|0},${q[2]|0})`;let drawn=0;
  const ci=new Int32Array(1);const idxOf=d=>{let lo=0,hi=NS-1;while(lo<hi){const m=(lo+hi)>>1;if(dist[m]>=d)hi=m;else lo=m+1}return lo};
  for(const tr of trees){
    const d=tr.d;let rel=tr.a-BH;while(rel>Math.PI)rel-=2*Math.PI;while(rel<-Math.PI)rel+=2*Math.PI;
    const c=(.5-rel/ARC)*CW,i=Math.max(0,Math.min(NS-1,idxOf(d)-2));
    const hh=tr.s*(tr.kind==='c'?4.4:3.9),ttop=(tr.y+hh-eye.y)/d;
    if(ttop<=hzTab[Math.min(CW-1,Math.max(0,c|0))*NS+i]+.0005)continue;
    const k=bandOf(d),ctx=ctxs[k],rb=rowOf((tr.y-eye.y)/d),rt=rowOf(ttop),w=tr.s*(tr.kind==='c'?1.0:1.35)/d*pxRad;
    let col=treeCols[tr.ci].slice();if(tr.kind==='c')col=[col[0]*.82,col[1]*.9,col[2]*.88];
    const lit=[Math.min(255,col[0]*1.25),Math.min(255,col[1]*1.25),Math.min(255,col[2]*1.2)];
    const f=sstep(35,540,d)*.9,dark=t.amb+(1-t.amb)*.85;
    const b2=mix([col[0]*dark,col[1]*dark,col[2]*dark],fogC,f),l2=mix([lit[0]*dark,lit[1]*dark,lit[2]*dark],fogC,f);
    const right=Math.sin(t.az-tr.a)<0?1:-1;
    for(const off of [0,CW,-CW]){const cc=c+off;if(cc<-w-2||cc>CW+w+2)continue;
      ctx.fillStyle=rgb(b2);
      if(tr.kind==='c'){
        for(let j=0;j<3;j++){const y1=rb+(rt-rb)*(.18+j*.28),ww=w*(1.05-j*.3);ctx.beginPath();ctx.moveTo(cc-ww,y1);ctx.lineTo(cc,rb+(rt-rb)*(.62+j*.3));ctx.lineTo(cc+ww,y1);ctx.closePath();ctx.fill()}
        ctx.fillStyle=rgb(l2);ctx.beginPath();ctx.moveTo(cc,rt);ctx.lineTo(cc+right*w*.5,rb+(rt-rb)*.5);ctx.lineTo(cc,rb+(rt-rb)*.5);ctx.closePath();ctx.fill()
      }else{
        ctx.beginPath();ctx.ellipse(cc,rb+(rt-rb)*.62,w,Math.abs(rb-rt)*.42,0,0,7);ctx.fill();
        ctx.fillStyle=rgb(l2);ctx.beginPath();ctx.ellipse(cc+right*w*.28,rb+(rt-rb)*.7,w*.55,Math.abs(rb-rt)*.28,0,0,7);ctx.fill()}}
    drawn++}
  /* 山がいちばん高く見える方向 */
  const iN=idxOf(110),iF=NS-1;let best=0,bv=-9;for(let c=0;c<CW;c++){let s=0;for(let j=-60;j<=60;j+=12){const cc=(c+j+CW)%CW;s+=(hzTab[cc*NS+iF]-hzTab[cc*NS+iN])*1.0+(hzTab[cc*NS+iN]<.25?.15:-.3)}if(s>bv){bv=s;best=c}}
  prog&&prog(1);
  return {cvs,drawn,sd,t,bestA:BH-(best/CW-.5)*ARC}}

/* ================= 画面 ================= */
const canvas=$('c');
const R=new THREE.WebGLRenderer({canvas,antialias:true,preserveDrawingBuffer:true});
R.setPixelRatio(Math.min(devicePixelRatio,2));R.outputColorSpace=THREE.SRGBColorSpace;R.autoClear=false;
R.shadowMap.enabled=true;R.shadowMap.type=THREE.PCFSoftShadowMap;
const sceneA=new THREE.Scene(),sceneB=new THREE.Scene();
const camA=new THREE.PerspectiveCamera(52,1,1,3000),camB=new THREE.PerspectiveCamera(52,1,.5,1200);

/* --- 遠景: 空・雲・円筒 --- */
const skyU={top:{value:new THREE.Color()},hor:{value:new THREE.Color()},sunDir:{value:new THREE.Vector3()},sunCol:{value:new THREE.Color()}};
const sky=new THREE.Mesh(new THREE.SphereGeometry(2000,32,16),new THREE.ShaderMaterial({side:THREE.BackSide,depthWrite:false,depthTest:false,fog:false,uniforms:skyU,
 vertexShader:'varying vec3 v;void main(){v=normalize(position);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
 fragmentShader:'varying vec3 v;uniform vec3 top,hor,sunDir,sunCol;void main(){float h=clamp(v.y,0.,1.);vec3 c=mix(hor,top,pow(h,.55));float s=max(dot(normalize(v),sunDir),0.);c+=sunCol*(pow(s,900.)*1.6+pow(s,24.)*.28);gl_FragColor=vec4(c,1.);}'}));
sky.renderOrder=-3;sceneA.add(sky);
function cloudTex(){const c=document.createElement('canvas');c.width=256;c.height=128;const g=c.getContext('2d');
  [[60,80,34],[100,60,42],[150,58,46],[196,78,36],[128,84,40],[90,88,30],[170,90,30]].forEach(([x,y,r])=>{const gr=g.createRadialGradient(x,y-r*.25,r*.1,x,y,r);gr.addColorStop(0,'rgba(255,255,255,1)');gr.addColorStop(.7,'rgba(255,255,255,.96)');gr.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=gr;g.beginPath();g.arc(x,y,r,0,7);g.fill()});
  g.globalCompositeOperation='source-atop';const sh=g.createLinearGradient(0,40,0,125);sh.addColorStop(0,'rgba(255,255,255,0)');sh.addColorStop(1,'rgba(150,170,205,.85)');g.fillStyle=sh;g.fillRect(0,0,256,128);
  const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t}
const ct=cloudTex(),clouds=[];
for(let i=0;i<34;i++){const m=new THREE.Sprite(new THREE.SpriteMaterial({map:ct,transparent:true,depthWrite:false,depthTest:false,fog:false,opacity:.95}));
  const a=i/34*6.283+rnd()*.4,d=900+rnd()*900;m.position.set(Math.sin(a)*d,260+rnd()*330,Math.cos(a)*d);
  const s=150+rnd()*210;m.scale.set(s,s*.5,1);m.userData.sp=.4+rnd()*1.2;m.renderOrder=-2;sceneA.add(m);clouds.push(m)}
const layers=[];

/* --- 近景: 3D(半径130。外側へ透明に消えて円筒の絵とつながる) --- */
const gm=(()=>{const t=new THREE.DataTexture(new Uint8Array([105,105,105,255,160,160,160,255,220,220,220,255,255,255,255,255]),4,1,THREE.RGBAFormat);t.minFilter=t.magFilter=THREE.NearestFilter;t.needsUpdate=true;return t})();
const NR=130,NV=300;
const eyeU={value:new THREE.Vector2()};
function fade(mat){mat.transparent=true;mat.onBeforeCompile=sh=>{sh.uniforms.uEye=eyeU;
  sh.vertexShader=sh.vertexShader.replace('#include <common>','#include <common>\nvarying vec3 vW;').replace('#include <project_vertex>','#include <project_vertex>\n vec4 wp=vec4(transformed,1.0);\n#ifdef USE_INSTANCING\n wp=instanceMatrix*wp;\n#endif\n vW=(modelMatrix*wp).xyz;');
  sh.fragmentShader=sh.fragmentShader.replace('#include <common>','#include <common>\nvarying vec3 vW;uniform vec2 uEye;').replace('#include <dithering_fragment>','#include <dithering_fragment>\n gl_FragColor.a*=1.0-smoothstep(82.0,128.0,length(vW.xz-uEye));')};
  mat.customProgramCacheKey=()=>'fadeH';return mat}
const geo=new THREE.PlaneGeometry(2*NR,2*NR,NV-1,NV-1);geo.rotateX(-Math.PI/2);
geo.setAttribute('color',new THREE.BufferAttribute(new Float32Array(geo.attributes.position.count*3),3));
const terrain=new THREE.Mesh(geo,fade(new THREE.MeshToonMaterial({vertexColors:true,gradientMap:gm})));terrain.receiveShadow=true;terrain.castShadow=true;terrain.frustumCulled=false;sceneB.add(terrain);
const water=new THREE.Mesh(new THREE.PlaneGeometry(2*NR*1.1,2*NR*1.1).rotateX(-Math.PI/2),fade(new THREE.MeshToonMaterial({color:'#3f93b5',gradientMap:gm})));
water.material.opacity=.72;water.position.y=-.05;sceneB.add(water);
function merge(list){const gs=list.map(g=>g.index?g.toNonIndexed():g);let n=0;gs.forEach(g=>n+=g.attributes.position.count);
  const p=new Float32Array(n*3),nr=new Float32Array(n*3);let o=0;gs.forEach(g=>{p.set(g.attributes.position.array,o*3);nr.set(g.attributes.normal.array,o*3);o+=g.attributes.position.count});
  const r=new THREE.BufferGeometry();r.setAttribute('position',new THREE.BufferAttribute(p,3));r.setAttribute('normal',new THREE.BufferAttribute(nr,3));return r}
const conif=new THREE.InstancedMesh(merge([new THREE.ConeGeometry(1,2.2,6).translate(0,2.2,0),new THREE.ConeGeometry(.78,1.8,6).translate(0,3.3,0),new THREE.ConeGeometry(.5,1.4,6).translate(0,4.2,0)]),fade(new THREE.MeshToonMaterial({gradientMap:gm})),6000);
const broad=new THREE.InstancedMesh(merge([new THREE.IcosahedronGeometry(1.25,0).translate(0,2.6,0),new THREE.IcosahedronGeometry(.9,0).translate(.7,3.3,.2)]),fade(new THREE.MeshToonMaterial({gradientMap:gm})),6000);
[conif,broad].forEach(m=>{m.castShadow=true;m.receiveShadow=true;m.frustumCulled=false;sceneB.add(m)});
const sun=new THREE.DirectionalLight('#fff',2.2);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-140,right:140,top:140,bottom:-140,near:10,far:700});sun.shadow.bias=-.0006;sun.shadow.normalBias=.5;
sceneB.add(sun,sun.target);const hemi=new THREE.HemisphereLight('#cfe4ff','#6f7f55',1.0);sceneB.add(hemi);

function buildNear(){
  eyeU.value.set(eye.x,eye.z);terrain.position.set(eye.x,0,eye.z);water.position.x=eye.x;water.position.z=eye.z;
  water.visible=false;const pos=geo.attributes.position;for(let i=0;i<pos.count;i++){const yy=Y(eye.x+pos.getX(i),eye.z+pos.getZ(i));pos.setY(i,yy<0?-.05:yy)}
  pos.needsUpdate=true;geo.computeVertexNormals();
  const nrm=geo.attributes.normal,col=geo.attributes.color.array,tc=new THREE.Color();
  for(let i=0;i<pos.count;i++){const x=eye.x+pos.getX(i),z=eye.z+pos.getZ(i),lv=levelAt(x,z),slope=1-nrm.getY(i);let c=BC[biomeAt(x,z)].slice();
    const n=fbm(x*.045,z*.045+3,3),k=.86+n*.28;c=[c[0]*k,c[1]*k,c[2]*k];
    if(lv<sea+1.3)c=mix(c,SAND,sstep(sea+1.3,sea-.2,lv)*.9);
    if(lv<sea)c=mix(WSH,WDP,sstep(sea,sea-12,lv));
    const rk=sstep(.30,.50,slope+(fbm(x*.09,z*.09)-.5)*.08)*(lv>30?1:.6);c=mix(c,ROCK,rk*.85);c=mix(c,ROCKD,rk*sstep(.45,.7,slope)*.4);
    const sn=sstep(70+(fbm(x*.05,z*.05+8)-.5)*14,82,lv)*(1-rk*.45);c=mix(c,SNOW,sn);
    tc.setRGB(c[0]/255,c[1]/255,c[2]/255,THREE.SRGBColorSpace);col[i*3]=tc.r;col[i*3+1]=tc.g;col[i*3+2]=tc.b}
  geo.attributes.color.needsUpdate=true;
  let nc=0,nb=0;const m4=new THREE.Matrix4(),q=new THREE.Quaternion(),sv=new THREE.Vector3(),pv=new THREE.Vector3(),cc=new THREE.Color(),up=new THREE.Vector3(0,1,0);seed=Math.floor(eye.x*3+eye.z*5)%2147483+11;
  for(let k=0;k<120000&&(nc<6000||nb<6000);k++){
    const ang=rnd()*6.283,d=30+Math.sqrt(rnd())*(NR-30),x=eye.x+Math.cos(ang)*d,z=eye.z+Math.sin(ang)*d;
    if(x<0||z<0||x>=DW||z>=DH)continue;
    const y=Y(x,z),lv=y/HS+sea;if(lv<sea+1.6||lv>66)continue;
    const bi=biomeAt(x,z),cl=fbm(x*.03+40,z*.03);let p=0,kind='b';
    if(bi===6||bi===8||bi===5||bi===7)p=.95*sstep(.32,.5,cl)+.05;
    else if(bi===9||bi===10||bi===2){p=.7*sstep(.28,.45,cl)+.04;kind='c'}
    else if(bi===4||bi===12)p=.4*sstep(.42,.62,cl);else if(bi===3)p=.35*sstep(.42,.62,cl)+.02;
    if(lv>48){kind='c';p*=1-sstep(48,66,lv)}
    if(rnd()>p)continue;
    const dx=Y(x+1.5,z)-Y(x-1.5,z),dz=Y(x,z+1.5)-Y(x,z-1.5);if(Math.hypot(dx,dz)/3>.6)continue;
    const s=(.55+rnd()*.7)*(kind==='c'?1.2:1);q.setFromAxisAngle(up,rnd()*6.28);sv.set(s,s*(.9+rnd()*.5),s);pv.set(x,y-.2,z);m4.compose(pv,q,sv);
    const tcol=treeCols[(rnd()*5)|0];cc.setRGB(tcol[0]/255,tcol[1]/255,tcol[2]/255,THREE.SRGBColorSpace);if(kind==='c')cc.multiplyScalar(.78);cc.offsetHSL((rnd()-.5)*.03,0,0);cc.multiplyScalar(.88+rnd()*.24);
    if(kind==='c'){if(nc<6000){conif.setMatrixAt(nc,m4);conif.setColorAt(nc,cc);nc++}}else if(nb<6000){broad.setMatrixAt(nb,m4);broad.setColorAt(nb,cc);nb++}}
  conif.count=nc;broad.count=nb;[conif,broad].forEach(m=>{m.instanceMatrix.needsUpdate=true;if(m.instanceColor)m.instanceColor.needsUpdate=true});
  return nc+nb}

function applyBake(key,res){
  layers.forEach(m=>{m.material.map.dispose();m.material.dispose();m.geometry.dispose();sceneA.remove(m)});layers.length=0;
  res.cvs.forEach((cv,k)=>{
    const tex=new THREE.CanvasTexture(cv);tex.colorSpace=THREE.SRGBColorSpace;tex.generateMipmaps=false;tex.minFilter=THREE.LinearFilter;tex.magFilter=THREE.LinearFilter;
    tex.wrapS=THREE.RepeatWrapping;tex.repeat.x=-1;tex.offset.x=1;
    const r=RAD[k],g=new THREE.CylinderGeometry(r,r,r*(tTop-tBot),160,1,true,BH-ARC/2,ARC);
    const m=new THREE.Mesh(g,new THREE.MeshBasicMaterial({map:tex,transparent:true,side:THREE.BackSide,depthTest:false,depthWrite:false,fog:false}));
    m.position.y=r*(tTop+tBot)/2;m.renderOrder=1+k;sceneA.add(m);layers.push(m)});
  const t=res.t,tb=TB[key],d=new THREE.Vector3(...res.sd).normalize();
  skyU.top.value.set(t.sky);skyU.hor.value.set(t.hor);skyU.sunDir.value.copy(d);skyU.sunCol.value.set(t.sun);
  clouds.forEach(c=>c.material.color.set(t.cloud));
  sun.position.set(eye.x+d.x*300,d.y*300,eye.z+d.z*300);sun.target.position.set(eye.x,0,eye.z);sun.color.set(t.sun);sun.intensity=tb.sI;
  hemi.color.set(tb.h1);hemi.groundColor.set(tb.h2);hemi.intensity=tb.hI;sceneB.fog=new THREE.Fog(t.fog,70,420);
  document.querySelectorAll('#bar [data-t]').forEach(b=>b.classList.toggle('on',b.dataset.t===key))}

/* ================= 画面の切り替え・入力 ================= */
let curKey='noon',yaw=0,pitch=0,autoRot=true,inView=false,busy=false,loc={x:0,z:0},drag=null;
const load=$('load'),setLoad=(m,p)=>{$('loadMsg').textContent=m;$('loadBar').style.width=Math.round(p*100)+'%'};
function toast(m){const e=$('toast');e.textContent=m;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2200)}

async function enter(x,z){
  if(busy)return;
  const lv=levelAt(x,z);if(lv<sea+.5){toast('そこは海です。陸の所をタップしてください');return}
  busy=true;loc={x,z};load.style.display='grid';setLoad('景色を作っています…',0);await tick();
  eye.x=x;eye.z=z;eye.y=Math.max(Y(x,z),1)+24;
  setLoad('近くの地形を作っています…',.02);await tick();const nTree=buildNear();
  const res=await bake(curKey,p=>setLoad('遠くの景色を描いています…',.05+p*.95));
  applyBake(curKey,res);yaw=res.bestA;pitch=0;
  const sid=ST[idx(x,z)],nm=sid===0?'国のない土地(辺境)':(names.states[sid]||'');
  $('cap').innerHTML='<b>'+nm+'</b><br>'+BIOME_JP[biomeAt(x,z)]+' ・ 地図の位置 '+Math.round(x)+', '+Math.round(z);
  $('mapScreen').style.display='none';$('viewScreen').style.display='block';inView=true;size();
  load.style.display='none';busy=false;window.__ready=true;window.__trees=nTree+res.drawn}
async function retime(key){
  if(busy)return;busy=true;curKey=key;load.style.display='grid';setLoad('描き直しています…',0);await tick();
  const res=await bake(key,p=>setLoad('描き直しています…',p));applyBake(key,res);load.style.display='none';busy=false}
$('bar').querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>retime(b.dataset.t));
$('auto').onclick=()=>{autoRot=!autoRot;$('auto').classList.toggle('on',autoRot)};
$('back').onclick=()=>{inView=false;$('viewScreen').style.display='none';$('mapScreen').style.display='block'};

canvas.addEventListener('pointerdown',e=>{drag=[e.clientX,e.clientY,yaw,pitch];autoRot=false;$('auto').classList.remove('on');canvas.setPointerCapture(e.pointerId);canvas.style.cursor='grabbing'});
canvas.addEventListener('pointermove',e=>{if(!drag)return;yaw=drag[2]+(e.clientX-drag[0])*.005;pitch=Math.max(-.3,Math.min(.4,drag[3]+(e.clientY-drag[1])*.003))});
canvas.addEventListener('pointerup',()=>{drag=null;canvas.style.cursor='grab'});
function size(){const w=innerWidth,h=innerHeight;R.setSize(w,h,false);[camA,camB].forEach(c=>{c.aspect=w/h;c.fov=w/h<.9?66:52;c.updateProjectionMatrix()})}
addEventListener('resize',size);

/* --- 地図の画面(拡大・移動・タップ) --- */
const stage=$('stage'),ms=$('mapScreen'),mark=$('mark');
let sc=1,tx=0,ty=0,fit=1;const ptrs=new Map();let tap=null,pinch=null;
function applyT(){stage.style.transform=`translate(${tx}px,${ty}px) scale(${sc})`;mark.style.setProperty('--inv',1/sc)}
function fitMap(){fit=Math.min(innerWidth/1400,innerHeight/900);if(sc<fit||!fitMap.done){sc=fit;tx=(innerWidth-1400*sc)/2;ty=(innerHeight-900*sc)/2;fitMap.done=true}applyT()}
function zoomAt(cx,cy,ns){ns=Math.max(fit,Math.min(fit*8,ns));tx=cx-(cx-tx)*ns/sc;ty=cy-(cy-ty)*ns/sc;sc=ns;applyT()}
ms.addEventListener('pointerdown',e=>{ptrs.set(e.pointerId,[e.clientX,e.clientY]);ms.setPointerCapture(e.pointerId);
  if(ptrs.size===1)tap={x:e.clientX,y:e.clientY,t:performance.now(),moved:0};else tap=null});
ms.addEventListener('pointermove',e=>{const p=ptrs.get(e.pointerId);if(!p)return;const dx=e.clientX-p[0],dy=e.clientY-p[1];p[0]=e.clientX;p[1]=e.clientY;
  if(ptrs.size===1){if(tap)tap.moved+=Math.abs(dx)+Math.abs(dy);if(!tap||tap.moved>8){tx+=dx;ty+=dy;applyT()}}});
ms.addEventListener('pointerup',e=>{ptrs.delete(e.pointerId);
  if(tap&&tap.moved<=8&&performance.now()-tap.t<600){const x=(e.clientX-tx)/sc,z=(e.clientY-ty)/sc;
    if(x>=0&&z>=0&&x<1400&&z<900){mark.style.display='block';mark.style.left=x+'px';mark.style.top=z+'px';enter(x,z)}}
  tap=null;if(ptrs.size<2)pinch=null});
ms.addEventListener('pointercancel',e=>{ptrs.delete(e.pointerId);tap=null;pinch=null});
addEventListener('resize',fitMap);fitMap();

/* --- ミニ地図 --- */
const mini=$('mini'),mg=mini.getContext('2d');
function drawMini(){const w=mini.width,h=mini.height,k=w/1400;mg.drawImage(mapImg,0,0,w,h);
  const x=loc.x*k,z=loc.z*k,fov=camB.aspect<.9?.58:.46,L=46,a0=Math.atan2(Math.cos(yaw),Math.sin(yaw)); // 向き(方位 a の方向 = (sin a, cos a))
  mg.beginPath();mg.moveTo(x,z);mg.arc(x,z,L,a0-fov,a0+fov);mg.closePath();mg.fillStyle='rgba(255,255,255,.55)';mg.fill();mg.lineWidth=2;mg.strokeStyle='#fff';mg.stroke();
  mg.fillStyle='#e23';mg.beginPath();mg.arc(x,z,5,0,7);mg.fill();mg.stroke()}

const clock=new THREE.Clock();let last=0;
function frame(){requestAnimationFrame(frame);if(!inView)return;
  const t=clock.getElapsedTime(),dt=Math.min(.1,t-last);last=t;
  if(autoRot&&!busy)yaw+=dt*.14;
  const sx=Math.sin(t*.35)*2.2,sy=Math.sin(t*.5)*.5;
  camA.position.set(sx,sy,0);camB.position.set(eye.x+sx,eye.y+sy,eye.z);
  const p=(camB.aspect<.9?-.1:.04)+pitch,dx=Math.sin(yaw)*Math.cos(p)*100,dy=Math.sin(p)*100,dz=Math.cos(yaw)*Math.cos(p)*100;
  camA.lookAt(camA.position.x+dx,camA.position.y+dy,camA.position.z+dz);camB.lookAt(camB.position.x+dx,camB.position.y+dy,camB.position.z+dz);
  clouds.forEach(c=>{c.position.x+=c.userData.sp*.05});
  R.clear();R.render(sceneA,camA);R.clearDepth();R.render(sceneB,camB);drawMini()}
frame();
window.__enter=enter;window.__setYaw=v=>{yaw=v;autoRot=false};
const qs=new URLSearchParams(location.search);if(qs.get('x'))enter(+qs.get('x'),+qs.get('z'));
