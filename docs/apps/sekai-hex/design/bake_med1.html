<!doctype html><meta charset=utf-8><script type="importmap">{"imports":{"three":"./vendor/three.module.min.js"}}</script>
<canvas id=c></canvas>
<script type="module">
import * as THREE from 'three';
const R=new THREE.WebGLRenderer({canvas:document.getElementById('c'),antialias:true,preserveDrawingBuffer:true});
R.shadowMap.enabled=true;R.shadowMap.type=THREE.PCFSoftShadowMap;
const tex=await new THREE.TextureLoader().loadAsync('../assets/ai3d/med1/atlas.png');tex.colorSpace=THREE.SRGBColorSpace;tex.anisotropy=8;
const mat=new THREE.MeshLambertMaterial({map:tex,side:THREE.DoubleSide});
const cache={};
async function load(n){if(cache[n])return cache[n];cache[n]=await (await fetch(`../assets/ai3d/med1/${n}.json`)).json();return cache[n]}
function geo(d,names){
  const uv=new Float32Array(d.uvs.length);for(let i=0;i<uv.length;i+=2){uv[i]=d.uvs[i]/1024;uv[i+1]=1-d.uvs[i+1]/1024}
  let idx=d.indices;if(names){idx=[];for(const p of d.parts)if(names.includes(p.name))for(let i=p.start;i<p.start+p.count;i++)idx.push(d.indices[i])}
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(d.positions,3));g.setAttribute('uv',new THREE.BufferAttribute(uv,2));g.setIndex(idx);g.computeVertexNormals();return g}
window.shot=async(name,v,pxm,only)=>{
  const d=await load(name);const S=new THREE.Scene();S.background=new THREE.Color('#d9d2c0');
  const m=new THREE.Mesh(geo(d,only),mat);m.castShadow=true;m.receiveShadow=true;S.add(m);
  const W=Math.round(v.w*pxm),H=Math.round(v.h*pxm);R.setPixelRatio(1);R.setSize(W,H,false);
  const f=new THREE.Vector3(...v.forward).normalize(),up=new THREE.Vector3(...v.up).normalize(),c=new THREE.Vector3(...v.center);
  const right=new THREE.Vector3().crossVectors(f,up).normalize();
  const cam=new THREE.OrthographicCamera(-v.w/2,v.w/2,v.h/2,-v.h/2,.1,200);cam.up.copy(up);cam.position.copy(c).addScaledVector(f,-60);cam.lookAt(c);
  S.add(new THREE.AmbientLight('#fff',.95));
  const L=new THREE.DirectionalLight('#fff',.8);L.position.copy(c).addScaledVector(f,-40).addScaledVector(up,22).addScaledVector(right,-18);L.target.position.copy(c);S.add(L,L.target);
  L.castShadow=true;L.shadow.mapSize.set(4096,4096);const sc=L.shadow.camera;sc.left=-22;sc.right=22;sc.top=22;sc.bottom=-22;sc.near=1;sc.far=120;L.shadow.bias=-.0004;L.shadow.normalBias=.03;
  R.render(S,cam);return R.domElement.toDataURL('image/png')};
window.__ready=true;
</script>
