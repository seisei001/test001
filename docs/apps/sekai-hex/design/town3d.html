<script type="module">
import * as THREE from 'three';import {GLTFLoader} from './vendor/GLTFLoader.js';import {mergeGeometries} from './vendor/BufferGeometryUtils.js';
const KIT='../assets/kit/';
const NEED=['wall','wall-door','wall-window-small','wall-window-shutters','wall-window-glass','wall-wood','wall-wood-door','wall-wood-window-small','wall-wood-window-shutters','chimney','windmill','tree','tree-high','tree-crooked','tree-high-round','stall-red','stall-green','fountain-round','cart','lantern','rock-small','rock-large','fence'];
const PARTS={};let KMAT=null,SHEET=null;
async function loadKit(){const L=new GLTFLoader();{const t=await new THREE.TextureLoader().loadAsync('../assets/sheets/w_tudor_a.png');t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=8;SHEET=new THREE.MeshBasicMaterial({map:t,side:THREE.DoubleSide})}await Promise.all(NEED.map(async n=>{const g=await L.loadAsync(KIT+n+'.glb');g.scene.updateMatrixWorld(true);const list=[];g.scene.traverse(o=>{if(o.isMesh){if(!KMAT)KMAT=new THREE.MeshLambertMaterial({map:o.material.map});list.push({geo:o.geometry,m:o.matrixWorld.clone()})}});PARTS[n]=list}))}
const hash=(a,b)=>{let h=a*374761393+b*668265263;h=(h^(h>>>13))*1274126177;return((h^(h>>>16))>>>0)/4294967295};
/* ---- 画面 ---- */
const cv=document.getElementById('c'),R=new THREE.WebGLRenderer({canvas:cv,antialias:true,preserveDrawingBuffer:true});R.setPixelRatio(Math.min(devicePixelRatio,2));R.outputColorSpace=THREE.SRGBColorSpace;
const S=new THREE.Scene();S.background=new THREE.Color('#9cc3e6');S.fog=new THREE.Fog('#b9d6ee',400,5200);
const cam=new THREE.PerspectiveCamera(50,1,.3,9000);
function size(){R.setSize(innerWidth,innerHeight,false);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}addEventListener('resize',size);size();
S.add(new THREE.AmbientLight('#fff',1));
/* 地面 */
const gc=document.createElement('canvas');gc.width=gc.height=512;{const g=gc.getContext('2d');g.fillStyle='#6f9a4a';g.fillRect(0,0,512,512);for(let i=0;i<5000;i++){g.fillStyle=`hsla(${85+Math.random()*30},40%,${30+Math.random()*20}%,.35)`;g.fillRect(Math.random()*512,Math.random()*512,3+Math.random()*6,3+Math.random()*6)}}
const gt=new THREE.CanvasTexture(gc);gt.colorSpace=THREE.SRGBColorSpace;gt.wrapS=gt.wrapT=THREE.RepeatWrapping;gt.repeat.set(400,400);gt.anisotropy=8;
const ground=new THREE.Mesh(new THREE.PlaneGeometry(20000,20000).rotateX(-Math.PI/2),new THREE.MeshBasicMaterial({map:gt}));S.add(ground);
/* 遠くの山(円筒) */
{const c=document.createElement('canvas');c.width=2048;c.height=128;const g=c.getContext('2d');for(const [col,amp,off] of [['#9fb7c9',50,70],['#86a0b4',34,100]]){g.fillStyle=col;g.beginPath();g.moveTo(0,128);for(let x=0;x<=2048;x+=8){const h=off-amp*(Math.sin(x*.0061)*.5+Math.sin(x*.017+2)*.3+Math.sin(x*.041)*.2+.5);g.lineTo(x,h)}g.lineTo(2048,128);g.fill()}
 const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;const m=new THREE.Mesh(new THREE.CylinderGeometry(7000,7000,900,48,1,true),new THREE.MeshBasicMaterial({map:t,transparent:true,side:THREE.BackSide,fog:false,depthWrite:false}));m.position.y=420;m.renderOrder=-1;S.add(m)}

/* ---- 街(ローポリ: 部品を組み合わせて作る) ---- */
const TILE=4,N=28,TOWNS=[{name:'ルーベン(西洋)',cu:'w',x:0,z:0},{name:'カガリ(東洋)',cu:'e',x:900,z:-300},{name:'アズール(砂漠)',cu:'d',x:-700,z:-1100}];
const RC=(x,y,w,h)=>({x,y,w,h}),hit=(a,b)=>a.x<b.x+b.w&&b.x<a.x+a.w&&a.y<b.y+b.h&&b.y<a.y+a.h;
const mulM=(a,b)=>a.clone().multiply(b);
function groundPatch(){const c=document.createElement('canvas');c.width=c.height=N*16;const g=c.getContext('2d');
  for(let a=0;a<N;a++)for(let b=0;b<N;b++){const r=hash(a,b);let col=null;
    if(a>=10&&a<18&&b>=10&&b<18)col=`hsl(35,8%,${58+r*10}%)`;else if(a===13||a===14||b===13||b===14)col=`hsl(34,28%,${50+r*8}%)`;else if(a%3===1&&a>1||b%3===1&&b>1)col=`hsl(36,24%,${46+r*8}%)`;
    if(col){g.fillStyle=col;g.fillRect(a*16,b*16,16,16)}}
  const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t}
const patchTex=groundPatch();
/* 部品を置く: 結果は1つの形(1回の描画)にまとめる */
class Builder{constructor(){this.kit=[];this.col={};this.sheet=[]}
  part(name,M){for(const p of PARTS[name]||[]){const g=p.geo.clone();g.applyMatrix4(mulM(M,p.m));this.kit.push(g)}}
  poly(color,P,idx){const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(P,3));if(idx)g.setIndex(idx);const n=g.index?g.toNonIndexed():g;n.computeVertexNormals();(this.col[color]=this.col[color]||[]).push(n)}
  box(color,cx,cy,cz,w,h,d,M){const g=new THREE.BoxGeometry(w,h,d);g.translate(cx,cy+h/2,cz);if(M)g.applyMatrix4(M);const n=g.toNonIndexed();n.deleteAttribute('uv');(this.col[color]=this.col[color]||[]).push(n)}
  cyl(color,cx,cy,cz,r,h,seg,M,top=r){const g=new THREE.CylinderGeometry(top,r,h,seg);g.translate(cx,cy+h/2,cz);if(M)g.applyMatrix4(M);const n=g.toNonIndexed();n.deleteAttribute('uv');(this.col[color]=this.col[color]||[]).push(n)}
  sheetHouse(M){const g=sheetGeo().clone();g.applyMatrix4(M);this.sheet.push(g)}
  build(){const grp=new THREE.Group();
    if(this.sheet.length){const m=new THREE.Mesh(mergeGeometries(this.sheet),SHEET);m.userData.own=1;m.userData.nodispose=1;grp.add(m)}
    const clean=g=>{const n=g.index?g.toNonIndexed():g;for(const k of Object.keys(n.attributes))if(!['position','normal','uv'].includes(k))n.deleteAttribute(k);return n};
    if(this.kit.length){const m=new THREE.Mesh(mergeGeometries(this.kit.map(clean)),KMAT);m.userData.own=1;grp.add(m)}
    for(const c in this.col){const gs=this.col[c].map(g=>{const n=g.index?g.toNonIndexed():g;for(const k of Object.keys(n.attributes))if(!['position','normal'].includes(k))n.deleteAttribute(k);return n});
      const m=new THREE.Mesh(mergeGeometries(gs),new THREE.MeshLambertMaterial({color:c,side:THREE.DoubleSide}));m.userData.own=1;grp.add(m)}
    return grp}}
const TR=(x,y,z,ry=0,s=1)=>new THREE.Matrix4().compose(new THREE.Vector3(x,y,z),new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,1,0),ry),new THREE.Vector3(s,s,s));
const ROOFC={w:['#c4473f','#3f9a82','#6c7088'],e:['#4a4e5c','#3d4150','#5a4a44'],d:['#cf8a58','#c17b4c','#d79a68']};
const STONE='#a9aed3',WOOD='#a2623f';
function gableRoof(B,col,Lx,Lz,H,o,rh){ /* 切妻屋根(棟は長い方向) */
  const alongX=Lx>=Lz,a=(alongX?Lx:Lz)/2+o,b=(alongX?Lz:Lx)/2+o,ey=H-.18,ry=H+rh;
  const V=(u,y,v)=>alongX?[u,y,v]:[v,y,u];
  const P=[...V(-a,ey,-b),...V(a,ey,-b),...V(a,ry,0),...V(-a,ey,-b),...V(a,ry,0),...V(-a,ry,0),
           ...V(-a,ey,b),...V(a,ry,0),...V(a,ey,b),...V(-a,ey,b),...V(-a,ry,0),...V(a,ry,0)];
  B.poly(col,P);
  /* 妻壁(三角) */
  const hl=(alongX?Lx:Lz)/2,hb=(alongX?Lz:Lx)/2;
  for(const sgn of [-1,1]){const u=sgn*(hl-.02);B.poly(STONE,[...V(u,H,-hb),...V(u,H,hb),...V(u,ry-.1,0)])}}

/* ---- 展開図(正面・側面・背面)の絵を、箱の各面にそのまま貼る ---- */
let _sg=null;
function sheetGeo(){if(_sg)return _sg;const P=[],U=[],IW=1254;
  const uv=(x,y)=>[x/IW,1-y/IW];
  const quad=(A,B,C,D,r)=>{const [x0,y0,x1,y1]=r,q=[uv(x0,y1),uv(x1,y1),uv(x1,y0),uv(x0,y0)];for(const i of [0,1,2,0,2,3]){P.push(...[A,B,C,D][i]);U.push(...q[i])}};
  const tri=(A,B,C,a,b,c)=>{P.push(...A,...B,...C);U.push(...uv(...a),...uv(...b),...uv(...c))};
  const W=7.7,D=5.9,Hw=5.25,rh=3.85,X=4.1,o=.55,w=W/2,d=D/2;
  quad([-w,0,d],[w,0,d],[w,Hw,d],[-w,Hw,d],[53,293,383,521]);          /* +z: 正面(扉あり) */
  quad([w,0,-d],[-w,0,-d],[-w,Hw,-d],[w,Hw,-d],[878,297,1208,521]);     /* -z: 背面 */
  quad([w,0,d],[w,0,-d],[w,Hw,-d],[w,Hw,d],[503,296,752,521]);          /* +x 側面 */
  tri([w,Hw,d],[w,Hw,-d],[w,Hw+rh,0],[510,290],[746,290],[627,150]);
  quad([-w,0,-d],[-w,0,d],[-w,Hw,d],[-w,Hw,-d],[82,915,340,1134]);      /* -x 側面 */
  tri([-w,Hw,-d],[-w,Hw,d],[-w,Hw+rh,0],[92,909],[330,909],[213,765]);
  quad([-X,Hw-.25,d+o],[X,Hw-.25,d+o],[X,Hw+rh,0],[-X,Hw+rh,0],[884,150,1202,288]);   /* 屋根 */
  quad([X,Hw-.25,-d-o],[-X,Hw-.25,-d-o],[-X,Hw+rh,0],[X,Hw+rh,0],[884,150,1202,288]);
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(P,3));g.setAttribute('uv',new THREE.Float32BufferAttribute(U,2));g.computeVertexNormals();_sg=g;return g}
function house(B,cu,cx,cz,rng,seedI){
  if(cu==='w'&&rng()<.55){B.sheetHouse(TR(cx,0,cz,Math.atan2(-cx,-cz)+(rng()<.5?0:0),.84));return}
  const s=2.6,cw=2+(rng()<.4?1:0),cd=2+(rng()<.4?1:0),fl=cu==='d'?1+(rng()<.5?1:0):1+(rng()<.45?1:0),pre=cu==='e'?'wall-wood':'wall';
  const dx=-cx,dz=-cz,side=Math.abs(dx)>Math.abs(dz)?(dx>0?'+x':'-x'):(dz>0?'+z':'-z');
  const rot={'+x':0,'-x':Math.PI,'+z':-Math.PI/2,'-z':Math.PI/2};
  const edges=[['+x',cd,0],['-x',cd,0],['+z',cw,0],['-z',cw,0]];
  for(let f=0;f<fl;f++)for(const [sd,n] of edges)for(let k=0;k<n;k++){
    let nm=pre,doorHere=(f===0&&sd===side&&k===Math.floor((n-1)/2));
    if(doorHere)nm=pre+'-door';else if(rng()<.55)nm=pre+(rng()<.5?'-window-small':'-window-shutters');
    /* セル中心 */
    let px,pz;if(sd==='+x'||sd==='-x'){px=0;pz=(k-(n-1)/2)*s}else{pz=0;px=(k-(n-1)/2)*s}
    const ex=sd==='+x'?cw*s/2-s/2:sd==='-x'?-cw*s/2+s/2:0,ez=sd==='+z'?cd*s/2-s/2:sd==='-z'?-cd*s/2+s/2:0;
    B.part(nm,TR(cx+px+ex,f*s,cz+pz+ez,rot[sd],s))}
  const H=fl*s,Lx=cw*s,Lz=cd*s,col=ROOFC[cu][Math.floor(rng()*3)];
  if(cu==='d'){B.box(col,cx,H,cz,Lx+.5,.35,Lz+.5);B.box(STONE,cx,H+.35,cz,Lx+.5,.25,Lz+.5)}
  else{const o=cu==='e'?.8:.45,rh=Math.min(Lx,Lz)*(cu==='e'?.42:.5);
    const M=TR(cx,0,cz);const base=B.col;const tmp=new Builder();gableRoof(tmp,col,Lx,Lz,H,o,rh);
    for(const c in tmp.col)for(const g of tmp.col[c]){g.translate(cx,0,cz);(B.col[c]=B.col[c]||[]).push(g)}
    if(cu==='w'&&rng()<.7)B.part('chimney',TR(cx+(Lx>=Lz?Lx*.22:0),H+rh*.45,cz+(Lx>=Lz?0:Lz*.22),0,2.2))}
}
function castle(B,cx,cz){const w=21,t=1.4,hh=6;
  for(const [x,z,lx,lz] of [[0,-w/2,w,t],[0,w/2,w,t],[-w/2,0,t,w],[w/2,0,t,w]])B.box('#b9bdd6',cx+x,0,cz+z,lx,hh,lz);
  for(const [x,z] of [[-1,-1],[1,-1],[-1,1],[1,1]]){B.cyl('#aeb2cf',cx+x*w/2,0,cz+z*w/2,2.6,10,14);B.cyl('#c4473f',cx+x*w/2,10,cz+z*w/2,3.1,4.2,14,null,.05)}
  B.box('#b9bdd6',cx,0,cz,8,12,8);B.cyl('#3b4a8c',cx,12,cz,6.2,4.5,4,TR(cx,0,cz,Math.PI/4).multiply(new THREE.Matrix4()).clone().multiply(new THREE.Matrix4().makeTranslation(-cx,0,-cz)),.05)}
function church(B,cx,cz,rng){B.box('#d7ccb4',cx,0,cz,6,5,11);gableRoof(B,'#c4473f',6,11,5,.5,3.2);const t=new Builder();gableRoof(t,'#c4473f',6,11,5,.5,3.2);
  B.box('#d7ccb4',cx,0,cz-6.5,3.4,14,3.4);B.cyl('#3b4a8c',cx,14,cz-6.5,2.6,6,4,TR(0,0,0),.05)}
function plan(cu,idx){const rng=(()=>{let st=idx*7919+17;return()=>{st=(st*16807)%2147483647;return st/2147483647}})();
  const res=[RC(2,2,6,6),RC(16,4,3,3),RC(23,3,2,2),RC(10,10,8,8)],xs=[2,5,8,11,15,18,21,24],half=N*TILE/2,B=new Builder();
  for(const gx of xs)for(const gy of xs){const r=RC(gx,gy,2,2);if(res.some(q=>hit(r,q))||hash(gx,gy)>.8)continue;
    house(B,cu,(gx+1)*TILE-half,(gy+1)*TILE-half,rng)}
  castle(B,5*TILE-half,5*TILE-half);church(B,17.5*TILE-half,5.5*TILE-half,rng);B.part('windmill',TR(24*TILE-half,5.6,4*TILE-half,.6,3.2));
  B.part('fountain-round',TR(0,0,0,0,4));B.part('stall-red',TR(-9,0,6,.3,3));B.part('stall-green',TR(9,0,-6,2.6,3));B.part('cart',TR(6,0,9,1,2.5));
  for(let i=0;i<46;i++){const a=rng()*6.283,d=34+rng()*50,x=Math.cos(a)*d,z=Math.sin(a)*d;if(Math.abs(x)>half||Math.abs(z)>half)continue;
    B.part(['tree','tree-high','tree-crooked','tree-high-round'][Math.floor(rng()*4)],TR(x,0,z,rng()*6.28,3+rng()*2))}
  return B}
function buildTown(T){const i=TOWNS.indexOf(T),grp=new THREE.Group();grp.position.set(T.x,0,T.z);
  const pl=new THREE.Mesh(new THREE.PlaneGeometry(N*TILE,N*TILE).rotateX(-Math.PI/2),new THREE.MeshBasicMaterial({map:patchTex,transparent:true}));pl.position.y=.05;pl.userData.own=1;grp.add(pl);
  grp.add(plan(T.cu,i+1).build());return grp}
function disposeTown(grp){grp.traverse(o=>{if(o.userData.own){o.geometry.dispose();if(!o.userData.nodispose&&o.material.dispose)o.material.dispose()}})}
let CASTLE_TX=null;
/* 遠くから見たときの町の印 */
const dotTex=(()=>{const c=document.createElement('canvas');c.width=c.height=64;const g=c.getContext('2d');g.fillStyle='#b9bdd6';g.fillRect(14,26,36,30);g.fillStyle='#c4473f';g.beginPath();g.moveTo(10,28);g.lineTo(32,6);g.lineTo(54,28);g.fill();return new THREE.CanvasTexture(c)})();
const icons=TOWNS.map(T=>{const s=new THREE.Sprite(new THREE.SpriteMaterial({map:dotTex,transparent:true,fog:false,depthWrite:false}));s.center.set(.5,0);s.position.set(T.x,0,T.z);S.add(s);return s});
TOWNS.forEach(T=>{T.grp=null});

/* ---- 視点: 層スライダー 0(兵の目)→1(戦域) ---- */
let L=0,Lt=0,az=0,cur=TOWNS[0],built=0;
const lerp=(a,b,t)=>a+(b-a)*t;
function camFor(l){ /* 距離は指数、仰角は連続 */
  const dist=Math.exp(lerp(Math.log(62),Math.log(3000),Math.pow(l,1.6))),elev=lerp(.035,1.5,Math.pow(l,.7));return{dist,elev}}
function layerName(l){return l<.12?'第6層 兵の目':l<.45?'第5層 隊':l<.78?'第4層 戦場':l<.97?'第3層 戦域':'第2層 地方'}
const st=document.getElementById('st'),sl=document.getElementById('sl');
sl.oninput=()=>{Lt=sl.value/1000};
document.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{Lt=+b.dataset.l;sl.value=Lt*1000});
let dr=null;cv.onpointerdown=e=>{dr=[e.clientX,az];cv.setPointerCapture(e.pointerId)};cv.onpointermove=e=>{if(dr)az=dr[1]-(e.clientX-dr[0])*.006};cv.onpointerup=()=>dr=null;
let msg='';
function frame(){requestAnimationFrame(frame);
  L+=(Lt-L)*.08;const {dist,elev}=camFor(L),ty=lerp(1.7,0,Math.min(1,L*3));
  const tgt=new THREE.Vector3(cur.x,ty,cur.z+(L<.12?0:0));
  cam.position.set(tgt.x+Math.sin(az)*Math.cos(elev)*dist,Math.max(1.7,ty+Math.sin(elev)*dist),tgt.z+Math.cos(az)*Math.cos(elev)*dist);cam.lookAt(tgt.x,L<.1?4:0,tgt.z);
  /* 近づいたら作る・離れたら捨てる */
  TOWNS.forEach((T,i)=>{const d=Math.hypot(cam.position.x-T.x,cam.position.z-T.z);
    if(!T.grp&&d<260){const t0=performance.now();T.grp=buildTown(T);S.add(T.grp);msg=T.name+'を作った '+Math.round(performance.now()-t0)+'ms';icons[i].visible=false}
    else if(T.grp&&d>340){S.remove(T.grp);disposeTown(T.grp);T.grp=null;msg=T.name+'を捨てた';icons[i].visible=true}
    if(icons[i].visible){const k=Math.max(40,d*.035);icons[i].scale.set(k,k*1.06,1)}});
  const dd=Math.hypot(cam.position.x-cur.x,cam.position.z-cur.z);
  st.innerHTML='<b>'+layerName(L)+'</b><br>高さ '+Math.round(cam.position.y)+' m ／ 町まで '+Math.round(dd)+' m<br>町: '+TOWNS.map(T=>T.grp?'●':'○').join(' ')+'<br>'+msg;
  R.render(S,cam)}
(async()=>{await loadKit();window.__ready=1;frame()})();
window.__setL=v=>{Lt=v;L=v};window.__az=v=>az=v;
</script></html>
