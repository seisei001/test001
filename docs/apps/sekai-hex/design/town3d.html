<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>近づくと街ができる</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#9cc3e6;font:14px system-ui,sans-serif;color:#fff;touch-action:none}canvas{display:block;width:100vw;height:100vh}
.b{background:#0009;color:#fff;border:0;border-radius:18px;padding:8px 14px;font-size:14px;text-decoration:none}.b.on{background:#c8742a}
#top{position:fixed;left:10px;top:10px;display:flex;gap:6px;flex-wrap:wrap}#st{position:fixed;right:10px;top:10px;background:#0009;border-radius:12px;padding:8px 12px;line-height:1.6;min-width:170px}
#bot{position:fixed;left:10px;right:10px;bottom:10px;display:flex;gap:10px;align-items:center;background:#0008;border-radius:14px;padding:8px 12px}#bot input{flex:1}</style>
<canvas id=c></canvas>
<div id=top><a class=b href="index.html">←設計</a><button class=b data-l=0>第6層 兵</button><button class=b data-l=.3>第5層 隊</button><button class=b data-l=.62>第4層 戦場</button><button class=b data-l=.9>第3層 戦域</button></div>
<div id=st></div>
<div id=bot><span>近い</span><input id=sl type=range min=0 max=1000 value=0><span>遠い</span></div>
<script type="importmap">{"imports":{"three":"./vendor/three.module.min.js"}}</script>
<script type="module">
import * as THREE from 'three';
const A='../assets/',CUL={
 w:[...[1,2,3,4,5,6,7,8].map(i=>'town2/d0g_'+i),...[1,2,3,4,5,6,7,8].map(i=>'town2/d1m_'+i),'town3/hansa','town3/m_tudor'],
 e:['town3/machiya','town3/cn_a','town3/cn_b','town2/d4e_3','town2/d4e_4','town2/d4e_5','town2/d4e_6','town2/d4e_1'],
 d:['town3/medina','town3/inca','town3/kraal','town3/greek','town3/roman','town2/d3a_4','town2/d3a_5','town2/d3a_6']};
const FIX=['struct_hi/castle_a','town/church','town/shop_blue','town/windmill','wall/watchtower'];
const IM={},TX={};
function trim(img){const c=document.createElement('canvas');c.width=img.width;c.height=img.height;const g=c.getContext('2d');g.drawImage(img,0,0);
 const d=g.getImageData(0,0,c.width,c.height).data;let x0=1e9,y0=1e9,x1=-1,y1=-1;for(let y=0;y<c.height;y++)for(let x=0;x<c.width;x++)if(d[(y*c.width+x)*4+3]>20){if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y}
 const o=document.createElement('canvas');const s=Math.min(1,512/Math.max(x1-x0+1,y1-y0+1));o.width=Math.round((x1-x0+1)*s);o.height=Math.round((y1-y0+1)*s);o.getContext('2d').drawImage(c,x0,y0,x1-x0+1,y1-y0+1,0,0,o.width,o.height);return o}
const load=n=>new Promise(r=>{const i=new Image();i.onload=()=>{IM[n]=trim(i);const t=new THREE.CanvasTexture(IM[n]);t.colorSpace=THREE.SRGBColorSpace;TX[n]=t;r()};i.onerror=()=>r();i.src=A+n+'.png'});
const hash=(a,b)=>{let h=a*374761393+b*668265263;h=(h^(h>>>13))*1274126177;return((h^(h>>>16))>>>0)/4294967295};

/* ---- 画面 ---- */
const cv=document.getElementById('c'),R=new THREE.WebGLRenderer({canvas:cv,antialias:true,preserveDrawingBuffer:true});R.setPixelRatio(Math.min(devicePixelRatio,2));R.outputColorSpace=THREE.SRGBColorSpace;
const S=new THREE.Scene();S.background=new THREE.Color('#9cc3e6');S.fog=new THREE.Fog('#b9d6ee',400,5200);
const cam=new THREE.PerspectiveCamera(50,1,.3,9000);
function size(){R.setSize(innerWidth,innerHeight,false);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}addEventListener('resize',size);size();
S.add(new THREE.AmbientLight('#fff',1));
/* 地面 */
const gc=document.createElement('canvas');gc.width=gc.height=512;{const g=gc.getContext('2d');g.fillStyle='#6f9a4a';g.fillRect(0,0,512,512);for(let i=0;i<5000;i++){g.fillStyle=`hsla(${85+Math.random()*30},40%,${30+Math.random()*20}%,.35)`;g.fillRect(Math.random()*512,Math.random()*512,3+Math.random()*6,3+Math.random()*6)}}
const gt=new THREE.CanvasTexture(gc);gt.colorSpace=THREE.SRGBColorSpace;gt.wrapS=gt.wrapT=THREE.RepeatWrapping;gt.repeat.set(400,400);gt.anisotropy=8;
const ground=new THREE.Mesh(new THREE.PlaneGeometry(20000,20000).rotateX(-Math.PI/2),new THREE.MeshBasicMaterial({map:gt}));S.add(ground);
/* 遠くの山(円筒) */
{const c=document.createElement('canvas');c.width=2048;c.height=128;const g=c.getContext('2d');for(const [col,amp,off] of [['#9fb7c9',50,70],['#86a0b4',34,100]]){g.fillStyle=col;g.beginPath();g.moveTo(0,128);for(let x=0;x<=2048;x+=8){const h=off-amp*(Math.sin(x*.0061)*.5+Math.sin(x*.017+2)*.3+Math.sin(x*.041)*.2+.5);g.lineTo(x,h)}g.lineTo(2048,128);g.fill()}
 const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;const m=new THREE.Mesh(new THREE.CylinderGeometry(7000,7000,900,48,1,true),new THREE.MeshBasicMaterial({map:t,transparent:true,side:THREE.BackSide,fog:false,depthWrite:false}));m.position.y=420;m.renderOrder=-1;S.add(m)}

/* ---- 街 ---- */
const TILE=4,N=28,TOWNS=[{name:'ルーベン(西洋)',cu:'w',x:0,z:0},{name:'カガリ(東洋)',cu:'e',x:900,z:-300},{name:'アズール(砂漠)',cu:'d',x:-700,z:-1100}];
const shadowTex=(()=>{const c=document.createElement('canvas');c.width=c.height=64;const g=c.getContext('2d'),r=g.createRadialGradient(32,32,2,32,32,32);r.addColorStop(0,'rgba(0,0,0,.45)');r.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=r;g.fillRect(0,0,64,64);return new THREE.CanvasTexture(c)})();
const RC=(x,y,w,h)=>({x,y,w,h}),hit=(a,b)=>a.x<b.x+b.w&&b.x<a.x+a.w&&a.y<b.y+b.h&&b.y<a.y+a.h;
function plan(cu){ /* 見取り図 */
  const ents=[],res=[RC(2,2,6,6),RC(16,4,3,3),RC(23,3,2,2),RC(10,10,8,8)],xs=[2,5,8,11,15,18,21,24];
  for(const gx of xs)for(const gy of xs){const r=RC(gx,gy,2,2);if(res.some(q=>hit(r,q))||hash(gx,gy)>.8)continue;
    const near=Math.abs(gx-13.5)<5&&Math.abs(gy-13.5)<5,L=CUL[cu];
    ents.push({n:(cu==='w'&&near&&hash(gy,gx)<.4)?'town/shop_blue':L[Math.floor(hash(gx*7,gy*3)*L.length)],gx,gy,w:2,h:2})}
  ents.push({n:'struct_hi/castle_a',gx:2,gy:2,w:6,h:6},{n:'town/church',gx:16,gy:4,w:3,h:3},{n:'town/windmill',gx:23,gy:3,w:2,h:2,k:.85},{n:'wall/watchtower',gx:26,gy:1,w:1,h:1,k:.5},{n:'wall/watchtower',gx:1,gy:26,w:1,h:1,k:.5});
  return ents}
function groundPatch(){const c=document.createElement('canvas');c.width=c.height=N*16;const g=c.getContext('2d');
  for(let a=0;a<N;a++)for(let b=0;b<N;b++){const r=hash(a,b);let col=null;
    if(a>=10&&a<18&&b>=10&&b<18)col=`hsl(35,8%,${58+r*10}%)`;else if(a===13||a===14||b===13||b===14)col=`hsl(34,28%,${50+r*8}%)`;else if(a%3===1&&a>1||b%3===1&&b>1)col=`hsl(36,24%,${46+r*8}%)`;
    if(col){g.fillStyle=col;g.fillRect(a*16,b*16,16,16)}}
  const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t}
const patchTex=groundPatch();
function buildTown(T){const grp=new THREE.Group();grp.position.set(T.x,0,T.z);const half=N*TILE/2;
  const pl=new THREE.Mesh(new THREE.PlaneGeometry(N*TILE,N*TILE).rotateX(-Math.PI/2),new THREE.MeshBasicMaterial({map:patchTex,transparent:true}));pl.position.y=.05;grp.add(pl);
  const list=plan(T.cu);
  for(const e of list){const tx=TX[e.n];if(!tx)continue;const im=IM[e.n],cx=(e.gx+e.w/2)*TILE-half,cz=(e.gy+e.h/2)*TILE-half;
    const wd=Math.max(e.w,e.h)*TILE*1.414*.9*(e.k||1),hh=wd*im.height/im.width;
    const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:tx,transparent:true,alphaTest:.05}));sp.center.set(.5,.02);sp.scale.set(wd,hh,1);sp.position.set(cx,0,cz);grp.add(sp);
    const sh=new THREE.Mesh(new THREE.PlaneGeometry(wd*.9,wd*.55).rotateX(-Math.PI/2),new THREE.MeshBasicMaterial({map:shadowTex,transparent:true,depthWrite:false}));sh.position.set(cx,.08,cz);grp.add(sh)}
  return grp}
function disposeTown(grp){grp.traverse(o=>{if(o.isMesh&&o.geometry!==undefined&&!o.material.map?.isTown){o.geometry.dispose&&o.geometry.dispose()}if(o.material&&o.material!==undefined){o.material.dispose&&o.material.dispose()}})}
/* 遠くから見たときの町の印 */
const icons=TOWNS.map(T=>{const s=new THREE.Sprite(new THREE.SpriteMaterial({map:TX['struct_hi/castle_a'],transparent:true,fog:false,depthWrite:false}));s.center.set(.5,0);s.position.set(T.x,0,T.z);S.add(s);return s});
TOWNS.forEach(T=>{T.grp=null});

/* ---- 視点: 層スライダー 0(兵の目)→1(戦域) ---- */
let L=0,Lt=0,az=.55,cur=TOWNS[0],built=0;
const lerp=(a,b,t)=>a+(b-a)*t;
function camFor(l){ /* 距離は指数、仰角は連続 */
  const dist=Math.exp(lerp(Math.log(62),Math.log(3000),Math.pow(l,1.6))),elev=lerp(.035,1.5,Math.pow(l,.7));return{dist,elev}}
function layerName(l){return l<.12?'第6層 兵の目':l<.45?'第5層 隊':l<.78?'第4層 戦場':l<.97?'第3層 戦域':'第2層 地方'}
const st=document.getElementById('st'),sl=document.getElementById('sl');
sl.oninput=()=>{Lt=sl.value/1000};
document.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{Lt=+b.dataset.l;sl.value=Lt*1000});
let dr=null;cv.onpointerdown=e=>{dr=[e.clientX,az];cv.setPointerCapture(e.pointerId)};cv.onpointermove=e=>{if(dr)az=dr[1]-(e.clientX-dr[0])*.006};cv.onpointerup=()=>dr=null;
let msg='';
function frame(){requestAnimationFrame(frame);
  L+=(Lt-L)*.08;const {dist,elev}=camFor(L),ty=lerp(1.7,0,Math.min(1,L*3));
  const tgt=new THREE.Vector3(cur.x,ty,cur.z+(L<.12?0:0));
  cam.position.set(tgt.x+Math.sin(az)*Math.cos(elev)*dist,Math.max(1.7,ty+Math.sin(elev)*dist),tgt.z+Math.cos(az)*Math.cos(elev)*dist);cam.lookAt(tgt.x,L<.1?4:0,tgt.z);
  /* 近づいたら作る・離れたら捨てる */
  TOWNS.forEach((T,i)=>{const d=Math.hypot(cam.position.x-T.x,cam.position.z-T.z);
    if(!T.grp&&d<260){const t0=performance.now();T.grp=buildTown(T);S.add(T.grp);msg=T.name+'を作った '+Math.round(performance.now()-t0)+'ms';icons[i].visible=false}
    else if(T.grp&&d>340){S.remove(T.grp);disposeTown(T.grp);T.grp=null;msg=T.name+'を捨てた';icons[i].visible=true}
    if(icons[i].visible){const k=Math.max(40,d*.035);icons[i].scale.set(k,k*1.06,1)}});
  const dd=Math.hypot(cam.position.x-cur.x,cam.position.z-cur.z);
  st.innerHTML='<b>'+layerName(L)+'</b><br>高さ '+Math.round(cam.position.y)+' m ／ 町まで '+Math.round(dd)+' m<br>町: '+TOWNS.map(T=>T.grp?'●':'○').join(' ')+'<br>'+msg;
  R.render(S,cam)}
(async()=>{await Promise.all([...new Set([...FIX,...Object.values(CUL).flat()])].map(load));icons.forEach(s=>s.material.map=TX['struct_hi/castle_a']);window.__ready=1;frame()})();
window.__setL=v=>{Lt=v;L=v};window.__az=v=>az=v;
</script></html>
