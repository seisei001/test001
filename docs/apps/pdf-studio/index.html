<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="PDFスタジオ">
<title>PDFスタジオ</title>
<style>
:root{color-scheme:light dark;--bg:#f7f7f8;--panel-bg:#fff;--border:#dcdce0;--text:#1c1c1f;--muted:#6b6b73;--accent:#2563eb;--accent-hover:#1d4ed8;--danger:#dc2626;--sheet:#fff;--tw:170px;--gap:4px;}
@media (prefers-color-scheme: dark){:root{--bg:#17181c;--panel-bg:#1f2024;--border:#303136;--text:#eaeaec;--muted:#9a9aa3;--sheet:#2a2b30;}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;margin:0;}
html{-webkit-text-size-adjust:100%;}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic",sans-serif;background:var(--bg);color:var(--text);overflow:hidden;}
button{border:none;border-radius:8px;padding:8px 14px;min-height:44px;font-size:.9rem;cursor:pointer;background:var(--accent);color:#fff;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-family:inherit;}
button:hover{background:var(--accent-hover);}
button.sub{background:transparent;color:var(--accent);border:1px solid var(--accent);}
button.danger{background:transparent;color:var(--danger);border:1px solid var(--danger);}
button:disabled{opacity:.4;cursor:default;}
.hidden{display:none!important;}
.ver{font-size:.72rem;font-weight:600;color:var(--muted);margin-left:8px;border:1px solid var(--border);border-radius:999px;padding:1px 8px;vertical-align:middle;}
/* 起動画面 */
#splash{position:fixed;inset:0;z-index:5000;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#1e3a8a,#2563eb);color:#fff;transition:opacity .35s;cursor:pointer;}
#splash.out{opacity:0;pointer-events:none;}
.sp-box{text-align:center;padding:24px;}
.sp-icon{font-size:64px;line-height:1;}
.sp-name{font-size:1.8rem;font-weight:700;margin-top:12px;}
.sp-name .ver{color:#dbeafe;border-color:rgba(255,255,255,.5);}
.sp-sub{margin-top:6px;font-size:1rem;opacity:.9;}
/* アプリ全体 */
#app{display:flex;flex-direction:column;height:100%;}
.formhead{display:flex;align-items:center;gap:8px;padding:10px 16px 4px;}
.formhead h1{margin:0;font-size:1.25rem;}
.back-link{color:var(--muted);text-decoration:none;font-size:.85rem;margin-left:auto;}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:6px 16px 8px;border-bottom:1px solid var(--border);}
.toolbar .grp{display:flex;gap:6px;align-items:center;}
.toolbar label{font-size:.8rem;color:var(--muted);display:flex;align-items:center;gap:6px;}
.toolbar input[type=range]{width:110px;min-height:44px;}
#cnt{font-size:.85rem;color:var(--muted);}
#deskWrap{flex:1;overflow-y:scroll;overflow-x:hidden;padding:14px 12px 40px;position:relative;scrollbar-gutter:stable;}
#deskWrap::-webkit-scrollbar{width:16px;}
#deskWrap::-webkit-scrollbar-track{background:var(--bg);border-left:1px solid var(--border);}
#deskWrap::-webkit-scrollbar-thumb{background:var(--muted);border-radius:8px;border:3px solid var(--bg);}
#desk{display:flex;flex-wrap:wrap;gap:14px 10px;align-items:flex-start;align-content:flex-start;min-height:100%;}
#empty{color:var(--muted);text-align:center;padding:60px 16px;font-size:.95rem;line-height:1.8;}
#status{font-size:.8rem;color:var(--muted);padding:4px 16px;min-height:1.6em;border-top:1px solid var(--border);}
/* 束(オブジェクト) */
.card{position:relative;width:calc(var(--tw) + var(--gap) * 10 + 12px);padding:6px 6px 8px;border:2px solid transparent;border-radius:10px;text-align:center;user-select:none;-webkit-user-select:none;touch-action:pan-y;-webkit-touch-callout:none;}
.card.sel{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,transparent);}
.card.dragging{opacity:.35;}
.card.drop-before::before,.card.drop-after::after{content:"";position:absolute;top:4px;bottom:4px;width:5px;border-radius:3px;background:var(--accent);}
.card.drop-before::before{left:-8px;}.card.drop-after::after{right:-8px;}
.chk{position:absolute;top:4px;left:4px;z-index:30;width:34px;height:34px;display:flex;align-items:center;justify-content:center;background:var(--panel-bg);border:1px solid var(--border);border-radius:8px;opacity:.95;}
.chk input{width:22px;height:22px;margin:0;}
.mnb{position:absolute;top:4px;right:4px;z-index:30;width:34px;height:34px;min-height:0;padding:0;display:flex;align-items:center;justify-content:center;background:var(--panel-bg);color:var(--text);border:1px solid var(--border);border-radius:8px;font-size:1.2rem;opacity:.95;}
.card.mv{touch-action:none;cursor:grab;}
.card .mnb{display:none;}.card.mv .mnb{display:flex;}   /* ⋮は、ちょうど1つ選んでいる束にだけ出る */
.stackwrap{padding:0 calc(var(--gap) * 5);display:flex;justify-content:center;}
.stack{position:relative;width:var(--tw);}
.stack canvas{display:block;width:100%;height:auto;position:relative;z-index:10;background:#fff;border:1px solid var(--border);box-shadow:0 1px 4px rgba(0,0,0,.25);}
.layer{position:absolute;inset:0;background:var(--sheet);border:1px solid var(--border);box-shadow:0 1px 2px rgba(0,0,0,.18);}
.nav{display:flex;align-items:center;justify-content:center;gap:4px;margin-top:6px;font-size:.78rem;color:var(--muted);}
.nav button{min-height:34px;min-width:34px;padding:2px 8px;font-size:1rem;}
.nav .pg{min-width:48px;}
.nm{margin-top:4px;font-size:.78rem;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 4px;}
.ghost{position:fixed;z-index:3000;pointer-events:none;opacity:.85;box-shadow:0 8px 24px rgba(0,0,0,.35);border-radius:8px;overflow:hidden;background:#fff;}
/* 画面(フォーム)のモーダル */
.modal{position:fixed;inset:0;z-index:2000;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px;}
.panel{background:var(--panel-bg);border:1px solid var(--border);border-radius:12px;width:min(440px,100%);max-height:100%;overflow:auto;padding:14px 16px 16px;box-shadow:0 10px 40px rgba(0,0,0,.4);}
.panel .formhead{padding:0 0 8px;}
.panel .info{color:var(--muted);font-size:.82rem;margin:0 0 10px;word-break:break-all;}
.menubtns{display:flex;flex-direction:column;gap:8px;}
.menubtns button{justify-content:flex-start;text-align:left;}
.menubtns small{display:block;font-weight:400;opacity:.85;font-size:.74rem;}
#formHost{background:var(--bg);padding:0;align-items:stretch;flex-direction:column;z-index:2500;}
#formHost .formhead{padding:8px 12px;border-bottom:1px solid var(--border);background:var(--panel-bg);}
#formFrame{flex:1;width:100%;border:0;background:var(--bg);}
</style>
</head>
<body>
<div id="splash" title="タップで進む"><div class="sp-box"><div class="sp-icon">📄</div><div class="sp-name">PDFスタジオ<span class="ver" id="spVer">2.0</span></div><div class="sp-sub">PDF編集ソフト</div></div></div>

<div id="app">
  <div class="formhead"><h1 id="fnDesk">束デスク</h1><span class="ver" id="verDesk">2.0</span><a class="back-link" href="../../">← ハブに戻る</a></div>
  <div class="toolbar">
    <div class="grp"><button id="bAdd">＋ PDFを開く</button><input id="fAdd" type="file" accept="application/pdf,.pdf" multiple class="hidden"></div>
    <div class="grp"><button class="sub" id="bAll">全選択</button><button class="sub" id="bNone">全選択解除</button><button id="bMerge" disabled>選択を結合</button><span id="cnt"></span></div>
    <div class="grp"><button class="sub" id="bUndo" disabled>↩ 元に戻す</button></div>
    <div class="grp"><label>サムネイル <input id="rSize" type="range" min="90" max="320" step="10" value="170"></label></div>
  </div>
  <div id="deskWrap"><div id="desk"></div><div id="empty">PDFを開くと、ここに「束」として並びます。<br>複数ページのPDFは、重なった束で表示され、下の「＜ ＞」でページをめくれます。<br>束を1つだけ選ぶと、右上に「⋮」が出て、機能メニューが開きます(マウスはダブルクリックでも)。</div></div>
  <div id="status"></div>
</div>

<div id="menu" class="modal hidden"><div class="panel">
  <div class="formhead"><button class="sub" id="menuBack">← 戻る</button><h1>機能メニュー</h1><span class="ver" id="verMenu">2.01</span></div>
  <p class="info" id="menuInfo"></p>
  <div class="menubtns" id="menuBtns"></div>
  <div style="margin-top:10px;text-align:right"><button class="sub" id="menuClose">← 戻る</button></div>
</div></div>

<div id="formHost" class="modal hidden">
  <div class="formhead"><h1 id="formName"></h1><span class="ver" id="formVer"></span><button class="sub" id="formClose" style="margin-left:auto">✕ 閉じる(保存しない)</button></div>
  <iframe id="formFrame" title="フォーム"></iframe>
</div>

<script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
<script>
"use strict";
// ===== 画面(フォーム)の名前とバージョン。変えたフォームだけ、バージョンを0.01上げる =====
const FORMS={
  splash:{name:"PDFスタジオ",ver:"2.04"},
  desk:{name:"束デスク",ver:"2.06"},
  menu:{name:"機能メニュー",ver:"2.01"},
  edit:{name:"ページ編集",ver:"2.44",src:"forms/editor.html?form=edit"},
  warp:{name:"歪み補正",ver:"2.01",src:"forms/editor.html?form=warp"}
};
const $=id=>document.getElementById(id);
const {PDFDocument}=PDFLib;
pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js";
$("spVer").textContent=FORMS.splash.ver;$("fnDesk").textContent=FORMS.desk.name;$("verDesk").textContent=FORMS.desk.ver;$("verMenu").textContent=FORMS.menu.ver;
const MAXL=5;   // 束の重なり表示の最大枚数(左右それぞれ)

// ===== 起動画面(約1.5秒) =====
{let done=false;const out=()=>{if(done)return;done=true;$("splash").classList.add("out");setTimeout(()=>$("splash").remove(),400);};
 setTimeout(out,1500);$("splash").addEventListener("pointerdown",out);}

// ===== 状態 =====
let bundles=[];          // 表示順。{id,name,bytes,n,cur,sel,doc,card,key}
let undoStack=[];
let nextId=1;
const status=m=>{$("status").textContent=m||"";};
const baseName=n=>n.replace(/\.pdf$/i,"");

// ===== データはこのページを開いている間だけ(ブラウザには残さない。次に開くときは空の状態) =====
function persist(){}
try{indexedDB.deleteDatabase("pdf-studio");}catch{}   // 以前のバージョンがブラウザに残したデータを消す
// 最初は、左上の束が選択されている(1つだけ選んでいるときは、その束をつかんで動かせる)
function defaultSel(){if(bundles.length&&!bundles.some(b=>b.sel))bundles[0].sel=true;}
function mk(name,bytes,n,cur,id,handle,dirty){return{id:id||nextId++,name,bytes,n,cur:Math.max(0,Math.min(n-1,cur||0)),sel:false,doc:null,card:null,key:"",handle:handle||null,dirty:!!dirty};}   // handle=読み込んだ元のファイル(上書き保存用) dirty=変更フラグ

// ===== 元に戻す =====
function snap(){undoStack.push(bundles.map(b=>({id:b.id,name:b.name,bytes:b.bytes,n:b.n,cur:b.cur,handle:b.handle,dirty:b.dirty})));if(undoStack.length>30)undoStack.shift();$("bUndo").disabled=false;}
function undo(){const s=undoStack.pop();if(!s)return;bundles.forEach(b=>{if(b.doc){try{b.doc.destroy();}catch{}}});
  bundles=s.map(r=>mk(r.name,r.bytes,r.n,r.cur,r.id,r.handle,r.dirty));$("bUndo").disabled=!undoStack.length;render();persist();status("元に戻しました。");}

// ===== PDFの読み込み =====
// 画像にしたページに、元のPDFの文字データを「見えない文字」として入れ直す(ページ編集で文字の部品として扱え、OCRしなくてよくなる)
const TXT_FONT_URL="https://cdn.jsdelivr.net/npm/@expo-google-fonts/m-plus-1p@0.4.2/400Regular/MPLUS1p_400Regular.ttf";
function loadFontkit(){
  if(window.fontkit)return Promise.resolve();
  return new Promise((ok,ng)=>{const s=document.createElement("script");s.src="https://cdn.jsdelivr.net/npm/@pdf-lib/fontkit@1.1.1/dist/fontkit.umd.min.js";s.onload=ok;s.onerror=()=>ng(new Error("fontkit"));document.head.appendChild(s);});
}
// 鍵つきPDFの取り込み方を選ぶダイアログ。"edit"=鍵を外して元のPDFのまま編集できるようにする / "image"=画像として取り込む(元の文章は変わらない) / "cancel"
function askLocked(name){return new Promise(res=>{
  const o=document.createElement("div");o.style.cssText="position:fixed;inset:0;z-index:3000;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:16px;";
  o.innerHTML=`<div style="background:var(--panel-bg,#fff);color:var(--text,#000);border-radius:12px;padding:18px;max-width:440px;width:100%;max-height:90vh;overflow:auto;box-shadow:0 8px 30px rgba(0,0,0,.4)">
   <p class="lk-name" style="margin:0 0 10px;font-weight:700"></p>
   <p style="margin:0 0 10px;font-size:.92rem">このPDFには鍵が掛かっています。鍵つきの文書なので、取り扱いに注意してください。</p>
   <label style="display:flex;gap:8px;align-items:flex-start;margin:0 0 14px;font-size:.95rem"><input type="checkbox" id="lkChk" style="width:22px;height:22px;flex:none"><span><b>鍵を外して編集できるようにする</b><br><span style="font-size:.82rem;opacity:.8">文字・フォントは元のまま。保存したファイルには鍵が掛かりません。<br>チェックなし: 画像として取り込みます(文字は編集できません)。</span></span></label>
   <div style="display:flex;gap:8px;flex-wrap:wrap"></div></div>`;
  o.querySelector(".lk-name").textContent="「"+name+"」";
  const box=o.querySelector("div div:last-child"),chk=o.querySelector("#lkChk"),done=v=>{o.remove();res(v);};
  [["取り込む",()=>done(chk.checked?"edit":"image")],["やめる",()=>done("cancel")]].forEach(([t,f],i)=>{const x=document.createElement("button");x.textContent=t;x.style.minHeight="44px";if(i)x.className="sub";x.onclick=f;box.appendChild(x);});
  document.body.appendChild(o);addFit(o);});}
// 鍵を外す(qpdf を WebAssembly にしたもの。Apache-2.0)。閲覧ソフトと同じく、空のパスワードで開けるものは、そのまま外せる。パスワードが要るものは、聞く
const QPDF_BASE="https://cdn.jsdelivr.net/npm/@neslinesli93/qpdf-wasm@0.3.0/dist/";let qpdfP=null;
function loadQpdf(){
  if(qpdfP)return qpdfP;
  qpdfP=new Promise((ok,ng)=>{const s=document.createElement("script");s.src=QPDF_BASE+"qpdf.js";
    s.onload=()=>{const M=window.Module;try{delete window.Module;}catch{window.Module=undefined;}typeof M==="function"?ok(M):ng(new Error("qpdf"));};
    s.onerror=()=>{qpdfP=null;ng(new Error("qpdf"));};document.head.appendChild(s);});
  return qpdfP;
}
async function qpdfDecrypt(bytes,password){
  const M=await loadQpdf(),log=[],q=await M({locateFile:()=>QPDF_BASE+"qpdf.wasm",noInitialRun:true,print:t=>log.push(t),printErr:t=>log.push(t)});
  q.FS.writeFile("/in.pdf",bytes);
  const args=["--decrypt"];if(password)args.push("--password="+password);args.push("/in.pdf","/out.pdf");
  let rc=0;try{rc=q.callMain(args);}catch(e){rc=typeof e==="number"?e:(e&&e.status!=null?e.status:2);}
  let out=null;try{out=q.FS.readFile("/out.pdf");}catch{}
  return{rc,out,needPw:!out&&(rc===2||/password/i.test(log.join("\n")))};   // パスワードが違うときは、メッセージが出ないので、終了コード2も「パスワードが要る」と見なす
}
async function decryptWithPrompt(bytes,name){
  let pw="";
  for(let k=0;k<4;k++){
    const r=await qpdfDecrypt(bytes,pw);
    if(r.out)return new Uint8Array(r.out);
    if(!r.needPw)return null;
    const t=prompt(k?`「${name}」のパスワードが違います。もう一度入力してください`:`「${name}」はパスワードで保護されています。パスワードを入力してください`);
    if(t===null)throw new Error("取り込みをやめました");pw=t;
  }
  return null;
}
async function addInvisibleText(out,pages,textRuns,name){
  const total=textRuns.reduce((a,r)=>a+r.length,0);if(!total)return 0;
  status(`「${name}」の文字データ(${total}個)を残しています…`);
  await loadFontkit();out.registerFontkit(window.fontkit);
  const fb=await (await fetch(TXT_FONT_URL)).arrayBuffer(),font=await out.embedFont(fb,{subset:true});
  const L=PDFLib;let done=0;
  pages.forEach((pg,i)=>{
    pg.setFont(font);const key=pg.fontKey;
    for(const r of textRuns[i]){
      try{
        const nat=font.widthOfTextAtSize(r.str,r.size),nch=Array.from(r.str).length,tc=nch>0?(r.w-nat)/nch:0;   // 元の幅に合わせる(字間で調整)
        pg.pushOperators(L.pushGraphicsState(),L.beginText(),L.setTextRenderingMode(L.TextRenderingMode.Invisible),L.setFontAndSize(key,r.size),L.setCharacterSpacing(tc),L.setTextMatrix(1,0,0,1,r.x,r.y),L.showText(font.encodeText(r.str)),L.endText(),L.popGraphicsState());
        done++;
      }catch(e){}
    }
  });
  return done;
}
// 暗号化されたPDFなど、PDFを編集する部品では開けないものを、各ページの画像にして、新しいPDFにする
async function rasterize(bytes,name,keepText){
  const task=pdfjsLib.getDocument({data:bytes.slice()});
  task.onPassword=(update,reason)=>{   // 開くのにパスワードが必要なPDF
    const pw=prompt(reason===pdfjsLib.PasswordResponses.INCORRECT_PASSWORD?`「${name}」のパスワードが違います。もう一度入力してください`:`「${name}」はパスワードで保護されています。パスワードを入力してください`);
    if(pw===null){task.destroy();return;}update(pw);};
  let doc;try{doc=await task.promise;}catch(e){throw new Error(e&&e.name==="PasswordException"?"パスワードが分からないため、開けません":"このPDFは開けません");}
  const out=await PDFDocument.create(),MAXPX=2400,pagesOut=[],textRuns=[];
  for(let i=1;i<=doc.numPages;i++){
    status(`「${name}」を画像にして読み込み中… ${i} / ${doc.numPages}`);
    const pg=await doc.getPage(i),v1=pg.getViewport({scale:1}),sc=Math.min(2,MAXPX/Math.max(v1.width,v1.height)),vp=pg.getViewport({scale:sc});
    const cv=document.createElement("canvas");cv.width=Math.round(vp.width);cv.height=Math.round(vp.height);
    const cx=cv.getContext("2d");cx.fillStyle="#fff";cx.fillRect(0,0,cv.width,cv.height);
    await pg.render({canvasContext:cx,viewport:vp}).promise;
    const blob=await new Promise(res=>cv.toBlob(res,"image/jpeg",0.88)),img=await out.embedJpg(new Uint8Array(await blob.arrayBuffer()));
    const po=out.addPage([v1.width,v1.height]);po.drawImage(img,{x:0,y:0,width:v1.width,height:v1.height});pagesOut.push(po);
    // 鍵が掛かっていても、PDFの文字データ(フォントの文字)は読める。位置・大きさ・幅を控えて、あとで「見えない文字」として入れる
    const rs=[];try{const tc=await pg.getTextContent();
      for(const it of tc.items){if(!it.str||!it.str.trim())continue;
        const tx=pdfjsLib.Util.transform(v1.transform,it.transform),size=Math.hypot(tx[2],tx[3]);
        if(!size||Math.abs(tx[1])>size*0.02||tx[0]<0)continue;   // 横書きのみ(ページ編集と同じ)
        rs.push({str:it.str,x:tx[4],y:v1.height-tx[5],size,w:it.width*v1.scale});}}catch{}
    textRuns.push(rs);
    cv.width=cv.height=0;pg.cleanup();
  }
  const n=doc.numPages;try{doc.destroy();}catch{}
  let nText=0;
  if(keepText){try{nText=await addInvisibleText(out,pagesOut,textRuns,name);}catch(e){console.warn("文字データを残せませんでした",e);}}
  return{bytes:new Uint8Array(await out.save()),n,nText};
}
async function addFiles(files){
  let added=0,lastNote="";
  for(const it of files){
    const f=it.f||it,fh=it.h||null;
    if(!/\.pdf$/i.test(f.name)&&f.type!=="application/pdf")continue;
    let bytes=new Uint8Array(await f.arrayBuffer());
    try{
      let n,note="";
      try{n=(await PDFDocument.load(bytes,{ignoreEncryption:false})).getPageCount();}
      catch(e){   // 鍵(暗号化)などで、そのままでは編集用に開けないPDF
        const ch=await askLocked(f.name);
        if(ch==="cancel")throw new Error("取り込みをやめました");

// ===== ドラッグで並び替え(マウス: どの束でも / 指: ちょうど1つ選んでいる束の本体をつかむ) =====
let drag=null,lastType="mouse";
function attachDrag(el,b){
  let st=null;
  el.addEventListener("pointerdown",e=>{
    lastType=e.pointerType;
    if(e.button>0||e.target.closest(".chk,.nav,.mnb"))return;
    // 指・ペン: ちょうど1つだけ選んでいる束だけ、本体をつかんで動かせる。マウス: どの束でも動かせる(近道)
    if(e.pointerType!=="mouse"&&!(b.sel&&selCount()===1))return;
    st={x:e.clientX,y:e.clientY,id:e.pointerId};
  });
  el.addEventListener("pointermove",e=>{
    if(!st||e.pointerId!==st.id)return;
    const dx=e.clientX-st.x,dy=e.clientY-st.y,mv=Math.hypot(dx,dy);
    if(!drag&&mv>6)startDrag(el,b,e);
    if(drag&&drag.b===b)moveDrag(e);
  });
  const end=e=>{
    if(!st||(e.pointerId!==undefined&&e.pointerId!==st.id))return;
    const wasDrag=drag&&drag.b===b,moved=Math.hypot(e.clientX-st.x,e.clientY-st.y);
    st=null;
    if(wasDrag){finishDrag(e.type==="pointerup");return;}
  };
  el.addEventListener("pointerup",end);el.addEventListener("pointercancel",end);
  el.addEventListener("dblclick",e=>{if(lastType!=="mouse"||e.target.closest(".chk,.nav,.mnb"))return;if(b.sel&&selCount()===1)openMenu(b);});   // ダブルクリックはマウスだけの近道。ちょうど1つ選んでいる束でだけメニューが開く(指は ⋮ ボタン)
  el.addEventListener("contextmenu",e=>{if(e.pointerType==="touch")e.preventDefault();});
}
function startDrag(el,b,e){
  const r=el.getBoundingClientRect(),cv=el.querySelector("canvas"),g=document.createElement("div");g.className="ghost";
  const c2=document.createElement("canvas");c2.width=cv.width;c2.height=cv.height;c2.getContext("2d").drawImage(cv,0,0);c2.style.cssText=`display:block;width:${Math.min(r.width,tw)}px;height:auto`;g.appendChild(c2);document.body.appendChild(g);
  drag={b,el,g,ox:Math.min(r.width,tw)/2,oy:20,target:null,after:false};el.classList.add("dragging");
  try{el.setPointerCapture(e.pointerId);}catch{}
}
function moveDrag(e){
  const d=drag;d.g.style.left=(e.clientX-d.ox)+"px";d.g.style.top=(e.clientY-d.oy)+"px";
  // 挿入位置: ポインタに最も近い束の、左半分=その前、右半分=その後ろ
  let best=null,bd=1e9;
  for(const c of $("desk").children){if(c===d.el)continue;const r=c.getBoundingClientRect(),cx=Math.max(r.left,Math.min(e.clientX,r.right)),cy=Math.max(r.top,Math.min(e.clientY,r.bottom)),dd=Math.hypot(e.clientX-cx,e.clientY-cy);
    if(dd<bd){bd=dd;best={c,after:e.clientX>(r.left+r.right)/2};}}
  $("desk").querySelectorAll(".drop-before,.drop-after").forEach(x=>x.classList.remove("drop-before","drop-after"));
  d.target=best;if(best)best.c.classList.add(best.after?"drop-after":"drop-before");
  const w=$("deskWrap").getBoundingClientRect();   // 端に近づいたら自動でスクロール
  if(e.clientY<w.top+50)$("deskWrap").scrollTop-=14;else if(e.clientY>w.bottom-50)$("deskWrap").scrollTop+=14;
}
function finishDrag(drop){
  const d=drag;drag=null;d.g.remove();d.el.classList.remove("dragging");
  $("desk").querySelectorAll(".drop-before,.drop-after").forEach(x=>x.classList.remove("drop-before","drop-after"));

async function burst(b){   // 全ページをばらす → 1ページずつのPDF

async function splitAt(b){   // 表示中のページから後ろを、別の束に(表示中のページは後ろの束に入る)

addFit($("menu"));
function sendZoom(){fitAll();try{const fr=$("formFrame"),w=fr.contentWindow,v=window.visualViewport;if(!w)return;
  let vv=null;if(v){const r=fr.getBoundingClientRect();vv={x:v.offsetLeft-r.left,y:v.offsetTop-r.top,w:v.width,h:v.height};}   // いま見えている範囲(フォームの中の座標)。設定の吹き出しを、見えている所に出すため
  w.postMessage({type:"zoom",scale:(v&&v.scale)||1,vv},"*");}catch{}}
// iPhone: 入力・キーボードなどで、画面の拡大や位置が勝手に変わったら(指の操作中・直後ではないとき)、元に戻そうとする。拡大率の戻しは、iPhoneの仕様で効かないこともある
let vvKeep=null,vvTouching=0,vvLastEnd=0,vvTimer=null;
const vvNow=()=>({s:visualViewport.scale,l:visualViewport.pageLeft,t:visualViewport.pageTop});
const formOpen=()=>!$("formHost").classList.contains("hidden");
function vvTryZoom(sc){const m=document.querySelector('meta[name=viewport]');if(!m)return;const orig=m.content;m.content=`width=device-width, initial-scale=${sc}, minimum-scale=${Math.min(sc,1)}, maximum-scale=${sc}`;setTimeout(()=>{m.content=orig;},300);}
function vvRestore(){clearTimeout(vvTimer);vvTimer=setTimeout(()=>{if(!vvKeep||vvTouching>0)return;try{window.scrollTo(vvKeep.l,vvKeep.t);}catch{}if(Math.abs(visualViewport.scale-vvKeep.s)>0.02)vvTryZoom(vvKeep.s);status("画面の拡大・位置が勝手に変わったため、元に戻しました。");},150);}
function vvChange(){
  sendZoom();if(!formOpen()||!("ontouchstart" in window))return;
  const cur=vvNow();
  if(vvTouching>0||Date.now()-vvLastEnd<900||!vvKeep){vvKeep=cur;return;}   // 指の操作中・直後は、自分で拡大・移動したものとして覚える
  if(Math.abs(cur.s-vvKeep.s)>0.02||Math.abs(cur.l-vvKeep.l)>6||Math.abs(cur.t-vvKeep.t)>6)vvRestore();
}
if(window.visualViewport)["resize","scroll"].forEach(n=>visualViewport.addEventListener(n,vvChange));
window.addEventListener("beforeunload",e=>{if(bundles.some(b=>b.dirty)){e.preventDefault();e.returnValue="";}});   // 保存していない変更があるまま閉じようとしたら、ブラウザが確認する
window.addEventListener("message",async e=>{
  const m=e.data;if(!m||typeof m!=="object"||e.source!==$("formFrame").contentWindow)return;
  if(m.type==="ready"&&formB){   // 表示中の1ページだけを、1ページのPDFにして渡す
    const src=await PDFDocument.load(formB.bytes),d=await PDFDocument.create();(await d.copyPages(src,[formB.cur])).forEach(p=>d.addPage(p));
    const bytes=new Uint8Array(await d.save());e.source.postMessage({type:"load",bytes,name:`${baseName(formB.name)}_p${formB.cur+1}.pdf`},"*",[bytes.buffer]);sendZoom();
  }else if(m.type==="result"&&formB){   // 編集した1ページを、束の同じ位置に戻す
    const b=formB,src=await PDFDocument.load(b.bytes),ed=await PDFDocument.load(m.bytes),out=await PDFDocument.create();
    const before=[...Array(b.cur).keys()],after=[...Array(b.n-b.cur-1).keys()].map(i=>i+b.cur+1);
    (await out.copyPages(src,before)).forEach(p=>out.addPage(p));(await out.copyPages(ed,[0])).forEach(p=>out.addPage(p));(await out.copyPages(src,after)).forEach(p=>out.addPage(p));
    snap();b.bytes=new Uint8Array(await out.save());b.ver=(b.ver||0)+1;b.dirty=true;if(b.doc){try{b.doc.destroy();}catch{}b.doc=null;}
    closeForm();render();thumb(b);persist();status("編集したページを、束に戻しました。「元に戻す」で戻せます。");
  }else if(m.type==="pan"){const v=window.visualViewport,b0=v?{l:v.pageLeft,t:v.pageTop,ol:v.offsetLeft,ot:v.offsetTop}:null,sx0=scrollX,sy0=scrollY,src=e.source;
    const now=Date.now();if(!panPos||now-panPos.t>600)panPos={x:scrollX,y:scrollY,t:now};   // 小数の位置を覚えて、端数が切り捨てられないようにする
    panPos.x+=+m.dx||0;panPos.y+=+m.dy||0;panPos.t=now;
    try{window.scrollTo(panPos.x,panPos.y);}catch{}
    setTimeout(()=>{sendZoom();try{src.postMessage({type:"panres",t:`親の画面を動かす依頼: ${(+m.dx).toFixed(1)},${(+m.dy).toFixed(1)}\n親のスクロール位置 ${sx0.toFixed(0)},${sy0.toFixed(0)} → ${scrollX.toFixed(0)},${scrollY.toFixed(0)}\n見える左上 ${b0?`${b0.l.toFixed(0)},${b0.t.toFixed(0)} → ${v.pageLeft.toFixed(0)},${v.pageTop.toFixed(0)}`:"不明"}\n${document.scrollingElement.scrollWidth}x${document.scrollingElement.scrollHeight} (内容の大きさ)`},"*");}catch{}},60);   // 拡大中のドラッグが画面の端に来たとき、ゆっくり画面を動かす
  }else if(m.type==="needzoom"){sendZoom();
  }else if(m.type==="touch"){vvTouching=m.n||0;if(!vvTouching){vvLastEnd=Date.now();setTimeout(sendZoom,60);setTimeout(sendZoom,350);}else if(window.visualViewport)vvKeep=vvNow();   // 指を離したあと(ピンチの終わり)に、拡大率を伝え直す
     // フォームの中の指の数(親は、フォームの中の指の操作を直接見られない)
  }else if(m.type==="close")closeForm();
});

// ===== 起動 =====
render();
window.pdfStudioDebug={bytes:i=>Array.from(bundles[i].bytes),bundles:()=>bundles.map(b=>({id:b.id,name:b.name,n:b.n,cur:b.cur,sel:b.sel})),forms:FORMS};
</script>
</body>
</html>
