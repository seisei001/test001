<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1b1a2b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="連合戦記">
<title>連合戦記</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;800&family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
/* Layout: 全面キャンバスの戦場 + 上にHUD(章・勢力ごとの兵数) + 下に字幕とコントローラ。操作して遊ぶのではなく観戦する作り。 */
:root{
  --bg:#1b1a2b; --ink:#f4efe3; --ink-soft:#c9c2ad; --gold:#f2c14e; --panel:rgba(22,20,36,.78); --line:rgba(255,255,255,.16);
  --f-title:'Shippori Mincho','Hiragino Mincho ProN','Yu Mincho',serif;
  --f-body:'Zen Maru Gothic',system-ui,-apple-system,'Hiragino Maru Gothic ProN','Hiragino Sans',sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--f-body);overflow:hidden;overscroll-behavior:none}
#app{position:fixed;inset:0}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.back{position:absolute;left:calc(8px + env(safe-area-inset-left,0px));top:calc(8px + env(safe-area-inset-top,0px));z-index:5;height:40px;min-width:44px;padding:0 12px;display:flex;align-items:center;justify-content:center;border-radius:20px;background:var(--panel);color:var(--ink);text-decoration:none;font-weight:700;font-size:13px;border:1px solid var(--line)}
#hud{position:absolute;left:calc(8px + env(safe-area-inset-left,0px));right:calc(8px + env(safe-area-inset-right,0px));top:calc(54px + env(safe-area-inset-top,0px));z-index:4;pointer-events:none}
#chap{font-family:var(--f-title);font-weight:800;font-size:15px;letter-spacing:.06em;text-shadow:0 1px 3px #000,0 0 8px #000;margin:0 0 6px 4px}
#chap small{font-family:var(--f-body);font-weight:700;color:var(--gold);margin-right:8px;font-size:12px;letter-spacing:.1em}
#chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{display:flex;align-items:center;gap:5px;padding:3px 9px 3px 7px;border-radius:14px;background:var(--panel);border:1px solid var(--line);font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
.chip i{width:10px;height:10px;border-radius:50%;display:block;box-shadow:0 0 0 1.5px rgba(255,255,255,.55)}
#ctl{position:absolute;left:0;right:0;bottom:0;z-index:5;padding:30px calc(10px + env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) calc(10px + env(safe-area-inset-left,0px));background:linear-gradient(to top,rgba(14,12,26,.92) 55%,rgba(14,12,26,0))}
#sub{min-height:44px;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:700;font-size:15px;line-height:1.45;padding:0 6px 6px;text-shadow:0 1px 3px #000,0 0 10px #000;transition:opacity .35s}
#sub.off{opacity:0}
#seekrow{display:flex;align-items:center;gap:8px;margin-bottom:4px}
#tm{font-size:11px;color:var(--ink-soft);font-variant-numeric:tabular-nums;min-width:74px;text-align:right}
#seek{flex:1;height:30px;accent-color:var(--gold);margin:0}
#btns{display:flex;gap:5px;justify-content:space-between}
.b{flex:1 1 0;min-width:0;white-space:nowrap;height:44px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.1);color:var(--ink);font-family:var(--f-body);font-weight:700;font-size:12px;cursor:pointer;touch-action:manipulation;padding:0 1px}
.b:active{background:rgba(255,255,255,.22)}
.b.on{background:var(--gold);color:#2b2108;border-color:var(--gold)}
.b.big{flex:1.3;font-size:18px}
#card{position:absolute;left:0;right:0;top:34%;z-index:4;text-align:center;pointer-events:none;opacity:0;transition:opacity .8s;font-family:var(--f-title)}
#card.show{opacity:1}
#card .k{font-size:15px;letter-spacing:.5em;color:var(--gold);font-weight:800;text-shadow:0 2px 6px #000}
#card .n{font-size:32px;font-weight:800;letter-spacing:.12em;margin-top:6px;text-shadow:0 2px 10px #000,0 0 22px #000}
#card .l{width:120px;height:2px;margin:10px auto 0;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.ov{position:absolute;inset:0;z-index:9;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;background:radial-gradient(ellipse at 50% 38%,rgba(48,38,78,.88),rgba(10,9,20,.97));}
.ov h1{font-family:var(--f-title);font-size:46px;letter-spacing:.2em;margin:0 0 6px 0.2em;font-weight:800;text-shadow:0 0 24px rgba(242,193,78,.5)}
.ov .tag{color:var(--gold);font-family:var(--f-title);font-weight:600;letter-spacing:.14em;font-size:14px;margin-bottom:22px}
.ov p{max-width:330px;color:var(--ink-soft);font-size:13px;line-height:1.75;margin:0 0 22px}
.go{height:54px;min-width:220px;padding:0 28px;border-radius:27px;border:0;background:linear-gradient(#f7d070,#e0a52d);color:#2b2108;font-family:var(--f-title);font-weight:800;font-size:19px;letter-spacing:.14em;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.45);touch-action:manipulation}
.go.alt{background:rgba(255,255,255,.12);color:var(--ink);border:1px solid var(--line);box-shadow:none;font-size:15px;height:46px;margin-top:10px}
#sheet{background:rgba(10,9,20,.9);justify-content:flex-start;padding-top:calc(60px + env(safe-area-inset-top,0px));overflow:auto}
#sheet h2{font-family:var(--f-title);margin:0 0 14px;letter-spacing:.2em}
.ci{width:100%;max-width:360px;min-height:52px;margin-bottom:8px;text-align:left;padding:8px 14px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.08);color:var(--ink);font-family:var(--f-title);font-size:16px;font-weight:800;cursor:pointer;display:flex;align-items:center;gap:10px}
.ci small{font-family:var(--f-body);color:var(--gold);font-size:12px;min-width:46px}
#load{background:#1b1a2b}
#end h1{font-size:40px}
</style>
</head>
<body>
<div id="app">
  <canvas id="cv"></canvas>
  <a class="back" href="../../">‹ ハブ</a>
  <div id="hud"><div id="chap"></div><div id="chips"></div></div>
  <div id="card"><div class="k"></div><div class="n"></div><div class="l"></div></div>
  <div id="ctl">
    <div id="sub" class="off"></div>
    <div id="seekrow"><input id="seek" type="range" min="0" max="775" step="0.1" value="0" aria-label="時間"><span id="tm">0:00 / 12:55</span></div>
    <div id="btns">
      <button class="b" id="bPrev" aria-label="前の章">⏮</button>
      <button class="b big" id="bPlay" aria-label="再生・一時停止">⏸</button>
      <button class="b" id="bNext" aria-label="次の章">⏭</button>
      <button class="b" id="bSpd">×1</button>
      <button class="b on" id="bCam">🎥自動</button>
      <button class="b" id="bLod">兵:自動</button>
      <button class="b" id="bChap">章</button>
    </div>
  </div>
  <div id="sheet" class="ov" hidden><h2>章をえらぶ</h2><div id="clist" style="width:100%;display:flex;flex-direction:column;align-items:center"></div><button class="go alt" id="bClose">とじる</button></div>
  <div id="title" class="ov" hidden>
    <h1>連合戦記</h1>
    <div class="tag">— 二万の暁軍、三十万の大連合へ —</div>
    <p>操作して遊ぶゲームではなく、<br>ひとつの戦記を「観戦」して楽しむ作品です。<br>ドラッグで移動、ピンチで拡大すると、小さな兵が大きな姿に変わります。章ジャンプ・倍速もできます。</p>
    <button class="go" id="bStart">戦記をはじめる</button>
  </div>
  <div id="end" class="ov" hidden style="background:linear-gradient(rgba(10,9,20,0) 0%,rgba(10,9,20,.35) 50%,rgba(10,9,20,.7) 100%);justify-content:flex-end;padding-bottom:calc(150px + env(safe-area-inset-bottom,0px));pointer-events:none">
    <h1>天下統一</h1>
    <div class="tag">— 完 —</div>
    <button class="go" id="bAgain" style="pointer-events:auto">もう一度みる</button>
    <button class="go alt" id="bEndChap" style="pointer-events:auto">章をえらぶ</button>
  </div>
  <div id="load" class="ov"><div class="tag" style="margin:0">世界地図を描いています…</div></div>
</div>
<script>
'use strict';
/* ============ 基本 ============ */
const WW=1600, WH=2400, T_END=775, T_MAX=800;
const TAU=Math.PI*2;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const sm=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);};
const ramp=(t,a,b)=>clamp((t-a)/(b-a),0,1);
const lerp=(a,b,u)=>a+(b-a)*u;
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function fh(a,b){const s=Math.sin(a*127.1+b*311.7)*43758.5453;return s-Math.floor(s);}
const fmtN=n=>n>=10000?(Math.round(n/1000)/10).toString().replace(/\.0$/,'')+'万':Math.round(n/100)*100>=1000?(Math.round(n/100)*100).toLocaleString('en-US'):String(Math.round(n/100)*100);
const fmtT=s=>{s=Math.max(0,Math.floor(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');};

/* ============ 勢力 ============ */
const FAC={
  aka:{name:'暁軍',col:'#3b82f6',dark:'#1e40af',light:'#bfdbfe',trim:'#fde68a'},
  rengo:{name:'豪族連合',col:'#3fae6a',dark:'#1f7a45',light:'#bbf7d0',trim:'#fef08a'},
  kok:{name:'黒曜帝国',col:'#8b5cf6',dark:'#3b2563',light:'#ddd6fe',trim:'#f87171'},
  guren:{name:'紅蓮軍',col:'#ef4444',dark:'#991b1b',light:'#fecaca',trim:'#fbbf24'},
  gin:{name:'白銀軍',col:'#cbd5e1',dark:'#64748b',light:'#f8fafc',trim:'#60a5fa'}
};
const FORDER=['aka','rengo','kok','guren','gin'];
const SKIN='#ffd9b8', OL='rgba(28,18,40,.9)';

/* ============ 町と砦 ============ */
const WSIDE=[[0,'rengo'],[400,'gin'],[535,'guren'],[595,'rengo']];
const ESIDE=[[0,'rengo'],[400,'guren'],[595,'rengo']];
const SSIDE=[[0,'rengo'],[400,'aka']];
const CITY=[
  {n:'暁都',x:800,y:1860,kind:'cap',own:[[0,'aka']]},
  {n:'白鷺',x:470,y:1590,own:WSIDE},{n:'青嵐',x:300,y:1940,own:WSIDE},{n:'紫苑',x:160,y:1650,own:WSIDE},
  {n:'翠川',x:560,y:2160,own:SSIDE},{n:'琥珀',x:1020,y:2170,own:SSIDE},
  {n:'紅葉',x:1180,y:1900,own:ESIDE},{n:'銀嶺',x:1350,y:1600,own:ESIDE},{n:'蒼海',x:1420,y:2020,own:ESIDE},
  {n:'天嶺砦',x:900,y:1170,kind:'fort',own:[[0,'aka']]},
  {n:'黒曜城',x:800,y:300,kind:'emp',own:[[0,'kok']]}
];
function ownerAt(c,t){let f=c.own[0][1];for(const [tt,ff] of c.own)if(t>=tt)f=ff;return f;}

/* ============ 地形 ============ */
let SEED=20260;
function ih(x,y){let h=Math.imul(x,374761393)^Math.imul(y,668265263)^SEED;h=Math.imul(h^(h>>>13),1274126177);return((h^(h>>>16))>>>0)/4294967296;}
function vn(x,y){const x0=Math.floor(x),y0=Math.floor(y),fx=x-x0,fy=y-y0,u=fx*fx*(3-2*fx),v=fy*fy*(3-2*fy);const a=ih(x0,y0),b=ih(x0+1,y0),c=ih(x0,y0+1),d=ih(x0+1,y0+1);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;}
function fbm(x,y,o){let s=0,a=.5,f=1,n=0;for(let i=0;i<o;i++){s+=a*vn(x*f,y*f);n+=a;a*=.5;f*=2.03;}return s/n;}
function H(x,y){
  const n=fbm(x/380,y/380,5);
  let h=.43+(n-.5)*.5;
  h+=sm(1050,880,y)*.1;
  const wob=(fbm(x/300+9,7,3)-.5)*170;
  const m=Math.exp(-Math.pow((y-1180+wob)/150,2));
  const ridge=1-Math.abs(2*fbm(x/190+30,y/190,4)-1);
  const pass=1-.88*Math.exp(-Math.pow((x-450)/62,2))-.88*Math.exp(-Math.pow((x-1150)/62,2));
  h+=m*(.22+.5*ridge)*pass;
  h-=sm(1350,1650,y)*.03;
  const ed=Math.min(x,WW-x,WH-y);
  const coast=64+(fbm(x/140,y/140,3)-.5)*120;
  const sea=y>1380?sm(coast+34,coast-18,ed)*sm(1380,1520,y):0;
  h=h*(1-sea)+.2*sea;
  for(const c of CITY){const dx=x-c.x,dy=y-c.y,d2=dx*dx+dy*dy;if(d2<6400){const w=sm(80,28,Math.sqrt(d2));h=h*(1-w)+.47*w;}}
  return h;
}
let TERR=null;
function lerpC(a,b,u){return[a[0]+(b[0]-a[0])*u,a[1]+(b[1]-a[1])*u,a[2]+(b[2]-a[2])*u];}
function genTerrain(){
  const SW=800,SH=1200,hs=new Float32Array(SW*SH);
  for(let j=0;j<SH;j++)for(let i=0;i<SW;i++)hs[j*SW+i]=H((i+.5)*2,(j+.5)*2);
  const sc=document.createElement('canvas');sc.width=SW;sc.height=SH;
  const sx=sc.getContext('2d'),img=sx.createImageData(SW,SH),d=img.data;
  const DEEP=[38,84,128],SHAL=[88,156,190],BEACH=[232,217,160];
  const GS=[134,196,106],GS2=[96,164,84],GN=[190,180,112],GN2=[150,146,86],FOR=[58,118,70],FORN=[70,100,78];
  const HILL=[152,142,102],ROCK=[142,138,134],ROCK2=[188,184,178],SNOW=[246,248,252];
  for(let j=0;j<SH;j++)for(let i=0;i<SW;i++){
    const k=j*SW+i,h=hs[k],wx=(i+.5)*2,wy=(j+.5)*2;
    const nt=sm(1250,950,wy);
    let c;
    if(h<.30){c=lerpC(SHAL,DEEP,clamp((.30-h)/.1,0,1));}
    else if(h<.325){c=BEACH;}
    else{
      const f=fbm(wx/150+50,wy/150,3);
      const t=clamp((h-.325)/.3,0,1);
      let g=lerpC(lerpC(GS,GS2,t),lerpC(GN,GN2,t),nt);
      const fw=sm(.57,.66,f);
      g=lerpC(g,lerpC(FOR,FORN,nt),fw*(h<.62?1:0));
      if(h>.58)g=lerpC(g,HILL,sm(.58,.68,h));
      if(h>.68)g=lerpC(g,ROCK,sm(.68,.78,h));
      if(h>.78)g=lerpC(g,ROCK2,sm(.78,.86,h));
      if(h>.86)g=lerpC(g,SNOW,sm(.86,.92,h));
      c=g;
    }
    let s=1;
    if(h>=.3&&i>0&&j>0&&i<SW-1&&j<SH-1){
      const gx=hs[k+1]-hs[k-1],gy=hs[k+SW]-hs[k-SW];
      s=1+clamp((-gx-gy)*5.5,-.45,.45);
    }
    const g2=(ih(i*7,j*13)-.5)*8;
    const p=k*4;d[p]=clamp(c[0]*s+g2,0,255);d[p+1]=clamp(c[1]*s+g2,0,255);d[p+2]=clamp(c[2]*s+g2,0,255);d[p+3]=255;
  }
  sx.putImageData(img,0,0);
  const TS=.75,big=document.createElement('canvas');big.width=WW*TS;big.height=WH*TS;
  const c=big.getContext('2d');c.imageSmoothingEnabled=true;c.imageSmoothingQuality='high';
  c.drawImage(sc,0,0,big.width,big.height);
  c.scale(TS,TS);
  const hAt=(x,y)=>hs[clamp(Math.floor(y/2),0,SH-1)*SW+clamp(Math.floor(x/2),0,SW-1)];
  /* 川 */
  const rivers=[[[450,1250],[430,1450],[380,1650],[300,1800],[210,1960],[110,2090],[40,2160]],[[1150,1250],[1180,1450],[1230,1650],[1180,1800],[1100,1950],[1110,2150],[1090,2420]]];
  for(const pts of rivers){
    for(const pass of [0,1]){
      c.beginPath();c.moveTo(pts[0][0],pts[0][1]);
      for(let i=1;i<pts.length-1;i++){const mx=(pts[i][0]+pts[i+1][0])/2,my=(pts[i][1]+pts[i+1][1])/2;c.quadraticCurveTo(pts[i][0],pts[i][1],mx,my);}
      c.lineTo(pts[pts.length-1][0],pts[pts.length-1][1]);
      c.lineCap='round';c.lineJoin='round';
      c.strokeStyle=pass?'#7bb8d6':'rgba(40,80,110,.55)';c.lineWidth=pass?5:8;c.stroke();
    }
  }
  /* 山・木 */
  const rnd=mulberry(77),items=[];
  for(let y=20;y<WH-10;y+=15)for(let x=20;x<WW-10;x+=15){
    const jx=x+(rnd()-.5)*15,jy=y+(rnd()-.5)*15,h=hAt(jx,jy);
    if(h>.7&&rnd()<.4)items.push({k:'m',x:jx,y:jy,h,s:10+rnd()*10+(h-.7)*40});
  }
  for(let y=8;y<WH-8;y+=10)for(let x=8;x<WW-8;x+=10){
    const jx=x+(rnd()-.5)*10,jy=y+(rnd()-.5)*10,h=hAt(jx,jy);
    if(h>.34&&h<.62){const f=fbm(jx/150+50,jy/150,3);if(f>.6&&rnd()<.55)items.push({k:'t',x:jx,y:jy,nt:sm(1250,950,jy),s:3.6+rnd()*2});}
  }
  items.sort((a,b)=>a.y-b.y);
  for(const it of items){
    if(it.k==='m'){
      const s=it.s;
      c.beginPath();c.moveTo(it.x,it.y-s);c.lineTo(it.x-s*.85,it.y);c.lineTo(it.x,it.y+s*.12);c.closePath();c.fillStyle='#aaa59c';c.fill();
      c.beginPath();c.moveTo(it.x,it.y-s);c.lineTo(it.x+s*.85,it.y);c.lineTo(it.x,it.y+s*.12);c.closePath();c.fillStyle='#6f6a66';c.fill();
      if(it.h>.8){c.beginPath();c.moveTo(it.x,it.y-s);c.lineTo(it.x-s*.3,it.y-s*.6);c.lineTo(it.x,it.y-s*.5);c.lineTo(it.x+s*.3,it.y-s*.6);c.closePath();c.fillStyle='#fafbff';c.fill();}
    }else{
      const s=it.s;c.fillStyle=it.nt>.5?'#2f5e4a':'#2f7a45';
      if(it.nt>.5){c.beginPath();c.moveTo(it.x,it.y-s*2);c.lineTo(it.x-s*.8,it.y);c.lineTo(it.x+s*.8,it.y);c.closePath();c.fill();}
      else{c.fillStyle='#4a3a2a';c.fillRect(it.x-.4,it.y-s*.5,.8,s*.6);c.fillStyle='#2f7a45';c.beginPath();c.arc(it.x,it.y-s,s*.9,0,TAU);c.fill();c.fillStyle='rgba(180,230,140,.35)';c.beginPath();c.arc(it.x-s*.25,it.y-s*1.2,s*.45,0,TAU);c.fill();}
    }
  }
  /* 地名 */
  c.textAlign='center';c.textBaseline='middle';c.fillStyle='rgba(50,36,18,.34)';
  const lab=(txt,x,y,sz,rot,sp)=>{c.save();c.translate(x,y);c.rotate(rot);c.font='800 '+sz+'px "Shippori Mincho",serif';const w=txt.length;for(let i=0;i<w;i++)c.fillText(txt[i],(i-(w-1)/2)*sp,0);c.restore();};
  lab('黒曜高原',800,640,64,0,80);lab('天嶺山脈',800,1150,76,-.02,96);lab('暁の平原',800,1730,64,0,86);lab('蒼海',1500,2250,40,-.5,52);lab('西海',90,2230,40,.5,52);
  /* 方位 */
  c.save();c.translate(1470,200);c.fillStyle='rgba(50,36,18,.55)';
  for(let i=0;i<4;i++){c.rotate(Math.PI/2);c.beginPath();c.moveTo(0,-60);c.lineTo(10,-10);c.lineTo(-10,-10);c.closePath();c.fill();}
  c.beginPath();c.arc(0,0,66,0,TAU);c.lineWidth=2;c.strokeStyle='rgba(50,36,18,.5)';c.stroke();
  c.restore();c.font='800 30px "Shippori Mincho",serif';c.fillStyle='rgba(50,36,18,.65)';c.fillText('北',1470,118);

function A(id,fac,name,major){
  const a={id,fac,name,major:!!major,k:[],sf:null};ARM[id]=a;ARR.push(a);
  a.at=function(t,x,y,n){const l=this.k[this.k.length-1];this.k.push([t,x===undefined?l[1]:x,y===undefined?l[2]:y,n===undefined?l[3]:n]);return this;};
  return a;
}
function lk(pk,t){
  if(t<=pk[0][0])return[pk[0][1],pk[0][2]];
  for(let i=0;i<pk.length-1;i++)if(t<pk[i+1][0]){const u=(t-pk[i][0])/(pk[i+1][0]-pk[i][0]);return[lerp(pk[i][1],pk[i+1][1],u),lerp(pk[i][2],pk[i+1][2],u)];}
  const l=pk[pk.length-1];return[l[1],l[2]];
}

function FA(id,fac,name,major,pk,nf,dt){

}

function segF(a){
  if(a.sf)return a.sf;
  let f=a.fac==='kok'?-1:1;const sf=[];
  for(let i=0;i<a.k.length-1;i++){const dx=a.k[i+1][1]-a.k[i][1];if(Math.abs(dx)>3)f=dx>0?1:-1;sf.push(f);}
  sf.push(f);a.sf=sf;return sf;
}
function st(a,t){
  const k=a.k;if(!k.length||t<k[0][0])return null;
  const L=k.length-1;let i,x,y,n,sp=0;
  if(t>=k[L][0]){i=L;x=k[L][1];y=k[L][2];n=k[L][3];}
  else{
    let lo=0,hi=L;while(hi-lo>1){const m=(lo+hi)>>1;if(k[m][0]<=t)lo=m;else hi=m;}
    i=lo;const p=k[i],q=k[i+1],u=(t-p[0])/(q[0]-p[0]);
    x=lerp(p[1],q[1],u);y=lerp(p[2],q[2],u);n=lerp(p[3],q[3],u);sp=Math.hypot(q[1]-p[1],q[2]-p[2])/(q[0]-p[0]);
  }
  if(n<40)return null;
  return{x,y,n,sp,face:segF(a)[Math.min(i,L)]};
}
function camAt(t){
  const K=CAMK;if(t<=K[0][0])return{x:K[0][1],y:K[0][2],vw:K[0][3]};
  for(let i=0;i<K.length-1;i++)if(t<K[i+1][0]){
    const u=sm(K[i][0],K[i+1][0],t);
    return{x:lerp(K[i][1],K[i+1][1],u),y:lerp(K[i][2],K[i+1][2],u),vw:Math.exp(lerp(Math.log(K[i][3]),Math.log(K[i+1][3]),u))};
  }
  const l=K[K.length-1];return{x:l[1],y:l[2],vw:l[3]};
}

    const ux=dx/L,uy=dy/L,vx=-uy,vy=ux;
    const rA=Math.min(Math.sqrt(A_.n)*.5,240),rB=Math.min(Math.sqrt(B_.n)*.5,240);
    const sxp=A_.x+ux*Math.min(rA*.8,L*.45),syp=A_.y+uy*Math.min(rA*.45,L*.45);
    const exp_=B_.x-ux*Math.min(rB*.8,L*.45),eyp=B_.y-uy*Math.min(rB*.45,L*.45);
    const spread=clamp(Math.sqrt(Math.min(A_.n,B_.n))*.5,16,170);
    const inten=Math.min(1,(t-b.t0)/2,(b.t1-t)/2)*b.k;
    const fa=FAC[ARM[b.a].fac],fb=FAC[ARM[b.b].fac];
    const mx=(sxp+exp_)/2,my=(syp+eyp)/2;
    if(pass===0){
      for(let k=0;k<3;k++){
        const ph=(t*.25+fh(k,bi))%1,r=(26+spread*.5)*fs*(.7+ph*.7);
        ctx.globalAlpha=.16*Math.min(1,inten)*(1-ph);ctx.fillStyle='#b9a27a';
        ctx.beginPath();ctx.arc(mx+(fh(k,bi+3)-.5)*spread*1.6,my+(fh(k,bi+4)-.5)*spread*.8,r,0,TAU);ctx.fill();
      }
      ctx.globalAlpha=1;continue;
    }
    const nArrow=Math.round((5+inten*5)),nImp=Math.round(3+inten*4);
    ctx.lineCap='round';
    for(let k=0;k<nArrow;k++){
      if(k/nArrow>inten+.15)continue;
      const side=k%2,ph=(t*1.1+fh(k,bi+1))%1;
      const lat=(fh(k,bi+2)-.5)*2*spread,j=(fh(k,bi+7)-.5)*spread*.5;
      let ax=sxp+vx*lat+ux*j,ay=syp+vy*lat+uy*j,bx=exp_+vx*lat-ux*j,by=eyp+vy*lat-uy*j;
      if(side){const tx=ax,ty=ay;ax=bx;ay=by;bx=tx;by=ty;}
      const col=side?fb.light:fa.light,arc=(28+fh(k,bi+5)*30)*fs;
      const px=lerp(ax,bx,ph),py=lerp(ay,by,ph)-Math.sin(Math.PI*ph)*arc;
      const ph2=Math.min(1,ph+.04),qx=lerp(ax,bx,ph2),qy=lerp(ay,by,ph2)-Math.sin(Math.PI*ph2)*arc;
      const dl=Math.hypot(qx-px,qy-py)||1,ex=(qx-px)/dl,ey=(qy-py)/dl;
      ctx.strokeStyle='rgba(30,20,10,.85)';ctx.lineWidth=2.4*fs*.8;ctx.beginPath();ctx.moveTo(px-ex*7*fs,py-ey*7*fs);ctx.lineTo(px,py);ctx.stroke();
      ctx.strokeStyle=col;ctx.lineWidth=1.3*fs*.8;ctx.beginPath();ctx.moveTo(px-ex*7*fs,py-ey*7*fs);ctx.lineTo(px,py);ctx.stroke();
    }
    ctx.globalCompositeOperation='lighter';
    for(let k=0;k<nImp;k++){
      const ph=(t*1.4+fh(k,bi+11))%1,lat=(fh(k,bi+12)-.5)*2*spread,al=fh(k,bi+13);
      const px=lerp(sxp,exp_,.2+al*.6)+vx*lat,py=lerp(syp,eyp,.2+al*.6)+vy*lat;
      const r=(4+ph*13)*fs;
      ctx.globalAlpha=(1-ph)*.9;ctx.strokeStyle='#ffd27a';ctx.lineWidth=1.5*fs*.8;
      ctx.beginPath();ctx.arc(px,py,r,0,TAU);ctx.stroke();
      for(let q=0;q<5;q++){const an=q*TAU/5+fh(k,bi)*6,r1=r*.4,r2=r*1.05;ctx.beginPath();ctx.moveTo(px+Math.cos(an)*r1,py+Math.sin(an)*r1);ctx.lineTo(px+Math.cos(an)*r2,py+Math.sin(an)*r2);ctx.stroke();}
    }
    const nMag=inten>.7?2:1;
    for(let k=0;k<nMag;k++){
      const ph=(t*.5+fh(k,bi+21))%1,lat=(fh(k,bi+22)-.5)*2*spread;
      const sidd=(Math.floor(t*.5+fh(k,bi+21))+k)%2;
      const px=lerp(sxp,exp_,.5)+vx*lat,py=lerp(syp,eyp,.5)+vy*lat;
      if(ph<.3){
        const u=ph/.3,col=sidd?fb.col:fa.col;
        ctx.globalAlpha=(1-u)*.9;ctx.strokeStyle=col;ctx.lineWidth=3*fs*.8;
        ctx.beginPath();const ax=sidd?exp_+vx*lat:sxp+vx*lat,ay=sidd?eyp+vy*lat:syp+vy*lat;ctx.moveTo(ax,ay-20*fs);
        for(let q=1;q<=6;q++){const uu=q/6;ctx.lineTo(lerp(ax,px,uu)+(fh(q,bi+Math.floor(t*10))-.5)*14*fs,lerp(ay-20*fs,py,uu)+(fh(q+3,bi)-.5)*8*fs);}
        ctx.stroke();
        const g=ctx.createRadialGradient(px,py,0,px,py,34*fs);g.addColorStop(0,col);g.addColorStop(1,'rgba(0,0,0,0)');
        ctx.globalAlpha=(1-u)*.7;ctx.fillStyle=g;ctx.beginPath();ctx.arc(px,py,34*fs,0,TAU);ctx.fill();
      }
    }
    ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;
    const nSoul=Math.round(2+inten*3);
    for(let k=0;k<nSoul;k++){
      const ph=(t*.35+fh(k,bi+31))%1,lat=(fh(k,bi+32)-.5)*2*spread;
      const px=lerp(sxp,exp_,fh(k,bi+33))+vx*lat,py=lerp(syp,eyp,fh(k,bi+33))+vy*lat-ph*48*fs;
      ctx.globalAlpha=(1-ph)*.8*Math.min(1,inten+.2);
      ctx.fillStyle='#e8f0ff';ctx.beginPath();ctx.arc(px,py,3*fs,0,TAU);ctx.fill();
      ctx.beginPath();ctx.moveTo(px-2.4*fs,py+1.5*fs);ctx.quadraticCurveTo(px,py+9*fs,px+2.4*fs,py+1.5*fs);ctx.fill();
    }
    ctx.globalAlpha=1;
  }
}
function drawOrders(t){
  for(const o of ORD){
    if(t<o.t0||t>o.t1)continue;
    const a=st(ARM[o.a],t),b=st(ARM[o.b],t);if(!a||!b)continue;
    const u=(t-o.t0)/(o.t1-o.t0);
    ctx.save();ctx.strokeStyle='rgba(255,215,110,.6)';ctx.lineWidth=2/Z>6?6:Math.max(1.5,1.5/Z*.6);
    ctx.setLineDash([6/Z*.7+4,8/Z*.7+4]);ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();ctx.setLineDash([]);
    const px=lerp(a.x,b.x,u),py=lerp(a.y,b.y,u),r=clamp(5/Z*.7,5,16);
    ctx.fillStyle='#fff0b0';ctx.strokeStyle='#8a5a10';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(px,py,r,0,TAU);ctx.fill();ctx.stroke();
    ctx.restore();
  }
}
function drawPaths(t){
  for(const a of ARR){
    if(!a.major)continue;const s=st(a,t);if(!s||s.sp<.5)continue;
    const pts=[[s.x,s.y]];let tt=t;
    for(let i=0;i<a.k.length;i++){const k=a.k[i];if(k[0]<=t)continue;if(k[0]>t+40)break;pts.push([k[1],k[2]]);}
    if(pts.length<2)continue;
    ctx.save();ctx.strokeStyle=FAC[a.fac].light;ctx.globalAlpha=.55;ctx.lineWidth=Math.max(1.4,2/Z*.55);
    ctx.setLineDash([10/Z*.5+4,8/Z*.5+4]);ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i][0],pts[i][1]);ctx.stroke();ctx.restore();
  }
}
function drawFireworks(t){
  if(t<765)return;
  ctx.globalCompositeOperation='lighter';
  const fs=clamp(.6/Z,1,3);
  for(let j=0;j<40;j++){
    const tj=765.5+j*.9,age=t-tj;if(age<0||age>2.4)continue;
    const cx=800+(fh(j,1)-.5)*700,cy=640-fh(j,2)*220,hue=Math.floor(fh(j,3)*360);
    const rise=Math.min(1,age/.6);
    if(age<.6){ctx.fillStyle='hsl('+hue+',100%,80%)';ctx.beginPath();ctx.arc(cx,cy+(1-rise)*260,3*fs,0,TAU);ctx.fill();continue;}
    const a2=age-.6;
    for(let q=0;q<28;q++){
      const an=q*TAU/28,rm=(.7+fh(q,j)*.5)*fs;
      for(let tr=0;tr<3;tr++){
        const a3=Math.max(0,a2-tr*.07),r=a3*130*rm,g=a3*a3*60*fs;
        ctx.globalAlpha=Math.max(0,1-a2/1.8)*(1-tr*.3);ctx.fillStyle='hsl('+((hue+q*5)%360)+',100%,'+(72+fh(q,j+4)*18)+'%)';
        ctx.beginPath();ctx.arc(cx+Math.cos(an)*r,cy+Math.sin(an)*r+g,(4.2-tr*1)*fs,0,TAU);ctx.fill();
      }
    }
  }
  ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
}
function drawLabels(banners){
  ctx.font='800 11px "Zen Maru Gothic",sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
  for(const b of banners){
    if(!(b.a.major||Z>.9))continue;
    const sx=wx2s(b.x),sy=wy2s(b.y)-26*clamp(.42/Z,.9,2.6)*Z-8;
    if(sx<-80||sx>W+80||sy<-30||sy>Hh+30)continue;
    const txt=b.a.name+' '+fmtN(b.n),w=ctx.measureText(txt).width+14;
    ctx.fillStyle='rgba(18,14,30,.78)';rr(ctx,sx-w/2,sy-10,w,20,10,'rgba(18,14,30,.78)');
    ctx.fillStyle=FAC[b.fac].col;ctx.beginPath();ctx.arc(sx-w/2+8,sy,3.4,0,TAU);ctx.fill();
    ctx.fillStyle='#fff';ctx.fillText(txt,sx+3,sy+.5);
  }
}
function drawPops(t){
  ctx.textAlign='center';ctx.textBaseline='middle';
  for(const p of POP){
    const age=t-p.t;if(age<0||age>p.dur)continue;
    const u=age/p.dur,a=Math.min(1,age/.25,(p.dur-age)/.6);
    const sx=wx2s(p.x),sy=wy2s(p.y)-age*7;
    if(sx<-120||sx>W+120||sy<-40||sy>Hh+40)continue;
    const big=1+.25*Math.max(0,1-age*3.5);
    ctx.globalAlpha=a;ctx.font='900 '+Math.round(17*big)+'px "Shippori Mincho",serif';ctx.lineJoin='round';
    ctx.lineWidth=5;ctx.strokeStyle='rgba(16,10,26,.92)';ctx.strokeText(p.txt,sx,sy);
    ctx.fillStyle=p.kind==='b'?'#ff8f8f':p.kind==='g'?'#ffe27a':'#fff';ctx.fillText(p.txt,sx,sy);
  }
  ctx.globalAlpha=1;
}
function render(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.fillStyle='#232238';ctx.fillRect(0,0,W,Hh);
  const t=T;
  if(!manual){const c=camAt(t);CX=c.x;CY=c.y;Z=Wref/c.vw;camM.x=CX;camM.y=CY;camM.z=Z;}
  else{CX=camM.x;CY=camM.y;Z=camM.z;}
  Z=clamp(Z,Math.max(W/1600,.12),2.6);
  {const hx=W/2/Z,hy=Hh/2/Z;CX=hx*2>=WW?WW/2:clamp(CX,hx,WW-hx);CY=hy*2>=WH?WH/2:clamp(CY,hy,WH-hy);}
  ctx.save();
  ctx.translate(W/2,Hh/2);ctx.scale(Z,Z);ctx.translate(-CX,-CY);
  if(TERR){ctx.imageSmoothingEnabled=true;ctx.drawImage(TERR,0,0,WW,WH);}
  drawCities(t);
  const act=activeBattles(t);
  const eng={};
  for(const bi of act){
    const b=BT[bi],sa=st(ARM[b.a],t),sb=st(ARM[b.b],t);if(!sa||!sb)continue;
    const k=Math.min(1,(t-b.t0)/2,(b.t1-t)/2);
    const s1=sb.x>=sa.x?1:-1;
    if(!eng[b.a]||eng[b.a].k<k)eng[b.a]={dir:s1,k:Math.min(1,k)};
    if(!eng[b.b]||eng[b.b].k<k)eng[b.b]={dir:-s1,k:Math.min(1,k)};
  }
  drawPaths(t);drawOrders(t);
  drawBattleFX(t,act,0);
  const banners=drawArmies(t,eng);
  drawBattleFX(t,act,1);
  drawFireworks(t);
  ctx.restore();
  drawCityLabels(t);drawLabels(banners);drawPops(t);
}

/* ============ UI ============ */
const $=id=>document.getElementById(id);
const elSub=$('sub'),elChap=$('chap'),elChips=$('chips'),elCard=$('card'),elSeek=$('seek'),elTm=$('tm');
let lastChap=-1,lastSub=null,lastChip=0,cardTimer=0;
function chapIdx(t){let c=0;for(let i=0;i<CH.length;i++)if(t>=CH[i][0])c=i;return c;}
function updateUI(force){
  const ci=chapIdx(T);
  if(ci!==lastChap||force){
    lastChap=ci;elChap.innerHTML='<small>'+CH[ci][1]+'</small>'+CH[ci][2];
    elCard.querySelector('.k').textContent=CH[ci][1];elCard.querySelector('.n').textContent=CH[ci][2];
  }
  elCard.classList.toggle('show',T-CH[ci][0]<4.8&&T<T_END+1&&started);
  let s=null;for(const x of SUB)if(T>=x.t0&&T<x.t1){s=x;break;}
  if(s!==lastSub){lastSub=s;if(s){elSub.textContent=s.txt;elSub.classList.remove('off');}else elSub.classList.add('off');}
  const now=performance.now();
  if(force||now-lastChip>180){
    lastChip=now;const tot={};
    for(const a of ARR){const q=st(a,T);if(q)tot[a.fac]=(tot[a.fac]||0)+q.n;}
    let h='';for(const f of FORDER)if(tot[f]>=300)h+='<span class="chip"><i style="background:'+FAC[f].col+'"></i>'+FAC[f].name+' '+fmtN(tot[f])+'</span>';
    elChips.innerHTML=h;
    if(document.activeElement!==elSeek)elSeek.value=Math.min(T,T_END);
    elTm.textContent=fmtT(Math.min(T,T_END))+' / '+fmtT(T_END);
  }
  $('end').hidden=!(T>=T_END-4&&started&&$('sheet').hidden);
}
function setPlaying(p){playing=p;$('bPlay').textContent=p?'⏸':'▶';}
function seek(t,keepCam){T=clamp(t,0,T_MAX);if(!keepCam){manual=false;$('bCam').classList.add('on');$('bCam').textContent='🎥自動';}updateUI(true);}
function gotoChap(i){i=clamp(i,0,CH.length-1);seek(CH[i][0]+.01);$('sheet').hidden=true;}
$('bPlay').onclick=()=>{if(T>=T_MAX-.2)seek(0);setPlaying(!playing);};
$('bPrev').onclick=()=>{const ci=chapIdx(T);gotoChap(T-CH[ci][0]>4?ci:ci-1);};
$('bNext').onclick=()=>gotoChap(chapIdx(T)+1);
$('bSpd').onclick=()=>{speed=speed===1?2:speed===2?4:speed===4?8:1;$('bSpd').textContent='×'+speed;};
$('bCam').onclick=()=>{manual=false;$('bCam').classList.add('on');$('bCam').textContent='🎥自動';};
$('bLod').onclick=()=>{lodMode=(lodMode+1)%3;$('bLod').textContent=['兵:自動','兵:小','兵:普通'][lodMode];$('bLod').classList.toggle('on',lodMode!==0);};
$('bChap').onclick=()=>{$('sheet').hidden=false;};
$('bClose').onclick=()=>{$('sheet').hidden=true;};
$('bEndChap').onclick=()=>{$('sheet').hidden=false;};
$('bAgain').onclick=()=>{seek(0);setPlaying(true);};
elSeek.addEventListener('input',()=>{seek(parseFloat(elSeek.value));});
$('bStart').onclick=()=>{$('title').hidden=true;started=true;seek(0);setPlaying(true);};
function buildSheet(){
  const l=$('clist');l.innerHTML='';
  CH.forEach((c,i)=>{const b=document.createElement('button');b.className='ci';b.innerHTML='<small>'+c[1]+'</small>'+c[2]+'<span style="margin-left:auto;font-family:var(--f-body);font-size:11px;color:var(--ink-soft)">'+fmtT(c[0])+'</span>';b.onclick=()=>{gotoChap(i);if(!started){$('title').hidden=true;started=true;}setPlaying(true);};l.appendChild(b);});
}
/* ジェスチャ(ドラッグ移動・ピンチ・ホイール) */
const ptrs=new Map();let pinch0=null;
function goManual(){if(!manual){manual=true;$('bCam').classList.remove('on');$('bCam').textContent='🎥手動';}}
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});if(ptrs.size===2){const [p,q]=[...ptrs.values()];pinch0={d:Math.hypot(p.x-q.x,p.y-q.y),z:camM.z};}});
cv.addEventListener('pointermove',e=>{
  const p=ptrs.get(e.pointerId);if(!p)return;
  const dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;
  if(ptrs.size===1){if(Math.abs(dx)+Math.abs(dy)>0){goManual();camM.x-=dx/Z;camM.y-=dy/Z;}}
  else if(ptrs.size===2&&pinch0){goManual();const [a,b]=[...ptrs.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);camM.z=clamp(pinch0.z*d/pinch0.d,Math.max(W/1600,.12),2.6);}
});
const endp=e=>{ptrs.delete(e.pointerId);if(ptrs.size<2)pinch0=null;};
cv.addEventListener('pointerup',endp);cv.addEventListener('pointercancel',endp);
cv.addEventListener('wheel',e=>{e.preventDefault();goManual();const f=Math.exp(-e.deltaY*.0015);camM.z=clamp(camM.z*f,Math.max(W/1600,.12),2.6);},{passive:false});

/* ============ メインループ ============ */
let lastNow=0;
function frame(now){
  const dt=Math.min(.1,(now-lastNow)/1000||0);lastNow=now;
  if(playing){T+=dt*speed;if(T>=T_MAX){T=T_MAX;setPlaying(false);}}
  if(playing||true){render();updateUI(false);}
  requestAnimationFrame(frame);
}
function boot(){
  buildScenario();mkSlots();buildSheet();resize();
  setTimeout(()=>{
    try{mkSprites();genTerrain();}catch(err){console.error(err);}
    $('load').hidden=true;$('title').hidden=false;updateUI(true);
    requestAnimationFrame(frame);
  },30);
}
window.addEventListener('resize',resize);
window.__game={seek:t=>{T=t;manual=false;updateUI(true);},get T(){return T;},ARM,BT,st,start:()=>{$('title').hidden=true;started=true;},setLod:m=>{lodMode=m;}};
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else boot();
</script>
