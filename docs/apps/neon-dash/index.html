<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#05060c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ネオン・ダッシュ">
<title>ネオン・ダッシュ</title>
<style>
:root{color-scheme:dark;--bg:#05060c;--text:#eaeaf2;--muted:#8b8ba0;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);overscroll-behavior:none;}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic",sans-serif;overflow:hidden;height:100vh;height:100dvh;display:flex;flex-direction:column;}
header{position:absolute;top:0;left:0;right:0;z-index:2;padding:calc(env(safe-area-inset-top) + 10px) 14px 8px;display:flex;justify-content:space-between;align-items:center;pointer-events:none;}
.back-link{pointer-events:auto;color:var(--muted);text-decoration:none;font-size:0.8rem;}
.score{font-size:1.1rem;font-weight:700;text-shadow:0 0 8px rgba(120,200,255,0.8);}
#stage{position:relative;flex:1;touch-action:none;}
canvas{display:block;width:100%;height:100%;}
.hint{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 18px);text-align:center;color:var(--muted);font-size:0.8rem;z-index:2;pointer-events:none;}
</style>
</head>
<body>
<header>
<a class="back-link" href="../../">← ハブに戻る</a>
<span class="score" id="score-label">0</span>
</header>
<div id="stage">
<canvas id="game"></canvas>
</div>
<p class="hint" id="hint">タップして開始</p>
<script>
(() => {
  const STORAGE_KEY = 'neonDashApp.best.v1';
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const stage = document.getElementById('stage');
  const scoreLabel = document.getElementById('score-label');
  const hint = document.getElementById('hint');

  let W = 0, H = 0, dpr = 1;
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = stage.clientWidth;
    H = stage.clientHeight;
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  function loadBest() {
    try { return Number(localStorage.getItem(STORAGE_KEY) || 0); } catch { return 0; }
  }
  function saveBest(v) {
    try { localStorage.setItem(STORAGE_KEY, String(v)); } catch { /* 保存できなければ無視 */ }
  }
  let best = loadBest();

  const GRAVITY = 1500;
  const JUMP_VELOCITY = -430;
  const PIPE_GAP = 170;
  const PIPE_WIDTH = 64;
  let baseSpeed = 190;

  let state = 'ready';
  let player, pipes, particles, trail, stars, score, speed, shakeTime, shakeMag, spawnTimer;

  function resetGame() {
    player = { x: 0, y: 0, vy: 0, radius: 15, hue: 190 };
    player.x = W * 0.28;
    player.y = H * 0.45;
    pipes = [];
    particles = [];
    trail = [];
    score = 0;
    speed = baseSpeed;
    shakeTime = 0;
    shakeMag = 0;
    spawnTimer = 0;
    scoreLabel.textContent = '0';
  }

  function makeStars() {
    stars = [];
    const layers = [
      { count: 26, speed: 18, size: [1, 2], alpha: 0.5 },
      { count: 16, speed: 42, size: [1.5, 3], alpha: 0.75 },
      { count: 10, speed: 80, size: [2, 3.5], alpha: 1 }
    ];
    layers.forEach((layer, li) => {
      for (let i = 0; i < layer.count; i++) {
        stars.push({
          x: Math.random() * (W || 320),
          y: Math.random() * (H || 480),
          size: layer.size[0] + Math.random() * (layer.size[1] - layer.size[0]),
          speed: layer.speed,
          alpha: layer.alpha,
          layer: li
        });
      }
    });
  }

  resetGame();
  makeStars();

  function spawnPipe() {
    const margin = 60;
    const gapY = margin + Math.random() * (H - margin * 2 - PIPE_GAP);
    pipes.push({ x: W + PIPE_WIDTH, gapY, passed: false, hue: 300 + Math.random() * 60 });
  }

  function burst(x, y, hue, count) {
    for (let i = 0; i < count; i++) {
      const angle = Math.random() * Math.PI * 2;
      const spd = 60 + Math.random() * 220;
      particles.push({
        x, y,
        vx: Math.cos(angle) * spd,
        vy: Math.sin(angle) * spd,
        life: 0,
        maxLife: 0.5 + Math.random() * 0.4,
        size: 2 + Math.random() * 3,
        hue: hue + (Math.random() * 30 - 15)
      });
    }
  }

  function triggerShake(mag) {
    shakeTime = 0.28;
    shakeMag = mag;
  }

  function onTap() {
    if (state === 'ready') {
      state = 'playing';
      hint.style.display = 'none';
      player.vy = JUMP_VELOCITY;
    } else if (state === 'playing') {
      player.vy = JUMP_VELOCITY;
    } else if (state === 'gameover') {
      resetGame();
      state = 'ready';
      hint.textContent = 'タップして開始';
      hint.style.display = 'block';
    }
  }
  stage.addEventListener('pointerdown', (e) => { e.preventDefault(); onTap(); }, { passive: false });

  function gameOver() {
    state = 'gameover';
    if (score > best) { best = score; saveBest(best); }
    hint.textContent = `スコア ${score} / ベスト ${best} ・ タップでリトライ`;
    hint.style.display = 'block';
    triggerShake(14);
    burst(player.x, player.y, player.hue, 30);
  }

  let last = performance.now();
  function loop(now) {
    const dt = Math.min((now - last) / 1000, 1 / 30);
    last = now;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }

  function update(dt) {
    stars.forEach((s) => {
      s.x -= s.speed * dt * (state === 'gameover' ? 0 : 1);
      if (s.x < -2) { s.x = W + 2; s.y = Math.random() * H; }
    });

    if (state === 'playing') {
      player.vy += GRAVITY * dt;
      player.y += player.vy * dt;

      if (Math.random() < 0.6) {
        trail.push({ x: player.x - player.radius * 0.6, y: player.y, life: 0, maxLife: 0.35, size: player.radius * 0.5, hue: player.hue });
      }

      speed += dt * 4;
      spawnTimer -= dt;
      if (spawnTimer <= 0) {
        spawnPipe();
        spawnTimer = Math.max(1.1, 1.6 - speed / 400);
      }

      pipes.forEach((p) => { p.x -= speed * dt; });
      pipes = pipes.filter((p) => p.x > -PIPE_WIDTH - 20);

      pipes.forEach((p) => {
        if (!p.passed && p.x + PIPE_WIDTH < player.x) {
          p.passed = true;
          score++;
          scoreLabel.textContent = String(score);
          burst(player.x, player.y, player.hue, 8);
        }
        const withinX = player.x + player.radius > p.x && player.x - player.radius < p.x + PIPE_WIDTH;
        if (withinX) {
          const hitsTop = player.y - player.radius < p.gapY;
          const hitsBottom = player.y + player.radius > p.gapY + PIPE_GAP;
          if (hitsTop || hitsBottom) gameOver();
        }
      });

      if (player.y - player.radius < 0) {
        player.y = player.radius;
        player.vy = 0;
      }
      if (player.y + player.radius > H) {
        player.y = H - player.radius;
        gameOver();
      }
    }

    particles.forEach((pt) => {
      pt.life += dt;
      pt.x += pt.vx * dt;
      pt.y += pt.vy * dt;
      pt.vx *= 0.94;
      pt.vy *= 0.94;
    });
    particles = particles.filter((pt) => pt.life < pt.maxLife);

    trail.forEach((t) => { t.life += dt; });
    trail = trail.filter((t) => t.life < t.maxLife);

    if (shakeTime > 0) shakeTime = Math.max(0, shakeTime - dt);
  }

  function draw() {
    ctx.save();
    if (shakeTime > 0) {
      const f = shakeTime / 0.28;
      ctx.translate((Math.random() - 0.5) * shakeMag * f, (Math.random() - 0.5) * shakeMag * f);
    }

    const bg = ctx.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, '#0a0d1c');
    bg.addColorStop(1, '#05060c');
    ctx.fillStyle = bg;
    ctx.fillRect(-20, -20, W + 40, H + 40);

    stars.forEach((s) => {
      ctx.globalAlpha = s.alpha;
      ctx.fillStyle = '#bcd6ff';
      ctx.fillRect(s.x, s.y, s.size, s.size);
    });
    ctx.globalAlpha = 1;

    trail.forEach((t) => {
      const a = 1 - t.life / t.maxLife;
      ctx.globalAlpha = a * 0.5;
      ctx.fillStyle = `hsl(${t.hue}, 90%, 65%)`;
      ctx.beginPath();
      ctx.arc(t.x, t.y, t.size * (1 - t.life / t.maxLife), 0, Math.PI * 2);
      ctx.fill();
    });
    ctx.globalAlpha = 1;

    pipes.forEach((p) => {
      ctx.save();
      ctx.shadowColor = `hsl(${p.hue}, 90%, 60%)`;
      ctx.shadowBlur = 18;
      ctx.fillStyle = `hsl(${p.hue}, 85%, 55%)`;
      ctx.fillRect(p.x, -10, PIPE_WIDTH, p.gapY + 10);
      ctx.fillRect(p.x, p.gapY + PIPE_GAP, PIPE_WIDTH, H - p.gapY - PIPE_GAP + 10);
      ctx.restore();
    });

    ctx.save();
    ctx.shadowColor = `hsl(${player.hue}, 95%, 65%)`;
    ctx.shadowBlur = 22;
    const grad = ctx.createRadialGradient(player.x - 4, player.y - 4, 1, player.x, player.y, player.radius);
    grad.addColorStop(0, '#ffffff');
    grad.addColorStop(1, `hsl(${player.hue}, 95%, 60%)`);
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    particles.forEach((pt) => {
      const a = 1 - pt.life / pt.maxLife;
      ctx.globalAlpha = a;
      ctx.fillStyle = `hsl(${pt.hue}, 90%, 65%)`;
      ctx.beginPath();
      ctx.arc(pt.x, pt.y, pt.size * a, 0, Math.PI * 2);
      ctx.fill();
    });
    ctx.globalAlpha = 1;

    ctx.restore();
  }

  requestAnimationFrame((t) => { last = t; requestAnimationFrame(loop); });
})();
</script>
</body>
</html>
