<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="動きの見本">
<title>動きの見本</title>
<style>
:root{color-scheme:light dark;--bg:#f7f7f8;--panel-bg:#fff;--border:#dcdce0;--text:#1c1c1f;--muted:#6b6b73;--accent:#2563eb;--accent-hover:#1d4ed8;--stage:#eef2fb;--ok:#16a34a;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html{-webkit-text-size-adjust:100%;}
body{margin:0;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic",sans-serif;background:var(--bg);color:var(--text);line-height:1.6;}
header{padding:16px;max-width:720px;margin:0 auto;}
.back-link{display:inline-block;margin-bottom:8px;color:var(--muted);text-decoration:none;font-size:0.85rem;}
header h1{margin:0 0 4px;font-size:1.3rem;}
header p{margin:0;color:var(--muted);font-size:0.85rem;}
main{max-width:720px;margin:0 auto;padding:0 16px 48px;display:grid;grid-template-columns:1fr;gap:16px;}
@media(min-width:620px){main{grid-template-columns:1fr 1fr;}}
.card{background:var(--panel-bg);border:1px solid var(--border);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;}
.card h2{margin:0;font-size:1rem;}
.card .hint{margin:0;color:var(--muted);font-size:0.8rem;}
.stage{position:relative;height:220px;border-radius:10px;background:var(--stage);overflow:hidden;touch-action:manipulation;user-select:none;-webkit-user-select:none;}
.stage svg{width:100%;height:100%;display:block;}
button{border:none;border-radius:8px;padding:10px 16px;min-height:44px;font-size:0.95rem;cursor:pointer;background:var(--accent);color:#fff;width:100%;}
button:hover{background:var(--accent-hover);}
button:disabled{opacity:.55;cursor:default;}
.foot{text-align:center;color:var(--muted);font-size:0.75rem;padding:0 16px 24px;}

/* cubes */
#cubes{touch-action:none;cursor:grab;perspective:600px;display:flex;align-items:center;justify-content:center;}
#cubes:active{cursor:grabbing;}
.scene{transform-style:preserve-3d;display:flex;gap:44px;align-items:center;}
.cube{--s:56px;width:var(--s);height:var(--s);position:relative;transform-style:preserve-3d;animation:spin var(--dur,6s) linear infinite;}
.cube:nth-child(2){--s:76px;animation-direction:reverse;}
.cube:nth-child(3){--s:44px;animation-duration:calc(var(--dur,6s) * .7);}
.cube i{position:absolute;inset:0;border:2px solid rgba(255,255,255,.75);display:block;}
.cube i:nth-child(1){transform:translateZ(calc(var(--s)/2));background:rgba(37,99,235,.85);}
.cube i:nth-child(2){transform:rotateY(180deg) translateZ(calc(var(--s)/2));background:rgba(99,102,241,.85);}
.cube i:nth-child(3){transform:rotateY(90deg) translateZ(calc(var(--s)/2));background:rgba(14,165,233,.85);}
.cube i:nth-child(4){transform:rotateY(-90deg) translateZ(calc(var(--s)/2));background:rgba(56,189,248,.85);}
.cube i:nth-child(5){transform:rotateX(90deg) translateZ(calc(var(--s)/2));background:rgba(124,58,237,.85);}
.cube i:nth-child(6){transform:rotateX(-90deg) translateZ(calc(var(--s)/2));background:rgba(79,70,229,.85);}
@keyframes spin{from{transform:rotateX(-20deg) rotateY(0)}to{transform:rotateX(-20deg) rotateY(360deg)}}

#confetti{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;}
@media (prefers-color-scheme: dark){
:root{--bg:#17181c;--panel-bg:#1f2024;--border:#303136;--text:#eaeaec;--muted:#9a9aa2;--stage:#262a36;}
}
@media (prefers-reduced-motion: reduce){.cube{animation-duration:30s;}}
</style>
</head>
<body>
<header>
<a class="back-link" href="../../">← ハブに戻る</a>
<h1>🎬 動きの見本</h1>
<p>すべてこのページ内で自作したアニメーションです。素材の権利を気にせず使えます。</p>
</header>
<main>

<section class="card">
<h2>🎯 ゴール達成</h2>
<p class="hint">ボタンかステージをタップすると矢が的に当たります。</p>
<div class="stage" id="goal-stage">
<svg viewBox="0 0 300 200" aria-label="的に矢が当たるアニメーション">
<g transform="translate(210 100)">
<circle r="62" fill="#ef4444"/><circle r="48" fill="#fff"/><circle r="34" fill="#ef4444"/><circle r="20" fill="#fff"/><circle id="goal-bull" r="8" fill="#ef4444"/>
</g>
<g id="goal-burst" transform="translate(210 100)"></g>
<g id="goal-arrow" opacity="0" transform="translate(-90 100)">
<line x1="0" y1="0" x2="70" y2="0" stroke="#92400e" stroke-width="4" stroke-linecap="round"/>
<polygon points="70,-6 84,0 70,6" fill="#475569"/>
<polygon points="0,0 -10,-8 6,0 -10,8" fill="#2563eb"/>
</g>
<text id="goal-text" x="80" y="62" text-anchor="middle" font-size="30" font-weight="800" fill="#f59e0b" stroke="#fff" stroke-width="1" opacity="0" style="transform-origin:center;transform-box:fill-box">GOAL!</text>
</svg>
</div>
<button type="button" id="goal-btn">矢を放つ</button>
</section>

<section class="card">
<h2>🧊 回るキューブ</h2>
<p class="hint">ステージをドラッグすると向きが変わります。</p>
<div class="stage" id="cubes">
<div class="scene" id="scene">
<div class="cube"><i></i><i></i><i></i><i></i><i></i><i></i></div>
<div class="cube"><i></i><i></i><i></i><i></i><i></i><i></i></div>
<div class="cube"><i></i><i></i><i></i><i></i><i></i><i></i></div>
</div>
</div>
<button type="button" id="cube-btn">速さ:ふつう</button>
</section>

<section class="card">
<h2>🔍 ファイルスキャン</h2>
<p class="hint">スキャンが終わると結果が表示されます。</p>
<div class="stage" id="scan-stage">
<svg viewBox="0 0 300 212" aria-label="ファイルをスキャンするアニメーション">
<defs>
<linearGradient id="scan-grad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#38bdf8" stop-opacity="0"/><stop offset="1" stop-color="#38bdf8" stop-opacity=".75"/></linearGradient>
<clipPath id="scan-clip"><path d="M105 30h66l34 34v106a6 6 0 0 1-6 6H105a6 6 0 0 1-6-6V36a6 6 0 0 1 6-6z"/></clipPath>
</defs>
<path d="M105 30h66l34 34v106a6 6 0 0 1-6 6H105a6 6 0 0 1-6-6V36a6 6 0 0 1 6-6z" fill="#fff" stroke="#94a3b8" stroke-width="3"/>
<path d="M171 30v28a6 6 0 0 0 6 6h28z" fill="#e2e8f0" stroke="#94a3b8" stroke-width="3"/>
<g id="scan-lines" stroke="#cbd5e1" stroke-width="6" stroke-linecap="round">
<line x1="118" y1="90" x2="186" y2="90"/><line x1="118" y1="108" x2="170" y2="108"/><line x1="118" y1="126" x2="186" y2="126"/><line x1="118" y1="144" x2="156" y2="144"/>
</g>
<g clip-path="url(#scan-clip)"><g id="scan-bar" opacity="0"><rect x="95" y="-34" width="120" height="34" fill="url(#scan-grad)"/><rect x="95" y="-2" width="120" height="3" fill="#0ea5e9"/></g></g>
<g id="scan-ok" opacity="0" style="transform-origin:205px 160px;transform-box:view-box">
<circle cx="205" cy="160" r="22" fill="#16a34a"/><path d="M194 160l8 8 15-17" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
</g>
<text id="scan-pct" x="150" y="204" text-anchor="middle" font-size="13" fill="currentColor" opacity=".7">待機中</text>
</svg>
</div>
<button type="button" id="scan-btn">スキャン開始</button>
</section>

<section class="card">
<h2>✅ 成功チェック</h2>
<p class="hint">ボタンかステージをタップすると紙吹雪が舞います。</p>
<div class="stage" id="ok-stage">
<svg viewBox="0 0 300 200" aria-label="チェックマークが描かれるアニメーション">
<defs><linearGradient id="ok-grad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#86efac"/><stop offset="1" stop-color="#15803d"/></linearGradient></defs>
<g id="ok-all" style="transform-origin:150px 100px;transform-box:view-box">
<circle id="ok-ring" cx="150" cy="100" r="52" fill="none" stroke="url(#ok-grad)" stroke-width="10" stroke-linecap="round" transform="rotate(-90 150 100)" stroke-dasharray="327" stroke-dashoffset="0"/>
<circle id="ok-fill" cx="150" cy="100" r="44" fill="url(#ok-grad)" opacity=".18"/>
<path id="ok-check" d="M126 102l18 18 32-38" fill="none" stroke="url(#ok-grad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="80" stroke-dashoffset="0"/>
</g>
</svg>
<canvas id="confetti"></canvas>
</div>
<button type="button" id="ok-btn">お祝いする</button>
</section>

</main>
<p class="foot">矢・的・キューブ・チェックマーク・紙吹雪はすべてこのページ内のコードで描画しています。</p>
<script>
(() => {
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const $ = id => document.getElementById(id);
  const NS = 'http://www.w3.org/2000/svg';

  /* 1. goal */
  (() => {
    const arrow = $('goal-arrow'), burst = $('goal-burst'), text = $('goal-text'), btn = $('goal-btn'), stage = $('goal-stage');
    let busy = false;
    const colors = ['#f59e0b', '#ef4444', '#2563eb', '#16a34a', '#a855f7'];
    async function shoot() {
      if (busy) return; busy = true; btn.disabled = true;
      burst.replaceChildren(); text.style.opacity = 0;
      arrow.setAttribute('opacity', 1);
      const fly = arrow.animate([
        { transform: 'translate(-90px,100px) rotate(8deg)' },
        { transform: 'translate(140px,100px) rotate(0deg)' }
      ], { duration: reduce ? 1 : 480, easing: 'cubic-bezier(.5,0,.9,.6)', fill: 'forwards' });
      await fly.finished;
      arrow.animate([
        { transform: 'translate(140px,100px) rotate(0)' },
        { transform: 'translate(142px,100px) rotate(-4deg)' },
        { transform: 'translate(140px,100px) rotate(3deg)' },
        { transform: 'translate(140px,100px) rotate(0)' }
      ], { duration: reduce ? 1 : 360, fill: 'forwards' });
      for (let i = 0; i < 14; i++) {
        const s = document.createElementNS(NS, 'polygon');
        s.setAttribute('points', '0,-7 2,-2 7,-2 3,1 5,6 0,3 -5,6 -3,1 -7,-2 -2,-2');
        s.setAttribute('fill', colors[i % colors.length]);
        burst.appendChild(s);
        const a = (i / 14) * Math.PI * 2, d = 55 + (i % 3) * 18;
        s.animate([
          { transform: 'translate(0,0) scale(.3)', opacity: 1 },
          { transform: `translate(${Math.cos(a) * d}px,${Math.sin(a) * d}px) scale(1.1) rotate(${i * 40}deg)`, opacity: 0 }
        ], { duration: reduce ? 1 : 800, easing: 'ease-out', fill: 'forwards' });
      }
      text.animate([
        { opacity: 0, transform: 'scale(.3)' }, { opacity: 1, transform: 'scale(1.25)', offset: .6 }, { opacity: 1, transform: 'scale(1)' }
      ], { duration: reduce ? 1 : 500, easing: 'ease-out', fill: 'forwards' });
      await new Promise(r => setTimeout(r, reduce ? 50 : 1400));
      arrow.getAnimations().forEach(a => a.cancel());
      arrow.setAttribute('opacity', 0);
      busy = false; btn.disabled = false;
    }
    btn.addEventListener('click', e => { e.stopPropagation(); shoot(); });
    stage.addEventListener('click', shoot);
  })();

  /* 2. cubes */
  (() => {
    const stage = $('cubes'), scene = $('scene'), btn = $('cube-btn');
    let rx = 0, ry = 0, drag = null;
    const speeds = [['ゆっくり', '12s'], ['ふつう', '6s'], ['はやい', '2.5s']];
    let si = 1;
    const apply = () => scene.style.transform = `rotateX(${rx}deg) rotateY(${ry}deg)`;
    stage.addEventListener('pointerdown', e => { drag = { x: e.clientX, y: e.clientY }; stage.setPointerCapture(e.pointerId); });
    stage.addEventListener('pointermove', e => {
      if (!drag) return;
      ry += (e.clientX - drag.x) * .6; rx = Math.max(-80, Math.min(80, rx - (e.clientY - drag.y) * .6));
      drag = { x: e.clientX, y: e.clientY }; apply();
    });
    const end = () => { drag = null; };
    stage.addEventListener('pointerup', end); stage.addEventListener('pointercancel', end);
    btn.addEventListener('click', () => {
      si = (si + 1) % speeds.length;
      stage.style.setProperty('--dur', speeds[si][1]);
      btn.textContent = '速さ:' + speeds[si][0];
    });
    apply();
  })();

  /* 3. scan */
  (() => {
    const bar = $('scan-bar'), ok = $('scan-ok'), pct = $('scan-pct'), lines = $('scan-lines'), btn = $('scan-btn');
    let busy = false;
    async function scan() {
      if (busy) return; busy = true; btn.disabled = true;
      ok.setAttribute('opacity', 0); ok.getAnimations().forEach(a => a.cancel());
      [...lines.children].forEach(l => l.setAttribute('stroke', '#cbd5e1'));
      bar.setAttribute('opacity', 1);
      const dur = reduce ? 300 : 3000;
      const move = bar.animate([{ transform: 'translateY(30px)' }, { transform: 'translateY(210px)' }, { transform: 'translateY(30px)' }, { transform: 'translateY(210px)' }], { duration: dur, easing: 'ease-in-out', fill: 'forwards' });
      const t0 = performance.now();
      await new Promise(res => {
        const tick = now => {
          const p = Math.min(1, (now - t0) / dur);
          pct.textContent = 'スキャン中… ' + Math.round(p * 100) + '%';
          [...lines.children].forEach((l, i) => { if (p > (i + 1) / 5) l.setAttribute('stroke', '#38bdf8'); });
          p < 1 ? requestAnimationFrame(tick) : res();
        };
        requestAnimationFrame(tick);
      });
      move.cancel(); bar.setAttribute('opacity', 0);
      [...lines.children].forEach(l => l.setAttribute('stroke', '#22c55e'));
      pct.textContent = '問題は見つかりませんでした';
      ok.setAttribute('opacity', 1);
      ok.animate([{ transform: 'scale(0)' }, { transform: 'scale(1.3)', offset: .65 }, { transform: 'scale(1)' }], { duration: reduce ? 1 : 450, easing: 'ease-out' });
      busy = false; btn.disabled = false; btn.textContent = 'もう一度スキャン';
    }
    btn.addEventListener('click', scan);
  })();

  /* 4. success + confetti */
  (() => {
    const stage = $('ok-stage'), btn = $('ok-btn'), cv = $('confetti'), ring = $('ok-ring'), check = $('ok-check'), all = $('ok-all'), fill = $('ok-fill');
    const ctx = cv.getContext('2d');
    let parts = [], raf = 0, busy = false;
    function size() {
      const r = stage.getBoundingClientRect(), d = Math.min(devicePixelRatio || 1, 2);
      cv.width = r.width * d; cv.height = r.height * d; ctx.setTransform(d, 0, 0, d, 0, 0);
    }
    function loop() {
      const w = stage.clientWidth, h = stage.clientHeight;
      ctx.clearRect(0, 0, w, h);
      parts = parts.filter(p => p.y < h + 20 && p.life > 0);
      parts.forEach(p => {
        p.vy += .22; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.rot += p.vr; p.life--;
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
        ctx.fillStyle = p.c; ctx.globalAlpha = Math.min(1, p.life / 30);
        ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); ctx.restore();
      });
      raf = parts.length ? requestAnimationFrame(loop) : 0;
      if (!raf) ctx.clearRect(0, 0, w, h);
    }
    function confetti() {
      size();
      const w = stage.clientWidth, h = stage.clientHeight, cols = ['#22c55e', '#facc15', '#38bdf8', '#f472b6', '#a78bfa', '#fb923c'];
      const n = reduce ? 20 : 110;
      for (let i = 0; i < n; i++) {
        const a = -Math.PI / 2 + (Math.random() - .5) * 2.2, v = 5 + Math.random() * 7;
        parts.push({ x: w / 2, y: h / 2, vx: Math.cos(a) * v, vy: Math.sin(a) * v, w: 5 + Math.random() * 6, h: 3 + Math.random() * 5, rot: Math.random() * 6, vr: (Math.random() - .5) * .4, c: cols[i % cols.length], life: 110 + Math.random() * 60 });
      }
      if (!raf) raf = requestAnimationFrame(loop);
    }
    async function play() {
      if (busy) return; busy = true; btn.disabled = true;
      const t = reduce ? 1 : 1;
      const d = reduce ? 1 : 1;
      ring.animate([{ strokeDashoffset: 327 }, { strokeDashoffset: 0 }], { duration: 600 * t * d, easing: 'ease-out' });
      fill.animate([{ opacity: 0 }, { opacity: .18 }], { duration: 600 });
      check.animate([{ strokeDashoffset: 80 }, { strokeDashoffset: 80, offset: .45 }, { strokeDashoffset: 0 }], { duration: 900, easing: 'ease-out' });
      await new Promise(r => setTimeout(r, 750));
      all.animate([{ transform: 'scale(1)' }, { transform: 'scale(1.12)' }, { transform: 'scale(1)' }], { duration: 350, easing: 'ease-out' });
      confetti();
      await new Promise(r => setTimeout(r, 1200));
      busy = false; btn.disabled = false; btn.textContent = 'もう一度';
    }
    btn.addEventListener('click', e => { e.stopPropagation(); play(); });
    stage.addEventListener('click', play);
    addEventListener('resize', size);
  })();
})();
</script>
</body>
</html>
