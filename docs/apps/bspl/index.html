<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<title>個人事業 決算書(試作)</title>
<style>
:root{color-scheme:light dark;--bg:#f7f7f8;--panel:#fff;--border:#dcdce0;--text:#1c1c1f;--muted:#6b6b73;--accent:#2563eb;--accent-soft:#e8effd;--danger:#dc2626;--ok:#15803d;--warn-bg:#fff7e0;--warn:#8a5a00;--row:#f1f1f4;}
@media (prefers-color-scheme:dark){:root{--bg:#121214;--panel:#1c1c1f;--border:#33333a;--text:#ececf0;--muted:#9a9aa5;--accent:#6c9bff;--accent-soft:#1e2a44;--danger:#f87171;--ok:#4ade80;--warn-bg:#2d2410;--warn:#f3c969;--row:#26262b;}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html{-webkit-text-size-adjust:100%;}
body{margin:0;padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic",sans-serif;background:var(--bg);color:var(--text);line-height:1.55;font-variant-numeric:tabular-nums;}
header{max-width:720px;margin:0 auto;padding:12px 16px 4px;}
.back-link{display:inline-block;margin-bottom:4px;color:var(--muted);text-decoration:none;font-size:.85rem;}
.hrow{display:flex;align-items:center;gap:12px;justify-content:space-between;}
h1{margin:0;font-size:1.2rem;}
h2{margin:0 0 10px;font-size:1rem;}
h3{margin:14px 0 6px;font-size:.9rem;color:var(--muted);}
main{max-width:720px;margin:0 auto;padding:8px 16px calc(96px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px;}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:14px;}
label{display:block;font-size:.8rem;color:var(--muted);margin:10px 0 4px;}
input,select,textarea{width:100%;min-height:44px;padding:8px 10px;border:1px solid var(--border);border-radius:8px;background:var(--panel);color:var(--text);font-family:inherit;font-size:16px;}
input[type=date]{min-width:0;}
button{border:none;border-radius:8px;padding:10px 14px;min-height:44px;font-size:.95rem;cursor:pointer;background:var(--accent);color:#fff;font-family:inherit;}
button:disabled{opacity:.4;cursor:not-allowed;}
button.sec{background:transparent;color:var(--accent);border:1px solid var(--accent);}
button.dng{background:transparent;color:var(--danger);border:1px solid var(--danger);}
button.sm{min-height:36px;padding:6px 10px;font-size:.85rem;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.seg{display:flex;border:1px solid var(--border);border-radius:10px;overflow:hidden;}
.seg button{flex:1;background:transparent;color:var(--text);border-radius:0;min-height:44px;}
.seg button.on{background:var(--accent);color:#fff;}
.seg.mini{flex:0 0 auto;}
.seg.mini button{min-width:48px;padding:6px 10px;}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;}
.chips button{min-height:36px;padding:4px 12px;background:var(--accent-soft);color:var(--accent);}
.hint{font-size:.78rem;color:var(--muted);margin:6px 0 0;}
.preview{margin-top:12px;padding:10px 12px;border-radius:8px;background:var(--accent-soft);font-size:.9rem;}
.preview .pl{display:flex;justify-content:space-between;gap:8px;}
.preview .tag{color:var(--muted);margin-right:6px;}
.warn{background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:10px 12px;font-size:.85rem;}
.err{color:var(--danger);font-size:.85rem;margin-top:8px;}
.ok{color:var(--ok);}
.actions{display:flex;gap:10px;margin-top:14px;}
.actions button{flex:1;}
.jrow{display:grid;grid-template-columns:1fr auto;gap:8px;padding:10px 0;border-bottom:1px solid var(--border);}
.jrow .sel{grid-column:1 / -1;}
.jrow .r2{display:flex;gap:8px;align-items:center;grid-column:1 / -1;}
.jrow .r2 input{flex:1;min-width:0;text-align:right;}
.jrow .x{background:transparent;color:var(--muted);border:1px solid var(--border);min-width:44px;padding:0;}
.jtot{display:flex;justify-content:space-between;gap:8px;margin-top:10px;font-size:.9rem;}
.entry{border:1px solid var(--border);border-radius:10px;background:var(--panel);padding:10px 12px;}
.eh{display:flex;gap:8px;align-items:baseline;}
.eh .d{color:var(--muted);font-size:.85rem;flex:0 0 auto;}
.eh .ds{flex:1;font-weight:600;overflow-wrap:anywhere;}
.eh .am{flex:0 0 auto;}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px;font-size:.85rem;}
.cols .ct{color:var(--muted);font-size:.72rem;}
.cols .ln{display:flex;justify-content:space-between;gap:6px;}
.ea{display:flex;gap:8px;margin-top:8px;justify-content:flex-end;}
.list{display:flex;flex-direction:column;gap:8px;}
.tbl{width:100%;border-collapse:collapse;font-size:.85rem;}
.tbl th,.tbl td{padding:7px 6px;border-bottom:1px solid var(--border);text-align:right;}
.tbl th:first-child,.tbl td:first-child{text-align:left;}
.tbl th{font-weight:600;color:var(--muted);font-size:.75rem;}
.tbl tr.sec td{background:var(--row);font-weight:700;text-align:left;}
.tbl tr.sub td{font-weight:700;}
.tbl tr.tot td{font-weight:700;border-top:2px solid var(--text);}
.tbl tr.click{cursor:pointer;}
.tbl tr.click:active{background:var(--accent-soft);}
.tbl .ind{padding-left:18px;}
.tbl .small{font-size:.72rem;color:var(--muted);}
.z{color:var(--muted);}
.neg{color:var(--danger);}
.scroll{overflow-x:auto;}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--border);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:10;}
nav.tabs button{flex:1;background:transparent;color:var(--muted);border-radius:0;min-height:54px;padding:4px 2px;font-size:.72rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;}
nav.tabs button span{font-size:1.2rem;line-height:1;}
nav.tabs button.on{color:var(--accent);font-weight:700;}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center;}
.overlay[hidden]{display:none;}
.sheet{background:var(--panel);width:100%;max-width:720px;max-height:86vh;overflow:auto;border-radius:14px 14px 0 0;padding:14px 14px calc(14px + env(safe-area-inset-bottom));}
.toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:20px;font-size:.9rem;z-index:30;opacity:0;pointer-events:none;transition:opacity .2s;}
.toast.show{opacity:.95;}
.filters{display:grid;grid-template-columns:1fr 2fr;gap:10px;}
.stmt-title{text-align:center;font-weight:700;margin:4px 0 8px;}
.note{font-size:.78rem;color:var(--muted);line-height:1.6;}
.note li{margin-bottom:4px;}
.opline{display:grid;grid-template-columns:1fr 130px;gap:8px;align-items:center;padding:4px 0;border-bottom:1px solid var(--border);}
.opline input{text-align:right;}
.rbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.rimg{display:block;max-width:100%;max-height:180px;object-fit:contain;margin:10px 0;border-radius:8px;border:1px solid var(--border);cursor:zoom-in;}
.ritems{font-size:.82rem;margin-top:8px;}
.ritems .ln{display:flex;justify-content:space-between;gap:8px;padding:2px 0;border-bottom:1px dashed var(--border);}
.ritems .ln span:first-child{overflow-wrap:anywhere;}
@media print{
  body{background:#fff;color:#000;}
  header,nav.tabs,.noprint,.toast,.overlay{display:none !important;}
  main{max-width:none;padding:0;}
  .panel{border:none;padding:0;}
}
</style>
</head>

<!-- ===== 会計の計算部分(画面に依存しない) ===== -->
<script id="core">
(function(root){
'use strict';
var A=function(id,name,group,normal,extra){return Object.assign({id:id,name:name,group:group,normal:normal},extra||{});};
var BASE=[
  A('cash','現金','asset','D'),A('chk','当座預金','asset','D'),A('tdep','定期預金','asset','D'),
  A('dep','普通預金','asset','D'),A('notesR','受取手形','asset','D'),A('ar','売掛金','asset','D'),
  A('sec','有価証券','asset','D'),A('inv','棚卸資産','asset','D',{sys:true}),A('prepaid','前払金','asset','D'),
  A('loanR','貸付金','asset','D'),A('bldg','建物','asset','D'),A('bldgAcc','建物附属設備','asset','D'),
  A('mach','機械装置','asset','D'),A('veh','車両運搬具','asset','D'),A('tools','工具器具備品','asset','D'),
  A('land','土地','asset','D'),
  A('ownerD','事業主貸','ownerD','D',{noOpen:true}),
  A('notesP','支払手形','liab','C'),A('ap','買掛金','liab','C'),A('borrow','借入金','liab','C'),
  A('accrued','未払金','liab','C'),A('advR','前受金','liab','C'),A('deposit','預り金','liab','C'),
  A('allowance','貸倒引当金','liab','C'),
  A('ownerC','事業主借','ownerC','C',{noOpen:true}),
  A('capital','元入金','capital','C',{sys:true,noOpen:true}),
  A('sales','売上高','rev','C'),A('misc','雑収入','rev','C'),
  A('purchase','仕入高','cogs','D'),
  A('tax','租税公課','exp','D'),A('freight','荷造運賃','exp','D'),A('util','水道光熱費','exp','D'),
  A('travel','旅費交通費','exp','D'),A('comm','通信費','exp','D'),A('ad','広告宣伝費','exp','D'),
  A('ent','接待交際費','exp','D'),A('ins','損害保険料','exp','D'),A('repair','修繕費','exp','D'),
  A('supply','消耗品費','exp','D'),A('deprec','減価償却費','exp','D'),A('welfare','福利厚生費','exp','D'),
  A('wage','給料賃金','exp','D'),A('outsrc','外注工賃','exp','D'),A('interest','利子割引料','exp','D'),
  A('rent','地代家賃','exp','D'),A('baddebt','貸倒金','exp','D'),
  A('miscExp','雑費','exp','D'),
  A('allowOut','貸倒引当金戻入額','resOut','C'),A('allowIn','貸倒引当金繰入額','resIn','D'),
  A('familyWage','専従者給与','family','D')
];
var MAX_CUSTOM=6;

function getAccounts(store){
  var custom=(store&&store.custom)||[];var out=[];
  BASE.forEach(function(a){
    if(a.id==='miscExp'){custom.forEach(function(c){out.push({id:c.id,name:c.name,group:'exp',normal:'D',custom:true});});}
    out.push(a);
  });
  return out;
}
function accountMap(store){var m={};getAccounts(store).forEach(function(a){m[a.id]=a;});return m;}
function selectGroups(store,pred){
  var defs=[['資産',['asset']],['負債',['liab']],['事業主勘定',['ownerD','ownerC']],['収入',['rev']],['売上原価',['cogs']],['経費',['exp']],['引当金',['resOut','resIn']],['専従者給与',['family']]];
  var accts=getAccounts(store).filter(function(a){return !a.sys&&(!pred||pred(a));});
  return defs.map(function(d){return {label:d[0],accts:accts.filter(function(a){return d[1].indexOf(a.group)>=0;})};}).filter(function(g){return g.accts.length;});
}
var DEFAULT_USER={id:'000001',name:'坂口誠税理士事務所',address:'神戸市中央区小野柄通3-2-22-7F'};
function utf8Bytes(str){
  var out=[];
  if(typeof TextEncoder!=='undefined'){return Array.prototype.slice.call(new TextEncoder().encode(str));}
  var e=unescape(encodeURIComponent(str));
  for(var i=0;i<e.length;i++)out.push(e.charCodeAt(i));
  return out;
}
var SHA_K=(function(){
  var k=[],n=2,c=0;
  while(c<64){var p=true;for(var i=2;i*i<=n;i++){if(n%i===0){p=false;break;}}
    if(p){k.push(Math.floor((Math.pow(n,1/3)%1)*4294967296)>>>0);c++;}n++;}
  return k;
})();
function sha256Hex(str){
  var b=utf8Bytes(String(str));var l=b.length;
  b.push(0x80);while(b.length%64!==56)b.push(0);
  var hi=Math.floor(l/536870912),lo=(l*8)>>>0;
  b.push((hi>>>24)&255,(hi>>>16)&255,(hi>>>8)&255,hi&255,(lo>>>24)&255,(lo>>>16)&255,(lo>>>8)&255,lo&255);
  var H=[],n=2,c=0;
  while(c<8){var p=true;for(var i=2;i*i<=n;i++){if(n%i===0){p=false;break;}}
    if(p){H.push(Math.floor((Math.sqrt(n)%1)*4294967296)>>>0);c++;}n++;}
  var rot=function(x,r){return (x>>>r)|(x<<(32-r));};
  for(var o=0;o<b.length;o+=64){
    var w=[];
    for(var t=0;t<16;t++)w[t]=((b[o+4*t]<<24)|(b[o+4*t+1]<<16)|(b[o+4*t+2]<<8)|b[o+4*t+3])>>>0;
    for(t=16;t<64;t++){
      var s0=rot(w[t-15],7)^rot(w[t-15],18)^(w[t-15]>>>3);
      var s1=rot(w[t-2],17)^rot(w[t-2],19)^(w[t-2]>>>10);
      w[t]=(w[t-16]+s0+w[t-7]+s1)>>>0;
    }
    var a=H[0],bb=H[1],cc=H[2],d=H[3],e=H[4],f=H[5],g=H[6],h=H[7];
    for(t=0;t<64;t++){
      var S1=rot(e,6)^rot(e,11)^rot(e,25);
      var ch=(e&f)^(~e&g);
      var t1=(h+S1+ch+SHA_K[t]+w[t])>>>0;
      var S0=rot(a,2)^rot(a,13)^rot(a,22);
      var mj=(a&bb)^(a&cc)^(bb&cc);
      var t2=(S0+mj)>>>0;
      h=g;g=f;f=e;e=(d+t1)>>>0;d=cc;cc=bb;bb=a;a=(t1+t2)>>>0;
    }
    H[0]=(H[0]+a)>>>0;H[1]=(H[1]+bb)>>>0;H[2]=(H[2]+cc)>>>0;H[3]=(H[3]+d)>>>0;
    H[4]=(H[4]+e)>>>0;H[5]=(H[5]+f)>>>0;H[6]=(H[6]+g)>>>0;H[7]=(H[7]+h)>>>0;
  }
  return H.map(function(x){return ('00000000'+x.toString(16)).slice(-8);}).join('');
}
function userDigest(u){return sha256Hex(JSON.stringify(['bspl-user-v1',u.id,u.name,u.address,u.registeredAt]));}
function makeUser(id,name,address,registeredAt){
  var u={id:String(id),name:String(name),address:String(address),registeredAt:registeredAt||new Date().toISOString()};
  u.hash=userDigest(u);return u;
}
function verifyUser(u){return !!(u&&typeof u.hash==='string'&&u.hash===userDigest(u));}
function ensureUsers(s){
  if(!Array.isArray(s.users))s.users=[];
  if(!s.users.some(function(u){return u.id===DEFAULT_USER.id;}))s.users.unshift(makeUser(DEFAULT_USER.id,DEFAULT_USER.name,DEFAULT_USER.address));
  if(!s.currentUser||!s.users.some(function(u){return u.id===s.currentUser;}))s.currentUser=s.users[0].id;
  return s;
}
function emptyStore(){return ensureUsers({v:1,entries:[],openings:{},years:{},custom:[],meta:{lastBackup:null},users:[],currentUser:null});}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function validDate(s){
  if(typeof s!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(s))return false;
  var p=s.split('-').map(Number);var d=new Date(p[0],p[1]-1,p[2]);
  return d.getFullYear()===p[0]&&d.getMonth()===p[1]-1&&d.getDate()===p[2];
}
function yearOf(date){return String(date).slice(0,4);}
function normalizeStore(o){
  var s=emptyStore();
  if(!o||typeof o!=='object')return s;
  if(Array.isArray(o.entries)){
    s.entries=o.entries.filter(function(e){return e&&Array.isArray(e.lines)&&validDate(e.date);}).map(function(e){
      return {id:String(e.id||uid()),uid:String(e.uid||DEFAULT_USER.id),ts:Number(e.ts)||0,date:e.date,desc:String(e.desc||'').slice(0,200),src:e.src||'manual',
        lines:e.lines.map(function(l){return {acct:String(l.acct),side:l.side==='C'?'C':'D',amount:Math.round(Number(l.amount))||0};})};
    });
  }
  if(o.openings&&typeof o.openings==='object'){
    Object.keys(o.openings).forEach(function(y){
      var m={};var src=o.openings[y]||{};
      Object.keys(src).forEach(function(k){var v=Math.round(Number(src[k]));if(v)m[k]=v;});
      s.openings[y]=m;
    });
  }
  if(o.years&&typeof o.years==='object'){
    Object.keys(o.years).forEach(function(y){
      var c=o.years[y]||{};
      s.years[y]={endInv:Math.round(Number(c.endInv))||0,deduction:(c.deduction===undefined||c.deduction===null)?650000:(Math.round(Number(c.deduction))||0)};
    });
  }
  if(Array.isArray(o.custom)){
    s.custom=o.custom.filter(function(c){return c&&c.id&&c.name;}).slice(0,MAX_CUSTOM).map(function(c){return {id:String(c.id),name:String(c.name).slice(0,20)};});
  }
  if(o.meta&&o.meta.lastBackup)s.meta.lastBackup=o.meta.lastBackup;
  if(Array.isArray(o.users)){
    var seen={};
    var us=o.users.filter(function(u){return u&&u.id&&u.name&&!seen[u.id]&&(seen[u.id]=1);}).slice(0,50).map(function(u){
      return {id:String(u.id),name:String(u.name).slice(0,100),address:String(u.address||'').slice(0,200),registeredAt:String(u.registeredAt||''),hash:String(u.hash||'')};
    });
    s.users=us;s.currentUser=o.currentUser?String(o.currentUser):null;
  }else{s.users=[];s.currentUser=null;}
  return ensureUsers(s);
}
function yearCfg(store,year){
  var c=(store.years&&store.years[year])||{};
  return {endInv:c.endInv||0,deduction:(c.deduction===undefined||c.deduction===null)?650000:c.deduction};
}
function entriesOfYear(store,year){return store.entries.filter(function(e){return yearOf(e.date)===String(year);});}
function sum(arr,f){return arr.reduce(function(t,x){return t+f(x);},0);}

function computeLedger(store,year){
  year=String(year);
  var accts=getAccounts(store);var op=(store.openings&&store.openings[year])||{};var cfg=yearCfg(store,year);var L={};
  accts.forEach(function(a){L[a.id]={id:a.id,name:a.name,group:a.group,normal:a.normal,open:a.noOpen?0:(op[a.id]||0),d:0,c:0,bal:0};});
  entriesOfYear(store,year).forEach(function(e){e.lines.forEach(function(l){
    var r=L[l.acct];if(!r)return;if(l.side==='D')r.d+=l.amount;else r.c+=l.amount;
  });});
  accts.forEach(function(a){var r=L[a.id];r.bal=a.normal==='D'?r.open+r.d-r.c:r.open+r.c-r.d;});
  L.inv.bal=cfg.endInv;
  var aOpen=sum(accts.filter(function(a){return a.group==='asset';}),function(a){return L[a.id].open;});
  var lOpen=sum(accts.filter(function(a){return a.group==='liab';}),function(a){return L[a.id].open;});
  L.capital.open=aOpen-lOpen;L.capital.bal=L.capital.open;
  return L;
}
function computePL(store,year){
  var L=computeLedger(store,year);var cfg=yearCfg(store,year);var accts=getAccounts(store);
  var sales=L.sales.bal,misc=L.misc.bal,revenue=sales+misc;
  var openInv=L.inv.open,purchase=L.purchase.bal,subtotal=openInv+purchase,endInv=cfg.endInv,cogs=subtotal-endInv;
  var gross=revenue-cogs;
  var expenses=accts.filter(function(a){return a.group==='exp';}).map(function(a){return {id:a.id,name:a.name,amount:L[a.id].bal};});
  var expTotal=sum(expenses,function(x){return x.amount;});
  var net1=gross-expTotal;

    (S.mode==='simple'?(S.simple.kind==='out'?rcptPanel():'')+simpleForm():journalForm())+recentList();
}
function rcptPanel(){
  var R=S.rcpt;var h='<div class="panel"><h2>📷 レシートから入力</h2>';
  if(!R){
    return h+'<div class="rbtns"><button data-act="pickCam">撮影する</button><button class="sec" data-act="pickLib">写真から選ぶ</button></div>'+
      '<div class="hint">'+(gget('key')?'AIが読み取った内容を下の入力欄に入れます。写真は保存しません。':'使うには、「設定」でAPIキーの登録が必要です。')+'</div></div>';
  }
  h+='<img class="rimg" src="'+R.img+'" alt="レシートの写真" data-act="rcptZoom">';
  if(R.state==='busy'||R.state==='idle')return h+'<div class="hint">読み取り中です…(数秒かかります)</div></div>';
  if(R.state==='error'){
    return h+'<div class="err">'+esc(R.msg)+'</div><div class="actions"><button class="sec" data-act="rcptDrop">破棄</button><button data-act="rcptRetry">'+(gget('key')?'もう一度読み取る':'設定を開く')+'</button></div></div>';
  }
  var r=R.r;
  h+='<div class="hint" style="margin:0">下の入力欄に反映しました。<b>写真と見比べて確認</b>してから保存してください。</div>';
  if(r.items.length){
    h+='<div class="ritems">'+r.items.slice(0,10).map(function(x){return '<div class="ln"><span>'+esc(x.name||'(品名なし)')+'</span><span>'+fmt(x.amount)+'</span></div>';}).join('')+
      (r.items.length>10?'<div class="hint">ほか'+(r.items.length-10)+'行</div>':'')+'</div>';
  }
  if(r.sumDiff!==null){
    h+='<div class="hint">内訳の合計 '+fmt(r.itemsSum)+'円 / 合計 '+fmt(r.total)+'円 '+(r.sumDiff===0?'<span class="ok">(一致)</span>':'(差 '+fmt(r.sumDiff)+'円。外税表示や値引きの場合は正常なこともあります)')+'</div>';
  }
  if(r.warn.length)h+='<div class="warn" style="margin-top:8px">'+r.warn.map(esc).join('<br>')+'</div>';
  if(r.note)h+='<div class="hint">AIのメモ: '+esc(r.note)+'</div>';
  return h+'<div class="actions"><button class="sec" data-act="rcptDrop">破棄</button></div></div>';
}

/* ---------- 仕訳帳タブ ---------- */
function entryCard(e){
  var total=0;e.lines.forEach(function(l){if(l.side==='D')total+=l.amount;});
  var col=function(side){return e.lines.filter(function(l){return l.side===side;}).map(function(l){return '<div class="ln"><span>'+esc(nameOf(l.acct))+'</span><span>'+fmt(l.amount)+'</span></div>';}).join('');};
  return '<div class="entry"><div class="eh"><span class="d">'+e.date.slice(5).replace('-','/')+'</span><span class="ds">'+(e.src==='receipt'?'📷 ':'')+esc(e.desc||'(摘要なし)')+'</span><span class="am">'+fmt(total)+'</span></div>'+
    '<div class="cols"><div><div class="ct">借方</div>'+col('D')+'</div><div><div class="ct">貸方</div>'+col('C')+'</div></div>'+
    '<div class="ea"><button class="sec sm" data-act="edit" data-id="'+esc(e.id)+'">編集</button><button class="dng sm" data-act="del" data-id="'+esc(e.id)+'">削除</button></div></div>';
}
function journalListHtml(){
  var q=S.q.trim().toLowerCase();
  var es=B.entriesOfYear(store,S.year).filter(function(e){
    if(S.month!=='all'&&e.date.slice(5,7)!==S.month)return false;
    if(!q)return true;
    return (e.desc||'').toLowerCase().indexOf(q)>=0||e.lines.some(function(l){return nameOf(l.acct).toLowerCase().indexOf(q)>=0;});
  }).sort(function(a,b){return a.date<b.date?1:a.date>b.date?-1:b.ts-a.ts;});
  if(!es.length)return '<div class="panel"><div class="hint">該当する仕訳はありません。</div></div>';
  return '<div class="hint">'+es.length+'件</div><div class="list">'+es.map(entryCard).join('')+'</div>';
}
function viewJournal(){
  var months=['all'].concat(['01','02','03','04','05','06','07','08','09','10','11','12']);
  return '<div class="filters"><div><label>月</label><select data-f="f.month">'+months.map(function(m){return '<option value="'+m+'"'+(m===S.month?' selected':'')+'>'+(m==='all'?'全期間':parseInt(m,10)+'月')+'</option>';}).join('')+'</select></div>'+
    '<div><label>検索(摘要・科目)</label><input type="text" data-f="f.q" value="'+esc(S.q)+'"></div></div>'+
    '<div id="jList">'+journalListHtml()+'</div>';
}

/* ---------- 試算表タブ ---------- */
function viewTB(){
  var L=B.computeLedger(store,S.year);var accts=B.getAccounts(store);
  var defs=[['資産',['asset']],['事業主勘定',['ownerD','ownerC']],['負債',['liab']],['元入金',['capital']],['収入',['rev']],['売上原価',['cogs']],['経費',['exp']],['引当金',['resOut','resIn']],['専従者給与',['family']]];
  var rows='';var td=0,tc=0;
  accts.forEach(function(a){td+=L[a.id].d;tc+=L[a.id].c;});
  defs.forEach(function(g){
    var list=accts.filter(function(a){return g[1].indexOf(a.group)>=0;}).filter(function(a){var r=L[a.id];return r.open||r.d||r.c||r.bal;});
    if(!list.length)return;
    rows+='<tr class="sec"><td colspan="5">'+g[0]+'</td></tr>';
    list.forEach(function(a){
      var r=L[a.id];var bs=['asset','liab','capital'].indexOf(a.group)>=0;
      rows+='<tr class="click" data-act="ledger" data-id="'+a.id+'"><td>'+esc(a.name)+(a.id==='inv'?'<div class="small">期末は設定の棚卸高</div>':'')+'</td><td>'+(bs?fz(r.open):'')+'</td><td>'+fz(r.d)+'</td><td>'+fz(r.c)+'</td><td>'+fz(r.bal)+'</td></tr>';
    });
  });
  if(!rows)rows='<tr><td colspan="5" class="hint">まだデータがありません。</td></tr>';
  var bs=B.computeBS(store,S.year);
  return '<div class="panel"><h2>試算表('+S.year+'年)</h2><div class="hint" style="margin:0 0 8px">行をタップすると、その科目の元帳(明細)を見られます。</div>'+
    '<div class="scroll"><table class="tbl"><thead><tr><th>科目</th><th>期首</th><th>借方</th><th>貸方</th><th>期末</th></tr></thead><tbody>'+rows+
    '<tr class="tot"><td>借方・貸方の合計</td><td></td><td>'+fmt(td)+'</td><td>'+fmt(tc)+'</td><td></td></tr></tbody></table></div>'+
    '<div class="jtot"><span>借方=貸方</span><span class="'+(td===tc?'ok':'err')+'">'+(td===tc?'✓ 一致':'不一致')+'</span></div>'+
    '<div class="jtot"><span>貸借対照表の貸借</span><span class="'+(bs.diff===0?'ok':'err')+'">'+(bs.diff===0?'✓ 一致':'差額 '+fmt(bs.diff))+'</span></div></div>';
}
function openLedger(id){
  var L=B.computeLedger(store,S.year);var a=L[id];if(!a)return;
  var es=B.entriesOfYear(store,S.year).filter(function(e){return e.lines.some(function(l){return l.acct===id;});}).sort(function(x,y){return x.date<y.date?-1:x.date>y.date?1:x.ts-y.ts;});
  var bal=a.open;var rows='';
  if(a.open)rows+='<tr><td colspan="2">前期繰越</td><td></td><td></td><td>'+fmt(bal)+'</td></tr>';
  es.forEach(function(e){
    var mine=e.lines.filter(function(l){return l.acct===id;});var d=0,c=0;
    mine.forEach(function(l){if(l.side==='D')d+=l.amount;else c+=l.amount;});
    bal+=a.normal==='D'?d-c:c-d;
    var others=e.lines.filter(function(l){return l.acct!==id;}).map(function(l){return nameOf(l.acct);});
    var uniq=others.filter(function(x,i){return others.indexOf(x)===i;});
    rows+='<tr><td>'+e.date.slice(5).replace('-','/')+'</td><td>'+esc(uniq.length>1?'諸口':(uniq[0]||''))+(e.desc?'<div class="small">'+esc(e.desc)+'</div>':'')+'</td><td>'+(d?fmt(d):'')+'</td><td>'+(c?fmt(c):'')+'</td><td>'+fmt(bal)+'</td></tr>';
  });
  if(id==='inv')rows+='<tr><td colspan="4">期末棚卸高(設定の値)</td><td>'+fmt(a.bal)+'</td></tr>';
  $('sheet').innerHTML='<h2>'+esc(a.name)+'の元帳('+S.year+'年)</h2><div class="scroll"><table class="tbl"><thead><tr><th>日付</th><th>相手科目</th><th>借方</th><th>貸方</th><th>残高</th></tr></thead><tbody>'+(rows||'<tr><td colspan="5" class="hint">明細はありません。</td></tr>')+'</tbody></table></div>'+
    '<div class="actions"><button data-act="closeSheet">閉じる</button></div>';
  $('overlay').hidden=false;
}

/* ---------- 決算書タブ ---------- */
function r1(label,amount,cls,ind){return '<tr'+(cls?' class="'+cls+'"':'')+'><td'+(ind?' class="ind"':'')+'>'+label+'</td><td>'+fz(amount)+'</td></tr>';}
function plHtml(){
  var p=B.computePL(store,S.year);
  var h='<div class="stmt-title">損益計算書(青色申告決算書 1面)<br><span class="small">'+S.year+'年1月1日〜12月31日</span></div><table class="tbl"><thead><tr><th>項目</th><th>金額(円)</th></tr></thead><tbody>';
  h+=r1('売上(収入)金額(雑収入を含む)',p.revenue,'sub');
  h+='<tr><td class="ind small">うち 売上高 '+fmt(p.sales)+' / 雑収入 '+fmt(p.misc)+'</td><td></td></tr>';
  h+='<tr class="sec"><td colspan="2">売上原価</td></tr>';
  h+=r1('期首商品(製品)棚卸高',p.openInv,'',1)+r1('仕入金額(製品製造原価)',p.purchase,'',1)+r1('小計',p.subtotal,'',1)+r1('期末商品(製品)棚卸高',p.endInv,'',1)+r1('差引原価',p.cogs,'sub',1);
  h+=r1('差引金額',p.gross,'sub');
  h+='<tr class="sec"><td colspan="2">経費</td></tr>';
  p.expenses.forEach(function(x){h+=r1(esc(x.name),x.amount,'',1);});
  h+=r1('経費計',p.expTotal,'sub');
  h+=r1('差引金額',p.net1,'sub');
  h+='<tr class="sec"><td colspan="2">各種引当金・準備金等</td></tr>';
  h+=r1('繰戻額等(貸倒引当金戻入額)',p.reverse,'',1)+r1('繰入額等(貸倒引当金繰入額)',p.reserveIn,'',1);
  h+=r1('専従者給与',p.family,'sub');
  h+=r1('青色申告特別控除前の所得金額',p.preDeduction,'sub');
  h+=r1('青色申告特別控除額',p.deduction,'');
  if(p.deduction<p.deductionSel)h+='<tr><td class="ind small" colspan="2">選択した控除額 '+fmt(p.deductionSel)+'円は、控除前の所得金額が上限のため '+fmt(p.deduction)+'円</td></tr>';
  h+=r1('所得金額',p.income,'tot');
  return h+'</tbody></table>';
}
function bsHtml(){
  var b=B.computeBS(store,S.year);
  var head='<thead><tr><th>科目</th><th>期首(1/1)</th><th>期末(12/31)</th></tr></thead>';
  var r3=function(label,o,c,cls){return '<tr'+(cls?' class="'+cls+'"':'')+'><td>'+label+'</td><td>'+(o===null?'':fz(o))+'</td><td>'+(c===null?'':fz(c))+'</td></tr>';};
  var h='<div class="stmt-title">貸借対照表(青色申告決算書 4面)<br><span class="small">'+S.year+'年</span></div>';
  h+='<table class="tbl">'+head+'<tbody><tr class="sec"><td colspan="3">資産の部</td></tr>';
  b.assets.forEach(function(x){h+=r3(esc(x.name),x.open,x.close);});
  h+=r3('事業主貸',null,b.ownerD);
  h+=r3('合計',b.aOpen,b.aClose,'tot')+'</tbody></table>';
  h+='<table class="tbl" style="margin-top:14px">'+head+'<tbody><tr class="sec"><td colspan="3">負債・資本の部</td></tr>';
  b.liabs.forEach(function(x){h+=r3(esc(x.name),x.open,x.close);});
  h+=r3('事業主借',null,b.ownerC)+r3('元入金',b.capital,b.capital)+r3('青色申告特別控除前の所得金額',null,b.pre);
  h+=r3('合計',b.lOpen,b.lClose,'tot')+'</tbody></table>';
  h+='<div class="jtot"><span>資産合計と負債・資本合計</span><span class="'+(b.diff===0?'ok':'err')+'">'+(b.diff===0?'✓ 一致':'差額 '+fmt(b.diff))+'</span></div>';
  return h;
}
function viewStmt(){
  return '<div class="seg noprint"><button data-act="stmt" data-v="pl" class="'+(S.stmt==='pl'?'on':'')+'">損益計算書</button><button data-act="stmt" data-v="bs" class="'+(S.stmt==='bs'?'on':'')+'">貸借対照表</button></div>'+
    '<div class="panel">'+(S.stmt==='pl'?plHtml():bsHtml())+'</div>'+
    '<div class="noprint"><button class="sec" data-act="print" style="width:100%">印刷 / PDFに保存</button></div>'+
    '<div class="note noprint">科目の並びは青色申告決算書(一般用)に合わせています。提出用の様式への転記・最終確認は、国税庁の様式と照らして行ってください。</div>';
}

  var L=B.computeLedger(store,S.year);return fmt(L.capital.open);
}

  if(!u)return '';

  return '<div class="panel"><h2>利用者情報</h2>'+
    '<div class="opline"><span>利用者ID</span><b>'+esc(u.id)+'</b></div>'+
    '<div class="opline"><span>名称</span><b>'+esc(u.name)+'</b></div>'+
    '<div class="opline"><span>住所</span><b>'+esc(u.address)+'</b></div>'+
    '<div class="opline"><span>登録日時</span><span>'+esc(u.registeredAt.slice(0,19).replace('T',' '))+' (UTC)</span></div>'+
    '<div class="opline"><span>検証コード</span><code style="font-size:.7rem;word-break:break-all">'+esc(u.hash.slice(0,16))+'…</code></div>'+
    '<div id="userChk" class="hint" style="margin:6px 0">'+(ok?'':'⚠ 登録情報が変更されています。')+'</div>'+

}

  var assets=accts.filter(function(a){return a.group==='asset'&&!a.noOpen;}).map(line).join('');
  var liabs=accts.filter(function(a){return a.group==='liab'&&!a.noOpen;}).map(line).join('');

  return userPanel()+'<div class="panel"><h2>'+S.year+'年分の設定</h2>'+
    '<label>期末棚卸高(売上原価の計算に使います)</label><input type="text" inputmode="numeric" data-f="cfg.endInv" value="'+(cfg.endInv?cfg.endInv:'')+'" placeholder="0">'+

    '<div class="hint">控除額は、控除前の所得金額を超えない範囲で自動的に調整します。どの額が使えるかは要件(帳簿・電子申告など)で決まります。</div></div>'+
    '<div class="panel"><h2>レシート読み取り(AI)</h2>'+
    '<div class="hint" style="margin:0 0 4px">GoogleのGemini API(無料枠)を使います。キーは Google AI Studio(aistudio.google.com/apikey)で作成します。作成後に「制限を追加」から「Gemini API のみに制限」を設定してください(未設定だと拒否される場合があります)。</div>'+
    '<label>APIキー</label><input type="password" autocomplete="off" autocapitalize="off" spellcheck="false" data-f="g.key" value="'+esc(gget('key'))+'" placeholder="AIza…">'+

    '<div class="hint">キーはこの端末のブラウザにだけ保存し、バックアップには含めません。パスワードと同様に他人へ渡さないでください。写真は読み取りのためGoogleへ送信され、無料枠では製品改善に使われる場合があります。顧客の書類や、個人情報が写るものには使わないでください。</div>'+
    '<div style="margin-top:8px"><button class="dng sm" data-act="clearKey">キーを消去</button></div></div>'+
    '<div class="panel"><h2>期首残高(1月1日)</h2><div class="hint" style="margin:0 0 8px">前年末の残高を入れます。元入金は自動計算です(資産 − 負債)。</div>'+
    '<div class="jtot" style="margin:0 0 6px"><span>元入金(自動)</span><span id="capLive">'+capitalText()+'</span></div>'+
    '<button class="sec sm" data-act="carry"'+(prevHas?'':' disabled')+'>前年の期末から引き継ぐ</button>'+
    '<h3>資産</h3>'+assets+'<h3>負債</h3>'+liabs+'</div>'+
    '<div class="panel"><h2>経費科目の追加</h2><div class="hint" style="margin:0 0 8px">決算書の空欄の経費行に使います(最大'+B.MAX_CUSTOM+'つ)。</div>'+custom+

    '<div class="panel"><h2>バックアップ</h2>'+
    '<div class="hint" style="margin:0 0 8px">データはこの端末のブラウザの中にだけ保存されます。ブラウザのデータ消去や端末の変更で失われるため、定期的にファイルへ保存してください。'+(store.meta.lastBackup?'<br>前回: '+esc(store.meta.lastBackup.slice(0,10)):'')+'</div>'+

    '<li>レシートの読み取りはAIが行います。読み違いがあるため、必ず写真と見比べて確認してください。</li></ul></div>';
}

/* ---------- 全体の描画 ---------- */
function needBackup(){
  if(!store.entries.length)return false;
  if(!store.meta.lastBackup)return true;
  return Date.now()-Date.parse(store.meta.lastBackup)>30*86400000;
}
function render(){
  renderYear();
  Array.prototype.forEach.call(document.querySelectorAll('#tabs button'),function(b){b.classList.toggle('on',b.dataset.v===S.tab);});
  var v={input:viewInput,journal:viewJournal,tb:viewTB,stmt:viewStmt,set:viewSet}[S.tab]();
  var banner=needBackup()&&S.tab!=='set'?'<div class="warn noprint">バックアップが未保存か、1か月以上前です。「設定」からファイルに保存しておくと安心です。</div>':'';
  $('app').innerHTML=banner+v;
}
function refreshSimple(){
  var p=simplePreview();$('prevBox').innerHTML=previewHtml(p);$('saveS').disabled=!!p.msg;
}
function refreshJournal(){
  var t=journalTotals();$('jTot').innerHTML=totalsHtml(t);$('saveJ').disabled=!t.v.ok;
}

/* ---------- 入力の反映 ---------- */
function setField(path,val){
  var p=path.split('.');
  if(p[0]==='s'){S.simple[p[1]]=val;if($('prevBox'))refreshSimple();return;}
  if(p[0]==='d'){
    if(p[1]==='l'){S.draft.lines[+p[2]][p[3]]=val;}else{S.draft[p[1]]=val;}
    if($('jTot'))refreshJournal();return;
  }
  if(p[0]==='f'){
    if(p[1]==='month')S.month=val;else S.q=val;
    $('jList').innerHTML=journalListHtml();return;
  }
  if(p[0]==='g'){gset(p[1],String(val).trim());return;}
  if(p[0]==='cfg'){
    var c=store.years[S.year]||(store.years[S.year]={endInv:0,deduction:650000});
    if(p[1]==='endInv')c.endInv=B.parseYen(val);else c.deduction=parseInt(val,10)||0;
    save();return;
  }
  if(p[0]==='op'){
    var o=store.openings[S.year]||(store.openings[S.year]={});
    var n=B.parseYen(val);if(n)o[p[1]]=n;else delete o[p[1]];
    save();var el=$('capLive');if(el)el.textContent=capitalText();return;
  }
}
function onField(e){var f=e.target&&e.target.dataset&&e.target.dataset.f;if(f)setField(f,e.target.value);}
document.addEventListener('input',onField);
document.addEventListener('change',onField);
$('yearSel').addEventListener('change',function(e){S.year=e.target.value;render();});

function saveEntry(entry){
  var v=B.validateEntry(entry,store);
  if(!v.ok){toast(v.msg);return false;}
  entry.uid=store.currentUser;
  if(S.editId){
    var i=store.entries.findIndex(function(x){return x.id===S.editId;});
    if(i>=0){entry.id=store.entries[i].id;entry.ts=store.entries[i].ts;entry.uid=store.entries[i].uid||store.currentUser;store.entries[i]=entry;}
    else store.entries.push(entry);
  }else store.entries.push(entry);
  S.year=B.yearOf(entry.date);
  save();return true;
}
function download(name,text,type){
  var blob=new Blob([text],{type:type});var url=URL.createObjectURL(blob);var a=document.createElement('a');
  a.href=url;a.download=name;document.body.appendChild(a);a.click();document.body.removeChild(a);
  setTimeout(function(){URL.revokeObjectURL(url);},1000);
}

/* ---------- レシート読み取り(Gemini API) ---------- */
var GEMINI_BASE='https://generativelanguage.googleapis.com/v1beta/models/';
var DEFAULT_MODEL='gemini-3.5-flash-lite';
function mkErr(msg){var e=new Error(msg);e.userMsg=msg;return e;}
function shrink(file){
  return new Promise(function(resolve,reject){
    var url=URL.createObjectURL(file);var im=new Image();
    im.onload=function(){
      var max=2000,w=im.naturalWidth||im.width,h=im.naturalHeight||im.height,s=Math.min(1,max/Math.max(w,h));
      var c=document.createElement('canvas');c.width=Math.max(1,Math.round(w*s));c.height=Math.max(1,Math.round(h*s));
      c.getContext('2d').drawImage(im,0,0,c.width,c.height);
      URL.revokeObjectURL(url);resolve(c.toDataURL('image/jpeg',0.85));
    };
    im.onerror=function(){URL.revokeObjectURL(url);reject(new Error('img'));};
    im.src=url;
  });
}
function callGemini(key,model,dataUrl){
  var b64=dataUrl.slice(dataUrl.indexOf(',')+1);
  var name=String(model).replace(/^models\//,'');
  var body={contents:[{role:'user',parts:[{text:B.buildReceiptPrompt(store)},{inline_data:{mime_type:'image/jpeg',data:b64}}]}],
    generationConfig:{temperature:0,response_mime_type:'application/json'}};
  var ctrl=typeof AbortController!=='undefined'?new AbortController():null;
  var timer=ctrl?setTimeout(function(){ctrl.abort();},60000):null;
  var done=function(){if(timer)clearTimeout(timer);};
  return fetch(GEMINI_BASE+encodeURIComponent(name)+':generateContent',{method:'POST',
    headers:{'Content-Type':'application/json','x-goog-api-key':key},body:JSON.stringify(body),signal:ctrl?ctrl.signal:undefined})
  .then(function(res){
    return res.text().then(function(t){
      if(!res.ok){var m='';try{m=JSON.parse(t).error.message||'';}catch(e){}throw mkErr(B.describeApiError(res.status,m));}
      var j;try{j=JSON.parse(t);}catch(e){throw mkErr('応答を解釈できませんでした');}
      var x=B.extractGeminiText(j);if(!x.ok)throw mkErr(x.msg);
      return x.text;
    });
  },function(e){
    throw mkErr(e&&e.name==='AbortError'?'時間切れになりました。もう一度試してください':'通信に失敗しました。ネットワークを確認してください(ブラウザの制限で呼び出せない場合もあります)');
  }).then(function(v){done();return v;},function(e){done();throw e;});
}
function applyReceipt(r){
  var s=S.simple;s.kind='out';
  if(r.date)s.date=r.date;
  s.desc=((r.store||'')+(r.invoice?' '+r.invoice:'')).trim();
  s.amount=r.total?String(r.total):'';
  if(r.account)s.acct=r.account;
  s.ratio='100';
  S.rcpt.state='done';S.rcpt.r=r;S.mode='simple';
  render();
}
function runRead(){
  var R=S.rcpt;if(!R)return;
  var key=gget('key');
  if(!key){R.state='error';R.msg='APIキーが未設定です。「設定」で登録してください。';render();return;}
  if(gget('consent')!=='1'){
    if(!confirm('レシートの写真を、読み取りのためGoogleのサーバーへ送信します。\n\n無料枠では、送った内容がGoogleの製品改善に使われる場合があります。顧客の書類や、個人情報が写るものには使わないでください。\n\n送信しますか?')){
      R.state='error';R.msg='送信を取りやめました。';render();return;
    }
    gset('consent','1');
  }
  R.state='busy';render();
  var id=R.id;
  callGemini(key,gget('model')||DEFAULT_MODEL,R.img).then(function(text){
    if(!S.rcpt||S.rcpt.id!==id)return;
    var p=B.parseReceipt(text,store,new Date().getFullYear());
    if(!p.ok){S.rcpt.state='error';S.rcpt.msg=p.msg;render();return;}
    applyReceipt(p.receipt);
  }).catch(function(err){
    if(!S.rcpt||S.rcpt.id!==id)return;
    S.rcpt.state='error';S.rcpt.msg=(err&&err.userMsg)||'読み取りに失敗しました';render();
  });
}
function handleFile(file){
  if(!file)return;
  shrink(file).then(function(img){S.rcpt={id:B.uid(),img:img,state:'idle'};S.tab='input';S.mode='simple';S.simple.kind='out';runRead();},
    function(){toast('画像を開けませんでした');});
}

var ACT={
  pickCam:function(){$('camIn').click();},
  pickLib:function(){$('libIn').click();},
  rcptRetry:function(){if(!gget('key')){S.tab='set';render();window.scrollTo(0,0);return;}runRead();},
  rcptDrop:function(){S.rcpt=null;render();},
  rcptZoom:function(){
    if(!S.rcpt)return;
    $('sheet').innerHTML='<img src="'+S.rcpt.img+'" alt="レシートの写真" style="width:100%;border-radius:8px"><div class="actions"><button data-act="closeSheet">閉じる</button></div>';
    $('overlay').hidden=false;
  },
  clearKey:function(){gset('key','');toast('APIキーを消去しました');render();},
  tab:function(el){S.tab=el.dataset.v;render();window.scrollTo(0,0);},
  mode:function(el){S.mode=el.dataset.v;render();},
  kind:function(el){var s=S.simple;S.rcpt=null;s.kind=el.dataset.v;s.acct=s.kind==='out'?'supply':'sales';s.pay=s.kind==='out'?'cash':'dep';render();},
  ratio:function(el){S.simple.ratio=el.dataset.v;render();},
  saveSimple:function(){
    var p=simplePreview();if(p.msg){toast(p.msg);return;}
    var s=S.simple;
    var fromReceipt=!!(S.rcpt&&S.rcpt.state==='done'&&s.kind==='out');
    var entry={id:B.uid(),ts:Date.now(),date:s.date,desc:s.desc.trim(),src:fromReceipt?'receipt':'manual',lines:p.lines};
    var prevEdit=S.editId;S.editId=null;
    if(saveEntry(entry)){s.amount='';s.desc='';S.rcpt=null;toast('保存しました');render();}else S.editId=prevEdit;
  },
  side:function(el){S.draft.lines[+el.dataset.i].side=el.dataset.v;render();},
  addrow:function(){S.draft.lines.push(blankLine('D'));render();},
  delrow:function(el){
    if(S.draft.lines.length<=2){toast('明細は2行以上必要です');return;}
    S.draft.lines.splice(+el.dataset.i,1);render();
  },
  saveJournal:function(){
    var d=S.draft;var entry={id:B.uid(),ts:Date.now(),date:d.date,desc:d.desc.trim(),src:'manual',lines:draftEntryLines()};
    if(saveEntry(entry)){
      S.editId=null;S.draft={date:d.date,desc:'',lines:[blankLine('D'),blankLine('C')]};
      toast('保存しました');render();
    }
  },
  cancelEdit:function(){S.editId=null;S.draft={date:today(),desc:'',lines:[blankLine('D'),blankLine('C')]};render();},
  edit:function(el){
    var e=store.entries.find(function(x){return x.id===el.dataset.id;});if(!e)return;
    S.draft={date:e.date,desc:e.desc,lines:e.lines.map(function(l){return {acct:l.acct,side:l.side,amount:String(l.amount)};})};
    S.editId=e.id;S.mode='journal';S.tab='input';render();window.scrollTo(0,0);
  },
  del:function(el){
    if(!confirm('この仕訳を削除しますか?'))return;
    store.entries=store.entries.filter(function(x){return x.id!==el.dataset.id;});
    if(S.editId===el.dataset.id)S.editId=null;
    save();toast('削除しました');render();
  },
  ledger:function(el){openLedger(el.dataset.id);},
  closeSheet:function(){$('overlay').hidden=true;},
  stmt:function(el){S.stmt=el.dataset.v;render();},
  print:function(){window.print();},
  carry:function(){
    var from=String(parseInt(S.year,10)-1);
    var cur=store.openings[S.year]||{};
    if(Object.keys(cur).length&&!confirm(S.year+'年の期首残高を、'+from+'年の期末残高で上書きします。よろしいですか?'))return;
    store.openings[S.year]=B.carryOver(store,from);
    save();toast(from+'年の期末残高を引き継ぎました');render();
  },
  addExp:function(){
    var inp=$('newExp');var name=inp.value.trim();
    if(!name){toast('科目名を入力してください');return;}
    if(store.custom.length>=B.MAX_CUSTOM){toast('追加できるのは'+B.MAX_CUSTOM+'つまでです');return;}
    if(B.getAccounts(store).some(function(a){return a.name===name;})){toast('同じ名前の科目があります');return;}
    store.custom.push({id:'cx'+Date.now().toString(36),name:name.slice(0,20)});
    save();render();
  },
  delExp:function(el){
    var id=el.dataset.id;
    if(store.entries.some(function(e){return e.lines.some(function(l){return l.acct===id;});})){toast('仕訳で使われているため削除できません');return;}
    store.custom=store.custom.filter(function(c){return c.id!==id;});save();render();
  },
  exportJSON:function(){
    store.meta.lastBackup=new Date().toISOString();save();
    download('bspl-backup-'+today()+'.json',JSON.stringify(store,null,1),'application/json');
    toast('バックアップを保存しました');render();
  },
  importJSON:function(){$('fileIn').click();},
  exportCSV:function(){
    var rows=['伝票番号,日付,摘要,借貸,勘定科目,金額'];
    var q=function(s){return '"'+String(s).replace(/"/g,'""')+'"';};
    B.entriesOfYear(store,S.year).slice().sort(function(a,b){return a.date<b.date?-1:a.date>b.date?1:a.ts-b.ts;}).forEach(function(e,i){
      e.lines.forEach(function(l){rows.push([i+1,e.date,q(e.desc),l.side==='D'?'借方':'貸方',q(nameOf(l.acct)),l.amount].join(','));});
    });
    download('shiwakecho-'+S.year+'.csv','﻿'+rows.join('\r\n'),'text/csv;charset=utf-8');
  },
  verifyUser:function(){
    var bad=store.users.filter(function(u){return !B.verifyUser(u);});
    var el=$('userChk');var msg=bad.length?'⚠ 不一致: '+bad.map(function(u){return u.id;}).join(',')+'(登録情報が登録時と異なります)':'✓ 登録情報は登録時から変更されていません('+store.users.length+'件を確認)';
    if(el)el.textContent=msg;toast(bad.length?'不一致があります':'検証OK');
  },
  wipe:function(){
    if(!confirm('すべてのデータを削除します。元に戻せません。よろしいですか?'))return;
    if(!confirm('本当に削除しますか?(バックアップは取りましたか?)'))return;
    var keep=store.users,cur=store.currentUser;store=B.emptyStore();store.users=keep;store.currentUser=cur;save();S.editId=null;toast('削除しました');render();
  }
};
document.addEventListener('click',function(e){
  var el=e.target.closest&&e.target.closest('[data-act]');
  if(el&&ACT[el.dataset.act]){ACT[el.dataset.act](el);return;}
  if(e.target===$('overlay'))$('overlay').hidden=true;
});
['camIn','libIn'].forEach(function(id){
  $(id).addEventListener('change',function(e){var f=e.target.files&&e.target.files[0];e.target.value='';handleFile(f);});
});
$('fileIn').addEventListener('change',function(e){
  var f=e.target.files&&e.target.files[0];if(!f)return;
  var r=new FileReader();
  r.onload=function(){
    try{
      var o=JSON.parse(r.result);
      if(!o||!Array.isArray(o.entries))throw new Error('形式が違います');
      var n=B.normalizeStore(o);
      if(!confirm('いまのデータを、バックアップ('+n.entries.length+'件の仕訳)で置き換えます。よろしいですか?'))return;
      store=n;save();S.editId=null;S.year=defaultYear();toast('復元しました');render();
    }catch(err){toast('復元できませんでした:'+err.message);}
  };
  r.readAsText(f);e.target.value='';
});

render();
})();
</script>
