<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="小説設定ノート">
<title>小説設定ノート</title>
<link rel="stylesheet" href="style.css?v=1">
</head>
<body>
<header class="app-header">
<a class="back-link" href="../../">← ハブに戻る</a>
<h1>📚 小説設定ノート</h1>
<div class="work-bar">
<select id="work-select" aria-label="作品"></select>
<p id="work-info" class="muted small"></p>
</div>
<div class="file-bar">
<label class="btn secondary" for="file-input">データを読み込む</label>
<input type="file" id="file-input" hidden>
<button id="export-btn" type="button" class="btn secondary">修正を書き出す</button>
</div>
<p id="app-status" class="status" role="status"></p>
</header>

<section id="empty-panel" class="panel onboarding" hidden>
<h2>データを読み込んでください</h2>
<p>あらすじ・固有名詞・伏線のデータは公開していません。Google Drive に置いたデータファイルを、この端末に読み込んで使います。</p>
<ol>
<li>上の「データを読み込む」を押す</li>
<li>「ブラウズ」→「Google Drive」→「shousrtsu」を開く</li>
<li><code>n6924df.novelnote.json</code> を選ぶ</li>
</ol>
<p class="muted small">読み込んだデータはこの端末の中だけに保存されます。次からは開くだけで表示されます。</p>
</section>

<nav id="tabs" class="tabs" aria-label="表示の切り替え" hidden>
<a href="#episodes" data-tab="episodes">あらすじ</a>
<a href="#terms" data-tab="terms">辞書</a>
<a href="#threads" data-tab="threads">伏線</a>
</nav>

<main id="view" class="view"></main>

<script src="app.js?v=1"></script>
</body>
</html>
