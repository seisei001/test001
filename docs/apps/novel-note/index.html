<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="小説設定ノート">
<title>小説設定ノート</title>
<link rel="stylesheet" href="style.css?v=4">
</head>
<body>
<header class="app-header">
<a class="back-link" href="../../">← ハブに戻る</a>
<h1>📚 小説設定ノート</h1>
<div class="work-bar">
<select id="work-select" aria-label="作品"></select>
<p id="work-info" class="muted small"></p>
</div>
<div class="file-bar">
<label class="btn secondary" for="file-input">ファイルから読み込む</label>
<input type="file" id="file-input" hidden>
<a id="update-btn" class="btn" href="#update">データ更新を依頼</a>
<button id="export-btn" type="button" class="btn secondary">修正を書き出す</button>
</div>
<p id="app-status" class="status" role="status"></p>
</header>

<section id="empty-panel" class="panel onboarding" hidden>
<h2>データがまだありません</h2>
<p>ネットにつながった状態で開き直すと、ハブに置かれた暗号化データを自動で読み込みます。</p>
<p class="muted small">ファイルで受け取ったデータ(<code>.novelnote.json</code>)がある場合は、上の「ファイルから読み込む」でも読み込めます。</p>
</section>

<nav id="tabs" class="tabs" aria-label="表示の切り替え" hidden>
<a href="#episodes" data-tab="episodes">あらすじ</a>
<a href="#terms" data-tab="terms">辞書</a>
<a href="#threads" data-tab="threads">伏線</a>
</nav>

<main id="view" class="view"></main>

<script src="app.js?v=4"></script>
</body>
</html>
