<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ひとことメモ">
<title>ひとことメモ</title>
<style>
:root{color-scheme:light dark;--bg:#f7f7f8;--panel-bg:#fff;--border:#dcdce0;--text:#1c1c1f;--muted:#6b6b73;--accent:#2563eb;--accent-hover:#1d4ed8;--danger:#dc2626;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html{-webkit-text-size-adjust:100%;}
body{margin:0;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic",sans-serif;background:var(--bg);color:var(--text);line-height:1.6;}
header{padding:16px;max-width:640px;margin:0 auto;}
.back-link{display:inline-block;margin-bottom:8px;color:var(--muted);text-decoration:none;font-size:0.85rem;}
header h1{margin:0 0 4px;font-size:1.3rem;}
main{max-width:640px;margin:0 auto;padding:0 16px 48px;display:flex;flex-direction:column;gap:16px;}
.panel{background:var(--panel-bg);border:1px solid var(--border);border-radius:10px;padding:16px;}
textarea{width:100%;padding:10px;border:1px solid var(--border);border-radius:8px;background:var(--panel-bg);color:var(--text);font-family:inherit;font-size:16px;resize:vertical;min-height:70px;}
button{border:none;border-radius:8px;padding:12px 16px;min-height:44px;font-size:0.95rem;cursor:pointer;background:var(--accent);color:#fff;margin-top:8px;width:100%;}
button:hover{background:var(--accent-hover);}
ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;}
li{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;background:var(--panel-bg);border:1px solid var(--border);border-radius:10px;padding:12px;}
.memo-text{white-space:pre-wrap;word-break:break-word;flex:1;}
.memo-time{display:block;color:var(--muted);font-size:0.75rem;margin-top:4px;}
.del-btn{flex-shrink:0;background:transparent;color:var(--danger);border:1px solid var(--danger);width:auto;min-height:36px;padding:6px 10px;margin-top:0;font-size:0.8rem;}
.empty{color:var(--muted);font-size:0.9rem;}
@media (prefers-color-scheme: dark){
:root{--bg:#17181c;--panel-bg:#1f2024;--border:#303136;--text:#eaeaec;--muted:#9a9aa2;}
}
</style>
</head>
<body>
<header>
<a class="back-link" href="../../">← ハブに戻る</a>
<h1>📝 ひとことメモ</h1>
</header>
<main>
<section class="panel">
<textarea id="memo-input" rows="3" placeholder="思いついたことを入力..."></textarea>
<button id="add-btn" type="button">追加する</button>
</section>
<section>
<ul id="memo-list"></ul>
</section>
</main>
<script>
(() => {
  const STORAGE_KEY = 'helloMemoApp.notes.v1';
  const input = document.getElementById('memo-input');
  const addBtn = document.getElementById('add-btn');
  const list = document.getElementById('memo-list');

  function load() {
    try {
      return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
    } catch {
      return [];
    }
  }

  function save(notes) {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(notes));
    } catch {
      // localStorageが使えない環境では保存をあきらめる
    }
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function render() {
    const notes = load();
    if (notes.length === 0) {
      list.innerHTML = '<p class="empty">まだメモがありません。</p>';
      return;
    }
    list.innerHTML = '';
    notes.forEach((note) => {
      const li = document.createElement('li');
      const time = new Date(note.createdAt).toLocaleString('ja-JP');
      li.innerHTML = `
        <div class="memo-text">${escapeHtml(note.text)}<span class="memo-time">${time}</span></div>
        <button class="del-btn" type="button" data-id="${note.id}">削除</button>
      `;
      list.appendChild(li);
    });
  }

  addBtn.addEventListener('click', () => {
    const text = input.value.trim();
    if (!text) return;
    const notes = load();
    notes.unshift({ id: Date.now(), text, createdAt: Date.now() });
    save(notes);
    input.value = '';
    render();
  });

  list.addEventListener('click', (e) => {
    const btn = e.target.closest('.del-btn');
    if (!btn) return;
    const id = Number(btn.dataset.id);
    const notes = load().filter((n) => n.id !== id);
    save(notes);
    render();
  });

  render();
})();
</script>
</body>
</html>
