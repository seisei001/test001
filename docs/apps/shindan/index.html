<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>簡易診断(試作版)</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--text:#1d2530;--muted:#667085;--line:#dfe3ea;--accent:#1f5fbf;--accent-bg:#e8f0fc;
--low:#1a7f4b;--lowbg:#e5f5ec;--mid:#a15c00;--midbg:#fff1dc;--high:#b42318;--highbg:#fde8e6;--warn:#7a2e0e;--warnbg:#fff4e5}
@media (prefers-color-scheme:dark){:root{--bg:#12161c;--card:#1b212b;--text:#e8ecf2;--muted:#9aa5b5;--line:#2c3544;--accent:#6ea4f4;--accent-bg:#1d2a40;
--low:#5fd28f;--lowbg:#143222;--mid:#f0b45a;--midbg:#3a2a10;--high:#ff8f84;--highbg:#3c1a17;--warn:#ffd8b0;--warnbg:#3a2616}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.7 -apple-system,"Hiragino Sans","Noto Sans JP",sans-serif}
.wrap{max-width:640px;margin:0 auto;padding:0 16px 48px}
.hub{display:inline-flex;align-items:center;min-height:44px;color:var(--accent);text-decoration:none;font-size:14px}
.proto{background:var(--warnbg);color:var(--warn);font-size:13px;padding:8px 16px;text-align:center;line-height:1.5}
h1{font-size:20px;margin:20px 0 6px}
.lead{color:var(--muted);margin:0 0 16px;font-size:15px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin:12px 0}
button{font:inherit;color:inherit;cursor:pointer}
.choice{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;text-align:left;padding:12px 14px;margin:8px 0;
background:var(--card);border:1px solid var(--line);border-radius:12px}
.choice:hover,.choice:focus-visible{border-color:var(--accent);background:var(--accent-bg);outline:none}
.choice .ic{font-size:22px;flex:none}
.choice.sub{color:var(--muted);font-size:15px}
.progress{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:12px 0}
.progress i{display:block;height:100%;background:var(--accent);transition:width .25s}
.qno{color:var(--muted);font-size:13px;margin:0}
.qtext{font-size:18px;font-weight:600;margin:6px 0 14px}
.back{background:none;border:none;color:var(--muted);min-height:44px;padding:0 4px;font-size:14px}
.badge{display:inline-block;padding:4px 14px;border-radius:999px;font-weight:700;font-size:15px}
.badge.l0{background:var(--lowbg);color:var(--low)}.badge.l1{background:var(--midbg);color:var(--mid)}.badge.l2{background:var(--highbg);color:var(--high)}
h2{font-size:17px;margin:18px 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.chip{background:var(--accent-bg);color:var(--accent);border-radius:999px;padding:2px 10px;font-size:13px}
.syn{margin:6px 0;padding:10px 12px;border-left:3px solid var(--accent);background:var(--accent-bg);border-radius:0 8px 8px 0;font-size:14px}
.expert{border-top:1px solid var(--line);padding:10px 0;font-size:14px}.expert:first-of-type{border-top:none}
.expert b{font-size:15px}
.note{font-size:12.5px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 20px;border-radius:12px;border:1px solid var(--accent);background:var(--accent);color:#fff;font-weight:600;margin:6px 8px 0 0}
.btn.ghost{background:none;color:var(--accent)}
</style>
</head>
<body>
<div class="proto">試作版・非公開(内容はすべて仮置きです。公開前に専門家・各士業団体等で確認が必要です)</div>
<div class="wrap"><a class="hub" href="../../">← ハブに戻る</a><div id="app"></div></div>
<script src="engine.js"></script>
</body>
</html>
