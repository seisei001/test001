<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="アプリハブ">
<title>アプリハブ</title>
<style>
:root{color-scheme:light dark;--bg:#f7f7f8;--panel-bg:#fff;--border:#dcdce0;--text:#1c1c1f;--muted:#6b6b73;--accent:#2563eb;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html{-webkit-text-size-adjust:100%;}
body{margin:0;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic",sans-serif;background:var(--bg);color:var(--text);line-height:1.6;}
header{padding:24px 16px 8px;max-width:640px;margin:0 auto;}
header h1{margin:0 0 6px;font-size:1.4rem;}
.subtitle{margin:0;color:var(--muted);font-size:0.9rem;}
main{max-width:640px;margin:0 auto;padding:8px 16px 48px;display:flex;flex-direction:column;gap:12px;}
.app-card{display:flex;align-items:center;gap:14px;background:var(--panel-bg);border:1px solid var(--border);border-radius:12px;padding:16px;text-decoration:none;color:var(--text);min-height:44px;}
.app-card:active{opacity:0.8;}
.app-icon{font-size:1.8rem;line-height:1;flex-shrink:0;}
.app-name{margin:0 0 2px;font-size:1.05rem;font-weight:600;}
.app-desc{margin:0;color:var(--muted);font-size:0.85rem;}
.archive-btn{display:flex;align-items:center;gap:14px;background:transparent;border:1px dashed var(--border);border-radius:12px;padding:14px 16px;color:var(--muted);font:inherit;font-size:0.95rem;min-height:44px;width:100%;text-align:left;cursor:pointer;}
.archive-list{display:none;flex-direction:column;gap:10px;}
.archive-list.open{display:flex;}
.archive-list .app-card{opacity:.8;}
.folder-btn{display:flex;align-items:center;gap:12px;background:var(--panel-bg);border:1px solid var(--border);border-radius:12px;padding:14px 16px;color:var(--text);font:inherit;font-size:1.02rem;font-weight:600;min-height:44px;width:100%;text-align:left;cursor:pointer;}
.folder-btn .cnt{margin-left:auto;color:var(--muted);font-weight:400;font-size:.85rem;}
.folder-box{display:none;flex-direction:column;gap:10px;margin-left:14px;padding-left:12px;border-left:2px solid var(--border);}
.folder-box.open{display:flex;}
.empty,.error{color:var(--muted);font-size:0.9rem;padding:16px;}
footer{max-width:640px;margin:0 auto;padding:0 16px 32px;color:var(--muted);font-size:0.8rem;}
@media (prefers-color-scheme: dark){
:root{--bg:#17181c;--panel-bg:#1f2024;--border:#303136;--text:#eaeaec;--muted:#9a9aa2;}
}
</style>
</head>
<body>
<header>
<h1>アプリハブ</h1>
<p class="subtitle">ここに追加したミニアプリが並びます。タップして開いてください。</p>
</header>
<main id="app-list">
<p class="empty">読み込み中...</p>
</main>
<footer>
ホーム画面に追加するとアプリのように使えます(共有ボタン →「ホーム画面に追加」)。
</footer>
<script>
(async () => {
  const listEl = document.getElementById('app-list');
  try {
    const res = await fetch('apps.json', { cache: 'no-store' });
    if (!res.ok) throw new Error('apps.json の取得に失敗しました');
    const apps = await res.json();
    if (!Array.isArray(apps) || apps.length === 0) {
      listEl.innerHTML = '<p class="empty">まだアプリがありません。</p>';
      return;
    }
    listEl.innerHTML = '';
    const card = (app) => {
      const a = document.createElement('a');
      a.className = 'app-card';
      a.href = app.path;
      a.innerHTML = `
        <span class="app-icon">${app.icon || '📱'}</span>
        <span>
          <p class="app-name">${app.name || app.id}</p>
          <p class="app-desc">${app.description || ''}</p>
        </span>
      `;
      return a;
    };
    const tree = { apps: [], kids: new Map() };
    for (const app of apps) {
      let node = tree;
      const path = app.folder || (app.archive ? ['🗄️ 過去の作品'] : []);
      for (const name of path) {
        if (!node.kids.has(name)) node.kids.set(name, { apps: [], kids: new Map() });
        node = node.kids.get(name);
      }
      node.apps.push(app);
    }
    const count = (n) => n.apps.length + [...n.kids.values()].reduce((s, k) => s + count(k), 0);
    const render = (node, parent) => {
      const kids = [...node.kids].sort((x, y) => x[0].includes('過去') - y[0].includes('過去'));
      const nowKids = kids.filter(k => !k[0].includes('過去')), oldKids = kids.filter(k => k[0].includes('過去'));
      if (node === tree) { var first = nowKids; var last = oldKids; } else { first = []; last = kids; }
      const doKids = (list) => { for (const [name, kid] of list) {
        const isOld = name.includes('過去');
        const icon = name.match(/^\p{Extended_Pictographic}/u);
        const label = icon ? name : '📁 ' + name;
        const btn = document.createElement('button');
        btn.className = isOld && node === tree ? 'archive-btn' : 'folder-btn';
        btn.type = 'button';
        const box = document.createElement('div');
        box.className = 'folder-box';
        const set = (o) => { btn.innerHTML = `<span>${label}</span><span class="cnt">${count(kid)}件 ${o ? '▲' : '▼'}</span>`; };
        set(false);
        btn.onclick = () => { set(box.classList.toggle('open')); };
        render(kid, box);
        parent.appendChild(btn);
        parent.appendChild(box);
      } };
      doKids(first);
      for (const app of node.apps) parent.appendChild(card(app));
      doKids(last);
    };
    render(tree, listEl);
  } catch (err) {
    listEl.innerHTML = `<p class="error">読み込みエラー: ${err.message}</p>`;
  }
})();
</script>
</body>
</html>
