<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="アプリハブ">
<title>アプリハブ</title>
<style>
:root{color-scheme:light dark;--bg:#f7f7f8;--panel-bg:#fff;--border:#dcdce0;--text:#1c1c1f;--muted:#6b6b73;--accent:#2563eb;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html{-webkit-text-size-adjust:100%;}
body{margin:0;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic",sans-serif;background:var(--bg);color:var(--text);line-height:1.6;}
header{padding:24px 16px 8px;max-width:640px;margin:0 auto;}
header h1{margin:0 0 6px;font-size:1.4rem;}
.subtitle{margin:0;color:var(--muted);font-size:0.9rem;}
main{max-width:640px;margin:0 auto;padding:8px 16px 48px;display:flex;flex-direction:column;gap:12px;}
.app-card{display:flex;align-items:center;gap:14px;background:var(--panel-bg);border:1px solid var(--border);border-radius:12px;padding:16px;text-decoration:none;color:var(--text);min-height:44px;}
.app-card:active{opacity:0.8;}
.app-icon{font-size:1.8rem;line-height:1;flex-shrink:0;}
.app-name{margin:0 0 2px;font-size:1.05rem;font-weight:600;}
.app-desc{margin:0;color:var(--muted);font-size:0.85rem;}
.empty,.error{color:var(--muted);font-size:0.9rem;padding:16px;}
footer{max-width:640px;margin:0 auto;padding:0 16px 32px;color:var(--muted);font-size:0.8rem;}
@media (prefers-color-scheme: dark){
:root{--bg:#17181c;--panel-bg:#1f2024;--border:#303136;--text:#eaeaec;--muted:#9a9aa2;}
}
</style>
</head>
<body>
<header>
<h1>アプリハブ</h1>
<p class="subtitle">ここに追加したミニアプリが並びます。タップして開いてください。</p>
</header>
<main id="app-list">
<p class="empty">読み込み中...</p>
</main>
<footer>
ホーム画面に追加するとアプリのように使えます(共有ボタン →「ホーム画面に追加」)。
</footer>
<script>
(async () => {
  const listEl = document.getElementById('app-list');
  try {
    const res = await fetch('apps.json', { cache: 'no-store' });
    if (!res.ok) throw new Error('apps.json の取得に失敗しました');
    const apps = await res.json();
    if (!Array.isArray(apps) || apps.length === 0) {
      listEl.innerHTML = '<p class="empty">まだアプリがありません。</p>';
      return;
    }
    listEl.innerHTML = '';
    for (const app of apps) {
      const a = document.createElement('a');
      a.className = 'app-card';
      a.href = app.path;
      a.innerHTML = `
        <span class="app-icon">${app.icon || '📱'}</span>
        <span>
          <p class="app-name">${app.name || app.id}</p>
          <p class="app-desc">${app.description || ''}</p>
        </span>
      `;
      listEl.appendChild(a);
    }
  } catch (err) {
    listEl.innerHTML = `<p class="error">読み込みエラー: ${err.message}</p>`;
  }
})();
</script>
</body>
</html>
