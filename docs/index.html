<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="URLビューア">
<title>URLリンク内容ビューア</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="app-header">
  <h1>URLリンク内容ビューア</h1>
  <p class="subtitle">URLを改行区切りで入力すると、1行目から順番にページ内容を表示します。</p>
</header>

<main>
  <section class="panel" id="load-panel">
    <h2>URLを入力</h2>
    <textarea id="url-textarea" rows="6" placeholder="https://example.com&#10;https://example.org&#10;..."></textarea>
    <div class="load-row">
      <label class="file-label">
        テキストファイルから読み込む
        <input type="file" id="file-input" accept=".txt,text/plain">
      </label>
      <button id="start-btn" type="button">読み込み開始</button>
    </div>
    <p id="load-status" class="status"></p>
  </section>

  <section class="panel" id="view-panel" hidden>
    <div class="current-url-row">
      <span id="progress" class="progress"></span>
      <a id="current-url" href="#" target="_blank" rel="noopener noreferrer"></a>
    </div>
    <h3 id="current-title"></h3>
    <div id="fetch-status" class="status"></div>
    <p class="hint">必要な部分だけ残すように自由に編集できます(「内容を保管」でこの内容がダウンロードされます)。</p>
    <textarea id="content-editor" rows="12"></textarea>
    <p id="nav-status" class="status error" role="alert"></p>

    <nav class="menu-bar" aria-label="操作メニュー">
      <button id="next-btn" type="button" class="menu-btn">次</button>
      <button id="prev-btn" type="button" class="menu-btn">前</button>
      <button id="store-btn" type="button" class="menu-btn primary">内容を保管</button>
      <button id="finish-btn" type="button" class="menu-btn danger">終了</button>
    </nav>
  </section>
</main>

<script src="app.js"></script>
</body>
</html>
