<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>自律で動く女性アバター</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="scene" class="scene">
    <div class="sky">
      <div class="sun"></div>
      <div class="cloud cloud-a"></div>
      <div class="cloud cloud-b"></div>
      <div class="cloud cloud-c"></div>
    </div>
    <div class="grass"></div>

    <div id="avatar" class="avatar" role="img" aria-label="自律で動く女性のアバター">
      <div class="avatar-mood" aria-hidden="true"></div>
      <div class="avatar-sprite"></div>
    </div>
  </div>

  <p class="hint">操作はありません。アバターが自律的に歩いたり考えたりする様子をただ眺めるページです。</p>

  <script type="module" src="js/main.js"></script>
</body>
</html>
