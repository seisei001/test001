<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>URLリンク内容ビューア</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="app-header">
  <h1>URLリンク内容ビューア</h1>
  <p class="subtitle">URLが書かれたテキストファイルを読み込み、1件ずつ内容を確認して必要な部分を保存し、まとめてダウンロードできます。</p>
</header>

<main>
  <section class="panel" id="load-panel">
    <h2>1. URLリストを読み込む</h2>
    <div class="load-row">
      <label class="file-label">
        テキストファイルを選択(1行に1URL)
        <input type="file" id="file-input" accept=".txt,text/plain">
      </label>
      <span class="or">または</span>
      <button id="paste-toggle" type="button" class="secondary">直接貼り付け</button>
    </div>
    <textarea id="url-textarea" placeholder="https://example.com&#10;https://example.org&#10;..." hidden></textarea>
    <div class="load-row">
      <button id="start-btn" type="button">読み込み開始</button>
      <span id="load-status" class="status"></span>
    </div>
  </section>

  <section class="panel" id="view-panel" hidden>
    <h2>2. 内容を確認して必要な部分を保存</h2>
    <div class="nav-row">
      <button id="prev-btn" type="button">← 前へ</button>
      <span id="progress" class="progress"></span>
      <button id="next-btn" type="button">次へ →</button>
      <button id="refetch-btn" type="button" class="secondary">再取得</button>
    </div>
    <div class="current-url-row">
      <a id="current-url" href="#" target="_blank" rel="noopener noreferrer"></a>
    </div>
    <div id="fetch-status" class="status"></div>
    <h3 id="current-title"></h3>
    <p class="hint">下のテキストは自動抽出した本文です。必要な部分だけ残すよう自由に編集してから「リストに追加」を押してください。</p>
    <textarea id="content-editor" rows="14"></textarea>
    <div class="load-row">
      <button id="add-btn" type="button">この内容をリストに追加</button>
      <button id="copy-btn" type="button" class="secondary">クリップボードにコピー</button>
      <button id="skip-btn" type="button" class="secondary">追加せず次へ</button>
    </div>
  </section>

  <section class="panel" id="collected-panel" hidden>
    <h2>3. 保存済みの内容</h2>
    <div id="collected-list" class="collected-list"></div>
    <div class="load-row">
      <button id="download-btn" type="button">まとめてダウンロード</button>
      <button id="clear-all-btn" type="button" class="danger">全てクリア</button>
      <span id="collected-count" class="status"></span>
    </div>
  </section>
</main>

<script src="app.js"></script>
</body>
</html>
